<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Incidents review, Aug 25</title>
<style>
:root{--blue:#4A6FA5;--deep:#35507A;--olive:#7B8458;--amber:#9A6B12;
--panel:#F4F6F9;--line:#dfe4ea;--ink:#22282f;--soft:#6b7683;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px;
color:var(--ink);background:var(--panel);-webkit-font-smoothing:antialiased}
.wrap{display:flex;min-height:100vh;align-items:stretch}
.side{width:360px;flex:0 0 360px;background:var(--white);border-right:1px solid var(--line);
padding:18px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side h1{font-size:15px;font-weight:500;margin:0 20px 3px;color:var(--deep)}
.side .sub{font-size:11.5px;color:var(--soft);margin:0 20px 14px}
.func{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
color:var(--soft);margin:16px 20px 5px}
.ptab{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;
border-left:3px solid transparent;padding:6px 16px 6px 17px;cursor:pointer;font:inherit;
color:var(--ink);line-height:1.35;font-size:13px}
.ptab:hover{background:var(--panel)}
.ptab.on{background:#EEF4FB;border-left-color:var(--blue);color:var(--deep);font-weight:500}
.ptab .num{color:var(--soft);flex:0 0 44px;font-size:12px}
.ptab.on .num{color:var(--blue)}
.dot{flex:0 0 6px;height:6px;border-radius:50%;background:transparent;margin-top:6px}
.dot.need{background:var(--amber)}
.main{flex:1;padding:30px 46px 70px;max-width:900px;min-width:0}
.main .eyebrow{font-size:10.5px;font-weight:700;text-transform:uppercase;
letter-spacing:.09em;color:var(--olive);margin:0 0 6px}
.main h2{font-size:23px;font-weight:500;color:var(--deep);margin:0 0 6px;line-height:1.25}
.meta{font-size:12.5px;color:var(--soft);margin:0 0 4px}
.meta a{color:var(--blue);text-decoration:none}
.meta a:hover{text-decoration:underline}
.lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
color:var(--soft);margin:24px 0 7px}
.main p{margin:0 0 10px;line-height:1.62}
.main ul,.main ol{margin:2px 0 12px;padding-left:20px}
.main li{margin:0 0 6px;line-height:1.55}
.main h4{font-size:13.5px;font-weight:700;color:var(--deep);margin:18px 0 6px}
.main code{background:#eef1f5;padding:1px 5px;border-radius:3px;font-size:12.5px}
.main img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:4px;margin:6px 0 12px}
.main blockquote{margin:0 0 10px;padding:8px 14px;background:var(--white);
border-left:3px solid var(--line);border-radius:3px}
.pill{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:10px;
background:#EEF4FB;color:var(--deep);border:1px solid #d6e3f3;margin-left:7px;vertical-align:3px}
.pill.warn{background:#FDF3E7;color:var(--amber);border-color:#f0dcc0}
.pill.new{background:#EFF3E9;color:var(--olive);border-color:#dbe3cd}
.body{background:var(--white);border:1px solid var(--line);border-radius:4px;padding:18px 20px 8px}
.ac{background:#EEF4FB;border:1px solid #d6e3f3;border-radius:4px;padding:16px 20px 6px}
.ac .lbl{margin:0 0 6px;color:var(--deep)}
.open{background:var(--white);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:4px;padding:13px 16px;margin:0 0 4px}
.open .lbl{margin:0 0 5px;color:var(--blue)}
.open p{margin:0 0 6px}
.open .who{font-weight:500;color:var(--deep)}
.open .quote{font-size:13px;color:var(--soft);border-left:2px solid var(--line);padding-left:10px;margin:8px 0 0}
.chg{background:var(--white);border:1px solid var(--line);border-left:3px solid var(--olive);
border-radius:4px;padding:13px 16px;margin:0 0 4px}
.chg .lbl{margin:0 0 5px;color:var(--olive)}
.chg p{margin:0}
.ask{margin:26px 0 0;padding:15px 17px;background:#FDF3E7;border:1px solid #f0dcc0;
border-left:3px solid var(--amber);border-radius:4px}
.ask .lbl{margin:0 0 6px;color:var(--amber)}
.ask p{margin:0;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <nav class="side">
    <h1>Incidents review</h1>
    <p class="sub">Answers needed, then existing tickets, then new ones</p>
    <div id="nav"></div>
  </nav>
  <main class="main" id="pane"></main>
</div>
<script>
/*DATA*/
const nav = document.getElementById('nav'), pane = document.getElementById('pane');
groups.forEach(g => {
  const list = items.map((it, i) => ({it, i})).filter(x => x.it.g === g);
  if (!list.length) return;
  const h = document.createElement('div');
  h.className = 'func';
  h.textContent = g + (list.length > 1 ? '  (' + list.length + ')' : '');
  nav.appendChild(h);
  list.forEach(({it, i}) => {
    const b = document.createElement('button');
    b.className = 'ptab'; b.dataset.i = i;
    b.innerHTML = '<span class="dot' + (it.a ? ' need' : '') + '"></span>' +
                  '<span class="num">' + it.n + '</span><span>' + it.t + '</span>';
    b.onclick = () => show(i);
    nav.appendChild(b);
  });
});
function show(i){
  const it = items[i];
  document.querySelectorAll('.ptab').forEach(t => t.classList.toggle('on', t.dataset.i == i));
  const isTicket = it.n.charAt(0) === '#';
  const link = isTicket
    ? '<a href="https://github.com/tyler-technologies/transportation-incidents/issues/' +
      it.n.slice(1) + '" target="_blank">' + it.n + ' on GitHub</a>'
    : '';
  const warn = (it.st === 'No status' || it.st === 'Decision') ? ' warn' : '';
  const kind = it.kind && it.kind !== 'Existing'
    ? '<span class="pill new">' + it.kind + '</span>' : '';
  pane.innerHTML =
    '<p class="eyebrow">' + it.g + '</p>' +
    '<h2>' + it.t + '<span class="pill' + warn + '">' + it.st + '</span>' + kind + '</h2>' +
    (link ? '<p class="meta">' + link + '</p>' : '') +
    '<p class="lbl">In one line</p><p>' + it.sum + '</p>' +
    (it.owner ? '<p class="meta">' + it.owner + '</p>' : '') +
    (it.closes ? '<div class="chg"><p class="lbl">What changed</p><p>' + it.closes + '</p></div>' : '') +
    (it.adds ? '<p class="lbl">What we posted on the ticket</p><div class="ac">' + it.adds + '</div>' : '') +
    (it.body ? '<p class="lbl">The ticket as written</p><div class="body">' + it.body + '</div>' : '') +
    (it.ac ? '<p class="lbl">Acceptance criteria, what QA tests</p><div class="ac">' + it.ac + '</div>' : '') +
    (it.a ? '<div class="ask"><p class="lbl">Needs an answer</p><p>' + it.a + '</p></div>' : '');
  window.scrollTo(0, 0);
}
show(0);
</script>
</body>
</html>
