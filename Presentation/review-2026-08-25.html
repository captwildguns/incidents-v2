<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--blue:#4A6FA5;--deep:#35507A;--olive:#7B8458;--amber:#9A6B12;
--panel:#F4F6F9;--line:#dfe4ea;--ink:#22282f;--soft:#6b7683;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px;
color:var(--ink);background:var(--panel);-webkit-font-smoothing:antialiased}
.wrap{display:flex;min-height:100vh;align-items:stretch}
.side{width:360px;flex:0 0 360px;background:var(--white);border-right:1px solid var(--line);
padding:18px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side h1{font-size:15px;font-weight:500;margin:0 20px 3px;color:var(--deep)}
.side .sub{font-size:11.5px;color:var(--soft);margin:0 20px 14px}
.func{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
color:var(--soft);margin:16px 20px 5px}
.ptab{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;
border-left:3px solid transparent;padding:6px 16px 6px 17px;cursor:pointer;font:inherit;
color:var(--ink);line-height:1.35;font-size:13px}
.ptab:hover{background:var(--panel)}
.ptab.on{background:#EEF4FB;border-left-color:var(--blue);color:var(--deep);font-weight:500}
.ptab .num{color:var(--soft);flex:0 0 44px;font-size:12px}
.ptab.on .num{color:var(--blue)}
.dot{flex:0 0 6px;height:6px;border-radius:50%;background:transparent;margin-top:6px}
.dot.need{background:var(--amber)}
.main{flex:1;padding:30px 46px 70px;max-width:900px;min-width:0}
.main .eyebrow{font-size:10.5px;font-weight:700;text-transform:uppercase;
letter-spacing:.09em;color:var(--olive);margin:0 0 6px}
.main h2{font-size:23px;font-weight:500;color:var(--deep);margin:0 0 6px;line-height:1.25}
.meta{font-size:12.5px;color:var(--soft);margin:0 0 4px}
.meta a{color:var(--blue);text-decoration:none}
.meta a:hover{text-decoration:underline}
.lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
color:var(--soft);margin:24px 0 7px}
.main p{margin:0 0 10px;line-height:1.62}
.main ul,.main ol{margin:2px 0 12px;padding-left:20px}
.main li{margin:0 0 6px;line-height:1.55}
.main h4{font-size:13.5px;font-weight:700;color:var(--deep);margin:18px 0 6px}
.main code{background:#eef1f5;padding:1px 5px;border-radius:3px;font-size:12.5px}
.main img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:4px;margin:6px 0 12px}
.main blockquote{margin:0 0 10px;padding:8px 14px;background:var(--white);
border-left:3px solid var(--line);border-radius:3px}
.pill{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:10px;
background:#EEF4FB;color:var(--deep);border:1px solid #d6e3f3;margin-left:7px;vertical-align:3px}
.pill.warn{background:#FDF3E7;color:var(--amber);border-color:#f0dcc0}
.pill.new{background:#EFF3E9;color:var(--olive);border-color:#dbe3cd}
.body{background:var(--white);border:1px solid var(--line);border-radius:4px;padding:18px 20px 8px}
.ac{background:#EEF4FB;border:1px solid #d6e3f3;border-radius:4px;padding:16px 20px 6px}
.ac .lbl{margin:0 0 6px;color:var(--deep)}
.open{background:var(--white);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:4px;padding:13px 16px;margin:0 0 4px}
.open .lbl{margin:0 0 5px;color:var(--blue)}
.open p{margin:0 0 6px}
.open .who{font-weight:500;color:var(--deep)}
.open .quote{font-size:13px;color:var(--soft);border-left:2px solid var(--line);padding-left:10px;margin:8px 0 0}
.chg{background:var(--white);border:1px solid var(--line);border-left:3px solid var(--olive);
border-radius:4px;padding:13px 16px;margin:0 0 4px}
.chg .lbl{margin:0 0 5px;color:var(--olive)}
.chg p{margin:0}
.ask{margin:26px 0 0;padding:15px 17px;background:#FDF3E7;border:1px solid #f0dcc0;
border-left:3px solid var(--amber);border-radius:4px}
.ask .lbl{margin:0 0 6px;color:var(--amber)}
.ask p{margin:0;line-height:1.6}
</style>
</head>

<script>
const items = [{"g": "Start here", "n": "Overview", "t": "How this review is ordered", "st": "Read first", "kind": "", "changed": "", "sum": "Open work first, then the new tickets, then what is left to decide. Every item shows the ticket as written, with acceptance criteria called out so QA can see what it is testing.", "body": "<p>Order follows how the room asked for it: what is open today, then what is new, then the decisions that are still outstanding.</p>\n<ul>\n<li>Open tickets, before 191. The existing work, still open, with its board status.</li>\n<li>New tickets, 191 and up. Written this weekend, plus the four that changed this morning.</li>\n<li>What is left to work on. Decisions rather than tickets, each needing an answer.</li>\n<li>Backlog, not this release. Visible so it is clear what is deliberately out.</li>\n</ul>\n<p>An amber dot in the list marks anything that needs a decision or a rewrite. Anything without a dot is written and ready to estimate.</p>", "ac": "", "a": "", "owner": "", "why": "", "last": {}}, {"g": "Open tickets, before 191", "n": "#70", "t": "Dashboard: Populate Live Data for Tiles & Graphs", "st": "Working on it", "kind": "Existing", "changed": "", "sum": "Generate a query to grab the data for a live dashboard page. This should call to get the data live during page load. Strategy for V2 here", "body": "<p>Generate a query to grab the data for a live dashboard page. This should call to get the data live during page load. Strategy for V2 here</p>\n<img src=\"https://github.com/user-attachments/assets/b5fc1ae6-de2d-4847-b94b-07208146ec3f\" alt=\"\">\n<h4>Dashboard Components (migrated from transportation-traversa)</h4>\n<p>The following UI components feed data into this ticket&#x27;s scope:</p>\n<ul>\n<li><strong>Incident KPI Cards</strong> — 5 Incident KPIs</li>\n<li><strong>Incidents by Type Pie Chart</strong> — Pie chart showing incidents by type</li>\n<li><strong>Incidents by Vehicle Bar Chart</strong> — Horizontal bar chart of incident count by vehicle *(note: per @Justin-Smith comment, &quot;incidents by driver&quot; was changed to vehicle)*</li>\n<li><strong>Incidents by Day of Week Chart</strong> — Vertical bar chart of incidents by day of the week</li>\n</ul>", "ac": "", "a": "", "owner": "Justin Smith", "why": "In progress on the board.", "last": {}}, {"g": "Open tickets, before 191", "n": "#71", "t": "Dashboard: Caching Strategy", "st": "No status", "kind": "Existing", "changed": "", "sum": "Create a job that runs hourly to pull all the dashboard related data.", "body": "<p>Create a job that runs hourly to pull all the dashboard related data.</p>\n<ul>\n<li>Cache the data</li>\n<li>User pulls from the cached data and categorizes it if needed for MDM (otherwise cache data is fine)</li>\n</ul>\n<p>-</p>", "ac": "", "a": "", "owner": "Unassigned", "why": "Never triaged. No owner, no comments, and no board status, so nothing has been said about it since it was created.", "last": {}}, {"g": "Open tickets, before 191", "n": "#74", "t": "Incidents: Workflow Progress Tile", "st": "No status", "kind": "Existing", "changed": "", "sum": "Incidents may have multiple students and thus progress is based on a per student basis. If a user has 1 student associated to an incident show the incidents card as is, but if they have multiple have a card per student.", "body": "<p>Incidents may have multiple students and thus progress is based on a per student basis. If a user has 1 student associated to an incident show the incidents card as is, but if they have multiple have a card per student.</p>\n<img src=\"https://github.com/user-attachments/assets/78721970-0076-4430-8aeb-11464153e6af\" alt=\"\">", "ac": "", "a": "", "owner": "Unassigned", "why": "Only migration notes on it, nothing recorded since it came over from traversa.", "last": {}}, {"g": "Open tickets, before 191", "n": "#75", "t": "Incidents: New Modal", "st": "Rollup", "kind": "Existing", "changed": "Unchanged. The per-person description field was dropped, confirmed on the ticket.", "sum": "Utilize forge step tool to create a better user experience for navigating the new incident creation.", "body": "<p>Utilize forge step tool to create a better user experience for navigating the new incident creation.</p>\n<img src=\"https://github.com/user-attachments/assets/fac1ec58-59e7-45be-b9ca-a83a72dd47f3\" alt=\"\">", "ac": "", "a": "", "owner": "Jon Jungman, Kristen Michalski", "why": "A parent item whose board status rolls up from its subitems, so it stays open while any child is open.", "last": {"who": "Gabe Guzman", "when": "2026-08-24", "txt": "Answering the Description of Involvement question from Aug 20 here so it is on the ticket. It is not needed. Additional Notes already covers what is specific to a person, so a second free-text field per person is not worth a schema change. Per-person fields are Role, Severity, Action Taken, and Additional Notes."}}, {"g": "Open tickets, before 191", "n": "#77", "t": "Student: Term Considerations", "st": "Rollup", "kind": "Existing", "changed": "Unchanged, but it now conflicts with #199 on whether the incidents grid is scoped to the default term.", "sum": "Students are shown per the default term the site is setup for.", "body": "<ul>\n<li>Students are shown per the default term the site is setup for.</li>\n<li>Grades, Programs, etc should be shown for the student for default term</li>\n<li>When opening the student record it should show incidents from all other terms as well in a list. Same format as below but just list view.</li>\n</ul>\n<img src=\"https://github.com/user-attachments/assets/c5d1a299-165b-45b2-9a1f-ce717ff53f06\" alt=\"\">\n<p>Incidents in the grid should be for this default term only</p>\n<img src=\"https://github.com/user-attachments/assets/d3d20daf-2c9a-4196-ad79-74d298736592\" alt=\"\">", "ac": "", "a": "Resolve against #199. One of the two has to change.", "owner": "Jon Jungman", "why": "A parent item whose board status rolls up from its subitems, so it stays open while any child is open.", "last": {"who": "Jon Jungman", "when": "2026-06-25", "txt": "Added new endpoint to use EntityThumbprint. However, this still needs to be updated later as the Incidents related stuff is still using the MockDataService."}}, {"g": "Open tickets, before 191", "n": "#78", "t": "Vehicle: Grid Stats", "st": "No status", "kind": "Existing", "changed": "", "sum": "Create a nightly job to track trends across days and weeks for tiles and grid.", "body": "<p>Create a nightly job to track trends across days and weeks for tiles and grid.</p>\n<img src=\"https://github.com/user-attachments/assets/af41ae98-2956-4c1f-a452-5399d7098167\" alt=\"\">\n<img src=\"https://github.com/user-attachments/assets/84e91aca-e8e7-4875-88a5-f5d8c4b25c83\" alt=\"\">", "ac": "", "a": "", "owner": "Unassigned", "why": "No board status set, so it is not in anyone queue. Last activity was 2026-05-14.", "last": {"who": "Gabe Guzman", "when": "2026-05-14", "txt": "## 📸 Snapshot — pre-migration state (2026-05-14) Preserving this ticket's original content before merging in related items from `transportation-traversa`. **Title:** Vehicle: Grid Stats **Body:** > Create a nightly job to track trends across days and weeks for tiles and grid. > *(screenshots attached to original ticket)* **No existing com"}}, {"g": "Open tickets, before 191", "n": "#81", "t": "Driver: Tiles/Cards Nightly Job", "st": "No status", "kind": "Existing", "changed": "", "sum": "Run Job nightly to get the data and populate a table with the cards/tile information.", "body": "<p>Run Job nightly to get the data and populate a table with the cards/tile information.</p>\n<img src=\"https://github.com/user-attachments/assets/bb1b7418-f5f5-4d62-a098-e8182b445458\" alt=\"\">", "ac": "", "a": "", "owner": "Unassigned", "why": "Never triaged. No owner, no comments, and no board status, so nothing has been said about it since it was created.", "last": {}}, {"g": "Open tickets, before 191", "n": "#82", "t": "Communication: Multiple Conversations Per Incident", "st": "No status", "kind": "Existing", "changed": "", "sum": "Allow the user to create and track multiple conversations per incident.", "body": "<p>Allow the user to create and track multiple conversations per incident.</p>", "ac": "", "a": "", "owner": "Unassigned", "why": "No board status set, so it is not in anyone queue. Last activity was 2026-05-14.", "last": {"who": "Gabe Guzman", "when": "2026-05-14", "txt": "## 📸 Snapshot — pre-migration state (2026-05-14) Preserving this ticket's original content before merging in related items from `transportation-traversa`. **Title:** Communication: Multiple Conversations Per Incident **Body:** > Allow the user to create and track multiple conversations per incident. **No existing comments.** **Labels:** n"}}, {"g": "Open tickets, before 191", "n": "#84", "t": "Communications: Live Notifications of Messages", "st": "No status", "kind": "Existing", "changed": "", "sum": "Push notifications into the upper right bell icon notification center of the program.", "body": "<p>Push notifications into the upper right bell icon notification center of the program.</p>", "ac": "", "a": "Needs sizing and an owner. High difficulty against one line of description.", "owner": "Unassigned", "why": "No board status set, so it is not in anyone queue. Last activity was 2026-05-11.", "last": {"who": "Justin Smith", "when": "2026-05-11", "txt": "Dev Timeline: 3 Weeks"}}, {"g": "Open tickets, before 191", "n": "#85", "t": "Communications: Tyler Drive Considerations", "st": "No status", "kind": "Existing", "changed": "", "sum": "Allow Interactions or notifications to drivers", "body": "<p>Allow Interactions or notifications to drivers</p>", "ac": "", "a": "", "owner": "Unassigned", "why": "Never triaged. No owner, no comments, and no board status, so nothing has been said about it since it was created.", "last": {}}, {"g": "Open tickets, before 191", "n": "#88", "t": "Workflow Steps: Configuration", "st": "No status", "kind": "Existing", "changed": "", "sum": "Requiring functionality to be added later. Needs more definition", "body": "<ul>\n<li>Requiring functionality to be added later. Needs more definition</li>\n</ul>\n<img src=\"https://github.com/user-attachments/assets/dedb9c4a-0d11-4a31-8c7f-789c0e150f4c\" alt=\"\">", "ac": "", "a": "", "owner": "Gabe Guzman", "why": "No board status set, so it is not in anyone queue. Last activity was 2026-06-01.", "last": {"who": "Gabe Guzman", "when": "2026-06-01", "txt": "**Migrated from transportation-traversa** — UI spec detail for this feature: ### Workflow Steps List (traversa #19233) The ordered list of steps within the Workflow Builder. Displays all steps assigned to the current workflow, allowing reordering and removal. Each step should show its name, type, and status. --- ### Step Configuration Dia"}}, {"g": "Open tickets, before 191", "n": "#89", "t": "Workflow Builder: Configure Step: Notifications", "st": "Done", "kind": "Existing", "changed": "", "sum": "Notify users when step is at correct stage. This will require using the templates, making them configurable and then passing to a job to forward emails on.", "body": "<p>Notify users when step is at correct stage. This will require using the templates, making them configurable and then passing to a job to forward emails on.</p>\n<img src=\"https://github.com/user-attachments/assets/3e892b96-2228-4829-aa3b-d4362b9a681a\" alt=\"\">", "ac": "", "a": "", "owner": "Unassigned", "why": "The board says Done but the ticket was never closed, so it still counts against the burndown.", "last": {"who": "Gabe Guzman", "when": "2026-08-12", "txt": "Notification configuration lives on the individual workflow step, not on the workflow. Each step decides independently whether it sends email, when it sends, which template it uses, and who receives it. What is configurable per step. - Send email. Off by default. A step with this off sends nothing and the rest of the settings are inert. -"}}, {"g": "Open tickets, before 191", "n": "#90", "t": "Workflow Builder: Configure Step - Approvals", "st": "No status", "kind": "Existing", "changed": "", "sum": "Requiring approval by who? What needs to be done here? @captwildguns", "body": "<p>Requiring approval by who? What needs to be done here? @captwildguns</p>\n<img src=\"https://github.com/user-attachments/assets/411c9d4d-babd-4f2e-a630-e96195cdf3bc\" alt=\"\">", "ac": "", "a": "", "owner": "Unassigned", "why": "No board status set, so it is not in anyone queue. Last activity was 2026-08-10.", "last": {"who": "Gabe Guzman", "when": "2026-08-10", "txt": "Approval Details Approval is a property of an individual step, not of the workflow. It runs off two separate role fields on the step. - Assigned role. Every step has one. It is who the step waits on, who gets the assignment email, and who sees the complete button. Anyone outside that role can view the step but cannot advance it. - Approve"}}, {"g": "Open tickets, before 191", "n": "#93", "t": "Reports", "st": "Rollup", "kind": "Existing", "changed": "", "sum": "Create a list of actual PDF reports (v1 + v2)", "body": "<p>Create a list of actual PDF reports (v1 + v2)</p>\n<ul>\n<li>V1</li>\n<li>1 or 2 Reports</li>\n<li>V2</li>\n<li>Go for it</li>\n</ul>", "ac": "", "a": "", "owner": "Gabe Guzman", "why": "A parent item whose board status rolls up from its subitems, so it stays open while any child is open.", "last": {"who": "Gabe Guzman", "when": "2026-07-27", "txt": "## Split into 4 sub-issues (one per report) This ticket stays as the epic for the Reports page (page header + quick-reports grid + shared preview-modal shell). Each report is now tracked separately, with its own filter criteria and column-to-table mapping: - #183 — Reports: Monthly Summary - #184 — Reports: Yearly Summary - #185 — Reports"}}, {"g": "Open tickets, before 191", "n": "#95", "t": "Admin: Email Templates", "st": "Working on it", "kind": "Existing", "changed": "", "sum": "Email Templates", "body": "<p>Email Templates</p>\n<ul>\n<li>Dynamically pulling together table values for tempalte [Hard]</li>\n</ul>\n<img src=\"https://github.com/user-attachments/assets/3eddc67f-49ca-4a9f-8140-9da567e00e0a\" alt=\"\">", "ac": "", "a": "", "owner": "Gabe Guzman", "why": "In progress on the board.", "last": {"who": "Gabe Guzman", "when": "2026-06-01", "txt": "**Migrated from transportation-traversa** — UI spec detail for this feature: ### Email Templates Toolbar (traversa #19244) Search field: Placeholder \"Search templates...\". \"All Categories\" filter — distinct list of categories from templates in system. \"Create Template\" primary button with Plus icon — opens Create/Edit Template dialog. **W"}}, {"g": "Open tickets, before 191", "n": "#97", "t": "Audit Logs", "st": "Working on it", "kind": "Existing", "changed": "Unchanged. The concrete event list was added as a comment, and day one is confirmed as a bulk dump, log only.", "sum": "Audit history for Incidents. The write path and the visible History tab shipped under #73, backed by the `IncidentEventHistory` table added in transportation-traversa#20037.", "body": "<p>Audit history for Incidents. The write path and the visible History tab shipped under #73, backed by the <code>IncidentEventHistory</code> table added in transportation-traversa#20037.</p>\n<p>This ticket covers what remains: event coverage across all incident subjects in #191, an audit retrieval report a district can run itself, and a retention setting with an archive path.</p>", "ac": "", "a": "Day one is a bulk dump of incident audit records, log only, no per-record retrieval UI.", "owner": "Unassigned", "why": "In progress on the board.", "last": {"who": "Gabe Guzman", "when": "2026-08-25", "txt": "Event coverage for the five incident subjects, listed out so it can be checked off rather than inferred. These are the questions the trail has to answer for any single incident. - Who filed it, and when. - Who changed its status, from which value to which value. - Who edited a collected field, with the value before and after. - Who comple"}}, {"g": "Open tickets, before 191", "n": "#99", "t": "Notification: Page Filtering", "st": "No status", "kind": "Existing", "changed": "", "sum": "Need a way for users to filter out notifications they don't want to see.", "body": "<p>Need a way for users to filter out notifications they don&#x27;t want to see.</p>", "ac": "", "a": "", "owner": "Gabe Guzman", "why": "Never triaged. No owner, no comments, and no board status, so nothing has been said about it since it was created.", "last": {}}, {"g": "Open tickets, before 191", "n": "#100", "t": "Notifications: All Areas", "st": "No status", "kind": "Existing", "changed": "", "sum": "Need a list of all areas that require notifications and to who gets notified.", "body": "<p>Need a list of all areas that require notifications and to who gets notified.</p>", "ac": "", "a": "Reconcile with #206 or close as covered, now that notifications are confirmed as in-app.", "owner": "Gabe Guzman", "why": "No board status set, so it is not in anyone queue. Last activity was 2026-08-10.", "last": {"who": "Gabe Guzman", "when": "2026-08-10", "txt": "Notification Areas and Recipients There are two types of notifications. - In-app bell notifications are visible to the logged-in user only and send no email. - Email notifications are driven by per-step flags and use the email template library. In-app bell notifications, trigger and who receives it: - New Critical Incident. A high severit"}}, {"g": "Open tickets, before 191", "n": "#104", "t": "General: UI Completion", "st": "Done", "kind": "Existing", "changed": "", "sum": "No description on the ticket.", "body": "", "ac": "", "a": "", "owner": "Unassigned", "why": "The board says Done but the ticket was never closed, so it still counts against the burndown.", "last": {"who": "Justin Smith", "when": "2026-05-11", "txt": "Dev Timeline: 2 Weeks"}}, {"g": "Open tickets, before 191", "n": "#105", "t": "General: DB Completion", "st": "Done", "kind": "Existing", "changed": "", "sum": "No description on the ticket.", "body": "", "ac": "", "a": "", "owner": "Unassigned", "why": "The board says Done but the ticket was never closed, so it still counts against the burndown.", "last": {"who": "Justin Smith", "when": "2026-05-11", "txt": "Dev Timeline: 1 Week"}}, {"g": "Open tickets, before 191", "n": "#107", "t": "Enable branch protection", "st": "No status", "kind": "Existing", "changed": "", "sum": "Branch protection should be enabled for this repository. I can set that up for you. It looks like this repository does not have an admin-level team configured. Add a comment with the following text to add a team and apply branch protection:", "body": "<p>Branch protection should be enabled for this repository. I can set that up for you. It looks like this repository does not have an admin-level team configured. Add a comment with the following text to add a team and apply branch protection:</p>\n<p>```txt</p>\n<p>/admin-teams @tyler-technologies/my-team</p>\n<p>/protect</p>\n<p>```</p>\n<p>If this repository is not meant to have branch protection (not recommended), comment with <code>/ignore</code> and I&#x27;ll close the issue and stop bothering you.</p>\n<p>If you will be configuring branch protection yourself you can ignore this issue. I&#x27;ll close it the next time I check this repository.</p>\n<p>See <a href=\"https://github.com/tyler-technologies/branch-protector/blob/master/slash-commands.md\" target=\"_blank\">this</a> for a full list of commands.</p>", "ac": "", "a": "", "owner": "Unassigned", "why": "Never triaged. No owner, no comments, and no board status, so nothing has been said about it since it was created.", "last": {}}, {"g": "Open tickets, before 191", "n": "#108", "t": "MDM: Handle MDM in the UI/backend", "st": "No status", "kind": "Existing", "changed": "", "sum": "If the Student Transportation site is in MDM mode, Incidents has to scope to organizations. It does none of that today. No incident table, no workflow table, and no incident configuration table carries an org, so on a multi-district site every district would see every other district's incidents.", "body": "<p>If the Student Transportation site is in MDM mode, Incidents has to scope to organizations. It does none of that today. No incident table, no workflow table, and no incident configuration table carries an org, so on a multi-district site every district would see every other district&#x27;s incidents.</p>\n<p>The organization selector UI is split out to #198. This issue owns the data scoping and filtering.</p>\n<h4>How Student Transportation already does MDM</h4>\n<p>The site-level switch is <code>IsMultiDistrictSite()</code>. When it is off, no org filter is applied anywhere and behavior is exactly what it is today.</p>\n<p>There are two established conventions, and Incidents needs both:</p>\n<ul>\n<li><strong>Shared configuration</strong> uses a companion association table named <code>&lt;Entity&gt;Org</code> holding <code>&lt;Entity&gt;Id</code> and <code>OrgKey</code>, filtered as <code>e.&lt;Entity&gt;Orgs.Any(x =&gt; orgs.Contains(x.OrgKey))</code>. Twenty-two entities already do this, including <code>GradeOrg</code>, <code>RunOrg</code>, <code>LocationOrg</code>, <code>EmployeeOrg</code> and <code>AssetOrg</code>.</li>\n<li><strong>Records owned by exactly one district</strong> carry a scalar org key. <code>Student</code> carries <code>DistrictOrgKey</code> in addition to its <code>StudentOrg</code> rows.</li>\n</ul>\n<p><code>OrgFilterService</code> supplies the per-user org list through <code>GetUserOrgsAsync(userId)</code> and returns an unfiltered predicate when MDM is off, so the filter is a no-op on a single-district site.</p>\n<h4>Every subject is already org-scoped</h4>\n<p>An incident does not need to be told its organization in most cases, because the entity it is about already knows:</p>\n<ul>\n<li>Student incidents derive from <code>Student.DistrictOrgKey</code>.</li>\n<li>Employee incidents derive from <code>EmployeeOrg</code>.</li>\n<li>Location incidents derive from <code>LocationOrg</code>.</li>\n<li>Vehicle incidents derive from <code>AssetOrg</code>. A vehicle is an <code>Asset</code> in Student Transportation, which is why <code>ApplyVehicleFilterAsync</code> is typed to <code>Asset</code>.</li>\n</ul>\n<p><strong>Third Party is the one exception.</strong> A third party incident names a person with no Student Transportation record, so there is nothing to derive from and the organization has to be captured when the incident is filed.</p>\n<p>This is a better position than school-based access, where studentless incidents had nothing to derive from at all.</p>\n<h4>Requirements</h4>\n<p>Incident records.</p>\n<ul>\n<li>An incident carries a single owning organization, following the <code>Student.DistrictOrgKey</code> convention rather than a join table, because an incident belongs to exactly one district.</li>\n<li>The organization is derived from the incident&#x27;s subject on creation and is not asked for, except on a Third Party incident where the filer chooses it.</li>\n<li>On a Third Party incident, the organization defaults to the filer&#x27;s organization when the filer has exactly one, and is a required choice when they have several.</li>\n<li>The organization cannot be changed after creation. Reassigning an incident across districts is out of scope.</li>\n</ul>\n<p>Incident configuration.</p>\n<ul>\n<li>Incident types, workflows, workflow step templates and email templates each get an <code>&lt;Entity&gt;Org</code> association table, so a co-op can share one workflow across districts or scope one to a single district.</li>\n<li>Following the <code>&lt;Entity&gt;Org</code> naming convention matters beyond tidiness: <code>PopulateMDMEntities.sql</code>, the script that converts an existing single-district site to MDM, discovers association tables by querying <code>sys.tables</code> for names ending in <code>Org</code>. Named correctly, the conversion works with no change to that script.</li>\n</ul>\n<p>Filtering.</p>\n<ul>\n<li>Every incident list, the dashboard, reports and communications filter to the user&#x27;s organizations, using <code>GetUserOrgsAsync</code>.</li>\n<li>When MDM is off, no filter is applied and nothing about the UI changes.</li>\n<li>When a user has access to more than one organization, the incidents list shows the organization as a column and offers it as a filter.</li>\n<li>Selecting a student, employee, location or vehicle while filing is limited to entities in the user&#x27;s organizations, so an incident cannot be created against an entity the filer cannot see.</li>\n</ul>\n<p>Interaction with permissions.</p>\n<ul>\n<li>Organization scoping is applied in addition to the resource grants in #181, never instead of them. A user must both have access to the organization and hold the grant for the subject.</li>\n<li>School-based filtering from #190 applies within an organization, not across.</li>\n</ul>\n<h4>Still open</h4>\n<p>Whether a co-op wants incident types shared across districts by default or scoped per district by default. The association table supports either; only the seeded default has to be chosen.</p>", "ac": "<ul>\n<li>With MDM off, every screen behaves exactly as it does today and no organization column or filter appears.</li>\n<li>With MDM on, a user with access to one organization sees only that organization&#x27;s incidents on the list, the dashboard, reports and communications.</li>\n<li>A student, employee, location and vehicle incident each save with the organization derived from the subject, with no prompt.</li>\n<li>A third party incident requires an organization choice when the filer has more than one, and defaults silently when they have one.</li>\n<li>A user cannot select a student, employee, location or vehicle belonging to an organization they do not have.</li>\n<li>A workflow scoped to one organization is not offered on an incident in another.</li>\n<li>A user with the correct organization but without the #181 grant for a subject still cannot see those incidents.</li>\n</ul>", "a": "Collapse with #198 into one MDM epic with children for the UI, the menu, and what happens when a segment is selected.", "owner": "Unassigned", "why": "Never triaged. No owner, no comments, and no board status, so nothing has been said about it since it was created.", "last": {}}, {"g": "Open tickets, before 191", "n": "#109", "t": "Dashboard: View All My Incidents Link", "st": "No status", "kind": "Existing", "changed": "", "sum": "Hyperlink that takes the user to the Incidents page and applies a filter automatically.", "body": "<p>Hyperlink that takes the user to the Incidents page and applies a filter automatically.</p>", "ac": "", "a": "", "owner": "Unassigned", "why": "Only migration notes on it, nothing recorded since it came over from traversa.", "last": {}}, {"g": "Open tickets, before 191", "n": "#110", "t": "Dashboard: My Incidents Section", "st": "No status", "kind": "Existing", "changed": "", "sum": "Cards for the 3 most critical items sorted 1st by priority, then by showing the oldest tickets first.", "body": "<p>Cards for the 3 most critical items sorted 1st by priority, then by showing the oldest tickets first.</p>", "ac": "", "a": "", "owner": "Unassigned", "why": "Only migration notes on it, nothing recorded since it came over from traversa.", "last": {}}, {"g": "Open tickets, before 191", "n": "#111", "t": "Dashboard: Active Incidents Table", "st": "No status", "kind": "Existing", "changed": "", "sum": "Active Incidents grid with 5 most recent incidents.", "body": "<p>Active Incidents grid with 5 most recent incidents.</p>", "ac": "", "a": "", "owner": "Unassigned", "why": "Only migration notes on it, nothing recorded since it came over from traversa.", "last": {}}, {"g": "Open tickets, before 191", "n": "#113", "t": " st": "No status", "kind": "Existing", "changed": "", "sum": "Vehicle detail modal opened by clicking a row in the Vehicles table.", "body": "<p>Vehicle detail modal opened by clicking a row in the Vehicles table.</p>", "ac": "", "a": "", "owner": "Jon Jungman, Kristen Michalski", "why": "Development says it is ready for QA. Open until QA signs it off.", "last": {"who": "Jon Jungman", "when": "2026-08-21", "txt": "At this time I think I can consider this Ready for QA."}}, {"g": "Open tickets, before 191", "n": "#135", "t": "Communications: Message Thread", "st": "No status", "kind": "Existing", "changed": "", "sum": "Scrollable chat area with sender role, timestamps, and delivery status indicators.", "body": "<p>Scrollable chat area with sender role, timestamps, and delivery status indicators.</p>", "ac": "", "a": "", "owner": "Unassigned", "why": "Only migration notes on it, nothing recorded since it came over from traversa.", "last": {}}, {"g": "Open tickets, before 191", "n": "#138", "t": "AppHeader / Navigation Shell", "st": "No status", "kind": "Existing", "changed": "", "sum": "UI spec for the application header and navigation shell.", "body": "<p>UI spec for the application header and navigation shell.</p>\n<h4>App Name (traversa #19162)</h4>\n<p>Incident Tracker app name and Tyler Technologies &quot;Talking T&quot; logo, displayed in the top-left of the header.</p>\n<p>---</p>\n<h4>Hamburger Menu (traversa #19161)</h4>\n<p>Slide-out navigation drawer triggered by a hamburger/menu icon. Contains: user name, user avatar/icon, app version number, and navigation links.</p>\n<p>---</p>\n<h4>Search Bar — top center slot (traversa #19163)</h4>\n<p>Global search field positioned at the top center of the header. Searches across incidents, students, drivers, vehicles, and communications. Results are click-to-navigate.</p>\n<p>---</p>\n<h4>Help Icon (traversa #19164)</h4>\n<p>Icon button in the header that navigates users directly to the Help page.</p>\n<p>---</p>\n<h4>User Icon (traversa #19165)</h4>\n<p>Avatar/icon button displaying the initials of the currently logged-in user. Positioned in the top-right area of the header.</p>", "ac": "", "a": "", "owner": "Unassigned", "why": "Never triaged. No owner, no comments, and no board status, so nothing has been said about it since it was created.", "last": {}}, {"g": "Open tickets, before 191", "n": "#139", "t": "Help Page", "st": "No status", "kind": "Existing", "changed": "", "sum": "UI spec for the Help page. Three tabs:", "body": "<p>UI spec for the Help page. Three tabs:</p>\n<h4>Getting Started tab (traversa #19166)</h4>\n<p>Introductory content for new users — covers the core concepts of the Incident Tracker: what incidents are, how workflows work, and how to create a first incident.</p>\n<p>---</p>\n<h4>User Guide tab (traversa #19167)</h4>\n<p>Step-by-step usage documentation covering all major features: creating/editing incidents, managing workflows, using Communications, running reports, and admin configuration.</p>\n<p>---</p>\n<h4>FAQ tab (traversa #19168)</h4>\n<p>Frequently asked questions and answers covering common user questions and troubleshooting scenarios.</p>", "ac": "", "a": "", "owner": "Jon Jungman", "why": "No board status set, so it is not in anyone queue. Last activity was 2026-08-19.", "last": {"who": "Gabe Guzman", "when": "2026-08-19", "txt": "The approval gap from the last comment is now #195. The notification type question stays with #100."}}, {"g": "Open tickets, before 191", "n": "#140", "t": "Workflows: Statistics Dashboard", "st": "No status", "kind": "Existing", "changed": "", "sum": "Workflow KPIs displayed at the top of the Workflows list page. Shows summary stats across all workflows (e.g., total workflows, active, completed steps). Migrated from transportation-traversa #19225.", "body": "<p>Workflow KPIs displayed at the top of the Workflows list page. Shows summary stats across all workflows (e.g., total workflows, active, completed steps). Migrated from transportation-traversa #19225.</p>", "ac": "", "a": "", "owner": "Unassigned", "why": "Never triaged. No owner, no comments, and no board status, so nothing has been said about it since it was created.", "last": {}}, {"g": "Open tickets, before 191", "n": "#147", "t": "Workflows: Workflow Details Card", "st": "No status", "kind": "Existing", "changed": "", "sum": "Detail card shown for a selected workflow on the Workflows page. Displays workflow metadata: name, associated incident type, number of steps, created/modified dates, and status. Migrated from transportation-traversa #19232.", "body": "<p>Detail card shown for a selected workflow on the Workflows page. Displays workflow metadata: name, associated incident type, number of steps, created/modified dates, and status. Migrated from transportation-traversa #19232.</p>\n<p>On Incident Details:</p>\n<img src=\"https://github.com/user-attachments/assets/0aefe0c5-4ab1-4415-917a-818ebc9b540a\" alt=\"\">\n<p>Workflow tab:</p>\n<img src=\"https://github.com/user-attachments/assets/dfc856ef-b684-4a07-b271-4ed4e4cd0ea8\" alt=\"\">", "ac": "", "a": "", "owner": "Jon Jungman", "why": "Never triaged. No owner, no comments, and no board status, so nothing has been said about it since it was created.", "last": {}}, {"g": "Open tickets, before 191", "n": "#176", "t": "Handle jobs like sending emails by calling the MTAPP", "st": "No status", "kind": "Existing", "changed": "", "sum": "Links from Nathan for examples:", "body": "<p>Links from Nathan for examples:</p>\n<p>Example of calling MTAPP:</p>\n<p><a href=\"https://github.com/tyler-technologies/tyler-drive-api/blob/main/src/Traversa.Api.Drive.Core/Services/BackgroundJobService.cs\" target=\"_blank\">https://github.com/tyler-technologies/tyler-drive-api/blob/main/src/Traversa.Api.Drive.Core/Services/BackgroundJobService.cs</a></p>\n<p>Controller that hosts the jobs in ST. We may need to add an endpoint here:</p>\n<p><a href=\"https://github.com/tyler-technologies/transportation-traversa/blob/develop/Source/Tyler.TMS/Traversa.Api.Host/Controllers/BackgroundJobController.cs\" target=\"_blank\">https://github.com/tyler-technologies/transportation-traversa/blob/develop/Source/Tyler.TMS/Traversa.Api.Host/Controllers/BackgroundJobController.cs</a></p>", "ac": "", "a": "Needs a status. It is the delivery mechanism under the notification work.", "owner": "Jon Jungman", "why": "No board status set, so it is not in anyone queue. Last activity was 2026-07-31.", "last": {"who": "Jon Jungman", "when": "2026-07-31", "txt": "This is partially complete, but we can't yet send emails to the roles yet as we need to figure out #181."}}, {"g": "Open tickets, before 191", "n": "#181", "t": "Implement Permissions in Incidents Tracker application", "st": "No status", "kind": "Existing", "changed": "", "sum": "Implement the Incidents Tracker permission model against the resources seeded by transportation-traversa#19960.", "body": "<p>Implement the Incidents Tracker permission model against the resources seeded by transportation-traversa#19960.</p>\n<p>That PR seeds the resource tree, five default roles, and 56 grants. This issue covers enforcing them in the application, completing the tree for the expanded incident subjects, and setting grant defaults for the subject areas the PR left ungranted.</p>\n<p>Three blocks. Each carries its own acceptance criteria and is estimated separately. Blocks 2 and 3 are changes to the Security DB seeding procs and are delivered under #193.</p>\n<h4>1. Enforce the seeded resources</h4>\n<p>Resources seeded under the <code>incidents</code> parent: <code>incident-dashboard</code>, <code>incident-list</code>, <code>incident-students</code>, <code>incident-drivers</code>, <code>incident-vehicles</code>, <code>incident-admin</code>, <code>incident-workflows</code>, <code>incident-workflowbuilder</code>, and report resources 4526 through 4529.</p>\n<p>Incident permissions are incident specific. A user&#x27;s existing Student Transportation student, employee, or vehicle rights do not grant access to incidents involving those records. The <code>incident-*</code> resource grant is the gate.</p>\n<p>School based access continues to apply on top of the resource grant. A user sees an incident when they hold the resource grant and have school access to a school that at least one involved student is assigned to. This is existing behavior and does not change.</p>\n<p>A user without a grant on a subject resource does not see that subject anywhere in Incidents. The subject is absent from the subject selector, its area is unreachable, and incidents of that subject are excluded from lists, search, and dashboard counts, including incidents assigned to that user.</p>\n<h4>2. Complete the resource tree for the expanded subjects</h4>\n<p>Delivered under #193.</p>\n<p>#191 expands incident subjects beyond students. Facility becomes Location and staff becomes Employee.</p>\n<p><code>incident-drivers</code> is renamed to <code>incident-employees</code>. In Student Transportation a driver is an Employee, so a separate driver resource would overlap the Employee subject. The resource is currently seeded with no grants and is not yet enforced, so the rename carries no data impact.</p>\n<p><code>incident-locations</code> is added as a new subject resource under the <code>incidents</code> parent.</p>\n<p>Acceptance criteria:</p>\n<ul>\n<li><code>incident-employees</code> exists in place of <code>incident-drivers</code>, nested under the <code>incidents</code> parent</li>\n<li><code>incident-locations</code> exists, nested under the <code>incidents</code> parent</li>\n<li>Both carry <code>ResourcePermissionProperty</code> entries consistent with the other subject resources</li>\n<li>Both appear in the role permission tree under the <code>IncidentManagement</code> upgrade and are hidden when the upgrade is off</li>\n<li>Permission labels are present in <code>Permission.resx</code> and the es-US, fr-CA and ar-SA locale files</li>\n<li>Seeding remains additive and re-runnable</li>\n</ul>\n<h4>3. Default role grants for the subject areas</h4>\n<p>Delivered under #193.</p>\n<p>The seed grants 56 permissions across Admin, Safety, Driver, Fleet and Principal, and leaves the subject areas and <code>incident-admin</code> ungranted. Ungranted plus the enforcement above means no role can reach those areas. Defaults are required.</p>\n<p>Grants by resource, extending the split already established in the seed:</p>\n<ul>\n<li><code>incident-students</code>: Admin full, Safety full, Principal read, Fleet none, Driver none</li>\n<li><code>incident-employees</code>: Admin full, Safety full, Fleet read, Principal none, Driver none</li>\n<li><code>incident-vehicles</code>: Admin full, Fleet full, Safety read and update, Principal none, Driver none</li>\n<li><code>incident-locations</code>: Admin full, Safety full, Principal read, Fleet none, Driver none</li>\n<li><code>incident-admin</code>: Admin full, all other roles none</li>\n</ul>\n<p>These are shipped defaults. Districts change them in the role editor.</p>\n<p>Acceptance criteria:</p>\n<ul>\n<li>A tenant with the upgrade enabled has the grants above present after the permission seed runs</li>\n<li>Each of the five default roles can reach exactly the areas listed and no others</li>\n<li>Re-running the seed adds no duplicate grants</li>\n<li>Existing grants are never edited or removed</li>\n</ul>\n<h4>Out of scope</h4>\n<ul>\n<li>The Employee Restricted permission layer</li>\n<li>Third party subject resources, deferred until a Student Transportation entity exists for third party</li>\n<li>Running <code>InsertDefaultIncidentPermission</code> at upgrade enable, tracked separately</li>\n<li>Any change to school based access filtering behavior</li>\n</ul>\n<h4>Dependencies</h4>\n<ul>\n<li>transportation-traversa#19960 must merge before this work starts</li>\n<li>#193 delivers blocks 2 and 3 in the Security DB seeding procs</li>\n<li>#176 is blocked on this issue</li>\n<li>#191 depends on #193</li>\n</ul>", "ac": "<ul>\n<li>Each seeded resource gates its corresponding area and honors the CRUD level of the grant</li>\n<li>A user with no grant on a subject resource cannot reach that area by direct URL</li>\n<li>The subject selector lists only subjects the user holds a create grant on</li>\n<li>Lists, search results, and dashboard counts exclude incidents whose subject the user holds no read grant on</li>\n<li>An incident assigned to a user is excluded when the user holds no read grant on its subject</li>\n<li>School based filtering applies after resource filtering, with behavior unchanged from today</li>\n<li>Grant changes take effect on next sign in, consistent with existing ST permission behavior</li>\n</ul>", "a": "Needs a status. Permissions granularity is unresolved: page level, incident type level, or subject level.", "owner": "Jon Jungman", "why": "No board status set, so it is not in anyone queue. Last activity was 2026-08-18.", "last": {"who": "Gabe Guzman", "when": "2026-08-18", "txt": "### School based access and the non student subjects Two things worth recording here, since #190 closed before the subject expansion in #191 was scoped. **Multi school incidents.** Per #190, an incident is visible when at least one of its students attends a school the user can access. A user with access to one involved student therefore s"}}, {"g": "Open tickets, before 191", "n": "#183", "t": "Reports: Monthly Summary", "st": "No status", "kind": "Existing", "changed": "", "sum": "Sub-issue of #93. One of 4 report cards on the Reports page (`Transportation.Incidents/Pages/Reports.razor` — currently a header-only stub).", "body": "<p>Sub-issue of #93. One of 4 report cards on the Reports page (<code>Transportation.Incidents/Pages/Reports.razor</code> — currently a header-only stub).</p>\n<h4>Report card</h4>\n<ul>\n<li><strong>Title:</strong> Monthly Summary</li>\n<li><strong>Icon:</strong> <code>calendar_today</code></li>\n<li><strong>Card description:</strong> &quot;Incident statistics and trends for the current month&quot;</li>\n<li>Clicking the card / <strong>View Report</strong> opens the report preview modal.</li>\n</ul>\n<h4>Data scope / filter</h4>\n<ul>\n<li>All incidents whose event date falls in the rolling window <strong>from the same calendar day of the previous month through now</strong>.</li>\n<li><code>dbo.IncidentEvent.AddDateUTC &gt;= DATEADD(MONTH, -1, @nowUtc)</code> (converted to the user&#x27;s local day boundary — see <code>CurrentWeekHelper</code> for the existing UTC-offset pattern).</li>\n<li>Sort: <code>AddDateUTC</code> <strong>descending</strong> (newest first).</li>\n<li>No severity or status filter — all severities, all statuses.</li>\n</ul>\n<h4>Columns and their source tables</h4>\n<p>Data source: <code>_traversaContext.IncidentEvents</code> projected through the existing <code>IncidentEventQueryExtensions.ProjectToRecords()</code> (returns <code>IncidentRecord</code>). All 8 columns below are already populated by that projection — no new projection needed, only the date filter.</p>\n<ul>\n<li><strong>Incident ID</strong> — <code>dbo.IncidentEvent.IncidentEventId</code>. Display as <code>INC-{id}</code> via <code>DisplayHelper.GetIncidentIdDisplayString()</code>.</li>\n<li><strong>Date</strong> — <code>dbo.IncidentEvent.AddDateUTC</code> (<code>DATETIME</code>, stored UTC). Convert to user local, format <code>MM-DD-YYYY</code>.</li>\n<li><strong>Student</strong> — <code>dbo.IncidentEventStudent.StudentFirstName</code> + <code>StudentLastName</code> (name) and <code>StudentUniqueId</code> (the STU- id). These are denormalized snapshot columns on the join row; live student record is <code>dbo.IncidentEventStudent.StudentId</code> → <code>dbo.Student.StudentId</code>. Multi-student incidents have multiple <code>IncidentEventStudent</code> rows — see open question below.</li>\n<li><strong>Type</strong> — <code>dbo.IncidentEventType.IncidentName</code>, joined via <code>dbo.IncidentEvent.IncidentEventTypeId</code>.</li>\n<li><strong>Vehicle</strong> — <code>dbo.IncidentEvent.AssetName</code> (and <code>AssetUniqueId</code>) — snapshot columns; live vehicle is <code>dbo.IncidentEvent.AssetId</code> → <code>dbo.Asset.AssetId</code>.</li>\n<li><strong>Driver</strong> — <code>dbo.IncidentEventEmployee.FirstName</code> + <code>LastName</code>, filtered to the row whose <code>IncidentEventEmployeeInvolvementTypeId</code> → <code>dbo.IncidentEventEmployeeInvolvementType.TypeCode = 2</code> (Driver). Live employee is <code>IncidentEventEmployee.EmployeeId</code> → <code>dbo.Employee.EmployeeId</code>.</li>\n<li><strong>Severity</strong> — <code>dbo.Severity.TypeName</code>, joined via <code>dbo.IncidentEvent.SeverityId</code>. <code>Severity.TypeCode</code>: 1 Low, 2 Medium, 3 High, 4 Critical. Render as a Forge badge.</li>\n<li><strong>Status</strong> — <code>dbo.Status.Name</code>, joined via <code>dbo.IncidentEvent.StatusId</code>. <code>Status.TypeCode</code>: 1 Open, 2 In Progress, 3 Closed. Render as a Forge badge.</li>\n</ul>\n<p>Additional fields available on the same query if we want them later: Run (<code>IncidentEvent.RunName</code> / <code>RunId</code> → <code>dbo.Run</code>), Location (<code>dbo.IncidentEventLocation.TypeName</code>), Address (<code>dbo.Address.AddressFull</code>), Assigned To (<code>IncidentEventEmployee</code> where involvement <code>TypeCode = 3</code>), Tags (<code>dbo.IncidentEventTag</code> → <code>dbo.Tag.TagName</code>), Description (<code>IncidentEvent.Description</code>).</p>\n<h4>Preview modal</h4>\n<ul>\n<li>Report title as H2.</li>\n<li><strong>Download Report</strong> primary button with download icon; <strong>Excel</strong> and <strong>CSV</strong> export options (per #93 comment on transportation-traversa#19221).</li>\n<li>Scrollable table with the 8 columns above.</li>\n<li>Footer: record count + generated-on date.</li>\n</ul>\n<h4>Open questions</h4>\n<ul>\n<li><strong>Multi-student incidents:</strong> one row per involved student, or one row per incident with names comma-joined (<code>DisplayHelper.GetStudentNameList()</code>)? The incidents list uses &quot;Name +N more&quot;. Recommend one row per student so per-student severity/role is exportable — needs product confirmation.</li>\n<li>Original #93 body asked for <strong>PDF</strong> reports; transportation-traversa#19221 specified <strong>Excel + CSV</strong>. Confirm which formats v1 ships.</li>\n</ul>", "ac": "<ul>\n<li>[ ] Report card renders in the Reports page grid with the title, icon and description above.</li>\n<li>[ ] Clicking the card opens the preview modal with the 8 columns, newest first.</li>\n<li>[ ] Date window is the rolling same-day-previous-month → now, evaluated in the user&#x27;s local time zone.</li>\n<li>[ ] Footer shows correct record count and generated date.</li>\n<li>[ ] Excel and CSV export produce the same rows/columns as the preview.</li>\n<li>[ ] Empty state when no incidents fall in the window.</li>\n</ul>", "a": "", "owner": "cartermjones, Gabe Guzman", "why": "No board status set, so it is not in anyone queue. Last activity was 2026-07-28.", "last": {"who": "Gabe Guzman", "when": "2026-07-28", "txt": "**Scope note: not about visual fidelity** The screenshots and layout details in the parent ticket (#93) are reference only. Don't treat matching them pixel-for-pixel as part of this ticket. The card/modal chrome will follow whatever the standard Forge patterns are. What matters for this ticket is the data contract: - **Columns**: which fi"}}, {"g": "Open tickets, before 191", "n": "#184", "t": "Reports: Yearly Summary", "st": "No status", "kind": "Existing", "changed": "", "sum": "Sub-issue of #93. One of 4 report cards on the Reports page (`Transportation.Incidents/Pages/Reports.razor` — currently a header-only stub).", "body": "<p>Sub-issue of #93. One of 4 report cards on the Reports page (<code>Transportation.Incidents/Pages/Reports.razor</code> — currently a header-only stub).</p>\n<h4>Report card</h4>\n<ul>\n<li><strong>Title:</strong> Yearly Summary</li>\n<li><strong>Icon:</strong> <code>date_range</code></li>\n<li><strong>Card description:</strong> &quot;Incidents that have occurred during the current school term&quot;</li>\n<li>Clicking the card / <strong>View Report</strong> opens the report preview modal.</li>\n</ul>\n<h4>Data scope / filter</h4>\n<ul>\n<li>All incidents whose event date falls inside the <strong>current school term</strong>.</li>\n<li>Term boundaries come from <code>dbo.Term</code>: <code>TermName</code>, <code>TermDescription</code>, <code>StartDate</code> (<code>DATE</code>, nullable), <code>EndDate</code> (<code>DATE</code>, nullable), <code>Active</code> (<code>BIT</code>), <code>Default</code> (<code>BIT</code>), <code>RecordState</code>.</li>\n<li>Filter: <code>dbo.IncidentEvent.AddDateUTC &gt;= Term.StartDate AND AddDateUTC &lt; DATEADD(DAY, 1, Term.EndDate)</code> for the current term row.</li>\n<li>Sort: <code>AddDateUTC</code> <strong>descending</strong> (newest first).</li>\n<li>No severity or status filter.</li>\n</ul>\n<p><strong>Dependency:</strong> #77 (Student: Term Considerations) — how we resolve &quot;current term&quot; (<code>Active = 1</code>? <code>Default = 1</code>? date-containing row? per-org via <code>dbo.ExternalTermScheduleOrg</code>) must be settled there first. Terms with NULL <code>StartDate</code>/<code>EndDate</code> need a defined fallback.</p>\n<h4>Columns and their source tables</h4>\n<p>Data source: <code>_traversaContext.IncidentEvents</code> projected through the existing <code>IncidentEventQueryExtensions.ProjectToRecords()</code> (returns <code>IncidentRecord</code>). All 8 columns are already populated by that projection — only the term date filter is new.</p>\n<ul>\n<li><strong>Incident ID</strong> — <code>dbo.IncidentEvent.IncidentEventId</code>. Display as <code>INC-{id}</code> via <code>DisplayHelper.GetIncidentIdDisplayString()</code>.</li>\n<li><strong>Date</strong> — <code>dbo.IncidentEvent.AddDateUTC</code> (<code>DATETIME</code>, stored UTC). Convert to user local, format <code>MM-DD-YYYY</code>.</li>\n<li><strong>Student</strong> — <code>dbo.IncidentEventStudent.StudentFirstName</code> + <code>StudentLastName</code> and <code>StudentUniqueId</code> (snapshot columns on the join row); live student is <code>IncidentEventStudent.StudentId</code> → <code>dbo.Student.StudentId</code>.</li>\n<li><strong>Type</strong> — <code>dbo.IncidentEventType.IncidentName</code>, joined via <code>dbo.IncidentEvent.IncidentEventTypeId</code>.</li>\n<li><strong>Vehicle</strong> — <code>dbo.IncidentEvent.AssetName</code> / <code>AssetUniqueId</code> (snapshot); live vehicle is <code>IncidentEvent.AssetId</code> → <code>dbo.Asset.AssetId</code>.</li>\n<li><strong>Driver</strong> — <code>dbo.IncidentEventEmployee.FirstName</code> + <code>LastName</code> where <code>IncidentEventEmployeeInvolvementTypeId</code> → <code>dbo.IncidentEventEmployeeInvolvementType.TypeCode = 2</code> (Driver); live employee via <code>EmployeeId</code> → <code>dbo.Employee.EmployeeId</code>.</li>\n<li><strong>Severity</strong> — <code>dbo.Severity.TypeName</code> via <code>dbo.IncidentEvent.SeverityId</code>. <code>TypeCode</code>: 1 Low, 2 Medium, 3 High, 4 Critical. Forge badge.</li>\n<li><strong>Status</strong> — <code>dbo.Status.Name</code> via <code>dbo.IncidentEvent.StatusId</code>. <code>TypeCode</code>: 1 Open, 2 In Progress, 3 Closed. Forge badge.</li>\n</ul>\n<p>Also available on the same query if wanted: Run (<code>IncidentEvent.RunName</code> / <code>RunId</code> → <code>dbo.Run</code>), Location (<code>dbo.IncidentEventLocation.TypeName</code>), Address (<code>dbo.Address.AddressFull</code>), Assigned To (<code>IncidentEventEmployee</code> involvement <code>TypeCode = 3</code>), Tags (<code>dbo.IncidentEventTag</code> → <code>dbo.Tag.TagName</code>).</p>\n<h4>Preview modal</h4>\n<ul>\n<li>Report title as H2, with the resolved term name/date range shown as a subtitle so the user knows what &quot;current term&quot; resolved to.</li>\n<li><strong>Download Report</strong> primary button; <strong>Excel</strong> and <strong>CSV</strong> export options.</li>\n<li>Scrollable table with the 8 columns above.</li>\n<li>Footer: record count + generated-on date.</li>\n</ul>\n<h4>Open questions</h4>\n<ul>\n<li>Should this be term-scoped or full-school-year-scoped? The card copy says &quot;school term&quot;; the earlier spec said &quot;school calendar year&quot;. These differ if a district defines Fall/Spring/Summer terms separately.</li>\n<li>Multi-student incidents: one row per student vs. comma-joined names — same question as the other three reports; keep consistent.</li>\n<li>PDF vs. Excel/CSV for v1 (original #93 body says PDF; transportation-traversa#19221 says Excel + CSV).</li>\n</ul>", "ac": "<ul>\n<li>[ ] Report card renders in the Reports page grid with the title, icon and description above.</li>\n<li>[ ] &quot;Current term&quot; resolves per the rule agreed in #77, and the resolved term name + start/end dates are displayed in the modal.</li>\n<li>[ ] Rows are limited to that term&#x27;s date range, newest first.</li>\n<li>[ ] Footer shows correct record count and generated date.</li>\n<li>[ ] Excel and CSV export match the preview rows/columns.</li>\n<li>[ ] Graceful empty/blocked state when no current term can be resolved or the term has no incidents.</li>\n</ul>", "a": "", "owner": "cartermjones, Gabe Guzman", "why": "No board status set, so it is not in anyone queue. Last activity was 2026-07-28.", "last": {"who": "Gabe Guzman", "when": "2026-07-28", "txt": "**Scope note: not about visual fidelity** The screenshots and layout details in the parent ticket (#93) are reference only. Don't treat matching them pixel-for-pixel as part of this ticket. The card/modal chrome will follow whatever the standard Forge patterns are. What matters for this ticket is the data contract: - **Columns**: which fi"}}, {"g": "Open tickets, before 191", "n": "#185", "t": "Reports: High & Critical Incidents", "st": "No status", "kind": "Existing", "changed": "", "sum": "Sub-issue of #93. One of 4 report cards on the Reports page (`Transportation.Incidents/Pages/Reports.razor` — currently a header-only stub).", "body": "<p>Sub-issue of #93. One of 4 report cards on the Reports page (<code>Transportation.Incidents/Pages/Reports.razor</code> — currently a header-only stub).</p>\n<h4>Report card</h4>\n<ul>\n<li><strong>Title:</strong> High &amp; Critical Incidents</li>\n<li><strong>Icon:</strong> <code>warning</code></li>\n<li><strong>Card description:</strong> &quot;All High and Critical severity incidents requiring immediate or escalated attention&quot;</li>\n<li>Clicking the card / <strong>View Report</strong> opens the report preview modal.</li>\n</ul>\n<h4>Data scope / filter</h4>\n<ul>\n<li>Filter on severity only: <code>dbo.Severity.TypeCode IN (3, 4)</code> — High or Critical — joined via <code>dbo.IncidentEvent.SeverityId</code>.</li>\n<li>Sort: <code>dbo.IncidentEvent.AddDateUTC</code> <strong>descending</strong> (newest first).</li>\n<li>No date-window filter and (per the modal spec) no status filter — see open question below.</li>\n</ul>\n<h4>Columns and their source tables</h4>\n<p>Data source: <code>_traversaContext.IncidentEvents</code> projected through the existing <code>IncidentEventQueryExtensions.ProjectToRecords()</code> (returns <code>IncidentRecord</code>). All 8 columns are already populated by that projection — only the severity filter is new.</p>\n<ul>\n<li><strong>Incident ID</strong> — <code>dbo.IncidentEvent.IncidentEventId</code>. Display as <code>INC-{id}</code> via <code>DisplayHelper.GetIncidentIdDisplayString()</code>.</li>\n<li><strong>Date</strong> — <code>dbo.IncidentEvent.AddDateUTC</code> (<code>DATETIME</code>, stored UTC). Convert to user local, format <code>MM-DD-YYYY</code>.</li>\n<li><strong>Student</strong> — <code>dbo.IncidentEventStudent.StudentFirstName</code> + <code>StudentLastName</code> and <code>StudentUniqueId</code> (snapshot columns on the join row); live student is <code>IncidentEventStudent.StudentId</code> → <code>dbo.Student.StudentId</code>.</li>\n<li><strong>Type</strong> — <code>dbo.IncidentEventType.IncidentName</code>, joined via <code>dbo.IncidentEvent.IncidentEventTypeId</code>.</li>\n<li><strong>Vehicle</strong> — <code>dbo.IncidentEvent.AssetName</code> / <code>AssetUniqueId</code> (snapshot); live vehicle is <code>IncidentEvent.AssetId</code> → <code>dbo.Asset.AssetId</code>.</li>\n<li><strong>Driver</strong> — <code>dbo.IncidentEventEmployee.FirstName</code> + <code>LastName</code> where <code>IncidentEventEmployeeInvolvementTypeId</code> → <code>dbo.IncidentEventEmployeeInvolvementType.TypeCode = 2</code> (Driver); live employee via <code>EmployeeId</code> → <code>dbo.Employee.EmployeeId</code>.</li>\n<li><strong>Severity</strong> — <code>dbo.Severity.TypeName</code> via <code>dbo.IncidentEvent.SeverityId</code>. <code>TypeCode</code>: 1 Low, 2 Medium, 3 High, 4 Critical. Forge badge.</li>\n<li><strong>Status</strong> — <code>dbo.Status.Name</code> via <code>dbo.IncidentEvent.StatusId</code>. <code>TypeCode</code>: 1 Open, 2 In Progress, 3 Closed. Forge badge.</li>\n</ul>\n<p>Worth considering for this report specifically (all available on the same query): <strong>Assigned To</strong> — <code>dbo.IncidentEventEmployee.FirstName</code> + <code>LastName</code> where involvement <code>TypeCode = 3</code> (Assignee) — and <strong>Workflow Step / Progress</strong> from <code>dbo.WorkflowInstance</code> → <code>dbo.WorkflowInstanceStep</code> (<code>Name</code>, <code>Seq</code>, <code>Status.TypeCode</code>), since the audience for this report is escalation follow-up.</p>\n<p>Note: <code>dbo.IncidentEventStudent</code> also carries a <strong>per-student</strong> <code>SeverityId</code>, distinct from the incident-level <code>IncidentEvent.SeverityId</code>. This report should filter on the <strong>incident-level</strong> severity; call out the distinction in the query so it isn&#x27;t accidentally swapped.</p>\n<h4>Preview modal</h4>\n<ul>\n<li>Report title as H2.</li>\n<li><strong>Download Report</strong> primary button; <strong>Excel</strong> and <strong>CSV</strong> export options.</li>\n<li>Scrollable table with the 8 columns above.</li>\n<li>Footer: record count + generated-on date.</li>\n</ul>\n<h4>Open questions</h4>\n<ul>\n<li><strong>Status filter — conflicting specs.</strong> transportation-traversa#19220 (Quick Reports Grid) describes this as &quot;severity of High or Critical <strong>and</strong> a status of Open or In Progress&quot;; the modal spec in the same ticket says severity only. Recommend <strong>severity only</strong> (the prototype behaves this way) and let the user filter status elsewhere — needs product confirmation.</li>\n<li>Should this be capped to a date window (e.g. current term) or truly all-time? All-time will grow unbounded.</li>\n<li>Multi-student incidents: one row per student vs. comma-joined names — keep consistent across all four reports.</li>\n<li>PDF vs. Excel/CSV for v1.</li>\n</ul>", "ac": "<ul>\n<li>[ ] Report card renders in the Reports page grid with the title, icon and description above.</li>\n<li>[ ] Only incidents with incident-level severity High or Critical appear, newest first.</li>\n<li>[ ] Severity badge theming matches the incidents list (<code>severityTheme()</code> pattern).</li>\n<li>[ ] Footer shows correct record count and generated date.</li>\n<li>[ ] Excel and CSV export match the preview rows/columns.</li>\n<li>[ ] Empty state when no High/Critical incidents exist.</li>\n</ul>", "a": "", "owner": "cartermjones, Gabe Guzman", "why": "No board status set, so it is not in anyone queue. Last activity was 2026-07-28.", "last": {"who": "Gabe Guzman", "when": "2026-07-28", "txt": "**Scope note: not about visual fidelity** The screenshots and layout details in the parent ticket (#93) are reference only. Don't treat matching them pixel-for-pixel as part of this ticket. The card/modal chrome will follow whatever the standard Forge patterns are. What matters for this ticket is the data contract: - **Columns**: which fi"}}, {"g": "Open tickets, before 191", "n": "#186", "t": "Reports: Open Incidents Report", "st": "No status", "kind": "Existing", "changed": "", "sum": "Sub-issue of #93. One of 4 report cards on the Reports page (`Transportation.Incidents/Pages/Reports.razor` — currently a header-only stub).", "body": "<p>Sub-issue of #93. One of 4 report cards on the Reports page (<code>Transportation.Incidents/Pages/Reports.razor</code> — currently a header-only stub).</p>\n<h4>Report card</h4>\n<ul>\n<li><strong>Title:</strong> Open Incidents Report</li>\n<li><strong>Icon:</strong> <code>description</code></li>\n<li><strong>Card description:</strong> &quot;All currently open incidents requiring action&quot;</li>\n<li>Clicking the card / <strong>View Report</strong> opens the report preview modal.</li>\n</ul>\n<h4>Data scope / filter</h4>\n<ul>\n<li>Filter on status only: <code>dbo.Status.TypeCode IN (1, 2)</code> — Open or In Progress — joined via <code>dbo.IncidentEvent.StatusId</code>.</li>\n<li>Sort: <code>dbo.IncidentEvent.AddDateUTC</code> <strong>descending</strong> (newest first).</li>\n<li>No date-window and no severity filter.</li>\n</ul>\n<h4>Columns and their source tables</h4>\n<p>Data source: <code>_traversaContext.IncidentEvents</code> projected through the existing <code>IncidentEventQueryExtensions.ProjectToRecords()</code> (returns <code>IncidentRecord</code>). All 8 columns are already populated by that projection — only the status filter is new.</p>\n<ul>\n<li><strong>Incident ID</strong> — <code>dbo.IncidentEvent.IncidentEventId</code>. Display as <code>INC-{id}</code> via <code>DisplayHelper.GetIncidentIdDisplayString()</code>.</li>\n<li><strong>Date</strong> — <code>dbo.IncidentEvent.AddDateUTC</code> (<code>DATETIME</code>, stored UTC). Convert to user local, format <code>MM-DD-YYYY</code>.</li>\n<li><strong>Student</strong> — <code>dbo.IncidentEventStudent.StudentFirstName</code> + <code>StudentLastName</code> and <code>StudentUniqueId</code> (snapshot columns on the join row); live student is <code>IncidentEventStudent.StudentId</code> → <code>dbo.Student.StudentId</code>.</li>\n<li><strong>Type</strong> — <code>dbo.IncidentEventType.IncidentName</code>, joined via <code>dbo.IncidentEvent.IncidentEventTypeId</code>.</li>\n<li><strong>Vehicle</strong> — <code>dbo.IncidentEvent.AssetName</code> / <code>AssetUniqueId</code> (snapshot); live vehicle is <code>IncidentEvent.AssetId</code> → <code>dbo.Asset.AssetId</code>.</li>\n<li><strong>Driver</strong> — <code>dbo.IncidentEventEmployee.FirstName</code> + <code>LastName</code> where <code>IncidentEventEmployeeInvolvementTypeId</code> → <code>dbo.IncidentEventEmployeeInvolvementType.TypeCode = 2</code> (Driver); live employee via <code>EmployeeId</code> → <code>dbo.Employee.EmployeeId</code>.</li>\n<li><strong>Severity</strong> — <code>dbo.Severity.TypeName</code> via <code>dbo.IncidentEvent.SeverityId</code>. <code>TypeCode</code>: 1 Low, 2 Medium, 3 High, 4 Critical. Forge badge.</li>\n<li><strong>Status</strong> — <code>dbo.Status.Name</code> via <code>dbo.IncidentEvent.StatusId</code>. <code>TypeCode</code>: 1 Open, 2 In Progress, 3 Closed. Forge badge.</li>\n</ul>\n<p>Strong candidates to add for this report (all available on the same query — this is a work-queue report): <strong>Assigned To</strong> — <code>dbo.IncidentEventEmployee.FirstName</code> + <code>LastName</code> where involvement <code>TypeCode = 3</code> (Assignee); <strong>Current Workflow Step</strong> and <strong>Progress (x/y)</strong> — <code>dbo.IncidentEventStudent</code> → <code>dbo.WorkflowInstance</code> → <code>dbo.WorkflowInstanceStep</code> (<code>Name</code>, <code>Seq</code>, <code>Status.TypeCode</code>; <code>WorkflowStepStatusType.InProgress</code> = current step, count of <code>Completed</code> / total = progress); <strong>Days Open</strong> — computed from <code>IncidentEvent.AddDateUTC</code>.</p>\n<h4>Preview modal</h4>\n<ul>\n<li>Report title as H2.</li>\n<li><strong>Download Report</strong> primary button; <strong>Excel</strong> and <strong>CSV</strong> export options.</li>\n<li>Scrollable table with the 8 columns above.</li>\n<li>Footer: record count + generated-on date.</li>\n</ul>\n<h4>Open questions</h4>\n<ul>\n<li>Include the Assigned To / Current Step / Days Open columns in v1, or keep the shared 8-column layout across all four reports for consistency?</li>\n<li>Should this be capped to a date window, or all-time open incidents?</li>\n<li>Multi-student incidents: one row per student vs. comma-joined names — keep consistent across all four reports.</li>\n<li>PDF vs. Excel/CSV for v1.</li>\n</ul>", "ac": "<ul>\n<li>[ ] Report card renders in the Reports page grid with the title, icon and description above.</li>\n<li>[ ] Only incidents with status Open or In Progress appear, newest first.</li>\n<li>[ ] Status badge theming matches the incidents list (<code>statusTheme()</code> pattern).</li>\n<li>[ ] Footer shows correct record count and generated date.</li>\n<li>[ ] Excel and CSV export match the preview rows/columns.</li>\n<li>[ ] Empty state when no open incidents exist.</li>\n</ul>", "a": "", "owner": "cartermjones, Gabe Guzman", "why": "No board status set, so it is not in anyone queue. Last activity was 2026-07-28.", "last": {"who": "Gabe Guzman", "when": "2026-07-28", "txt": "**Scope note: not about visual fidelity** The screenshots and layout details in the parent ticket (#93) are reference only. Don't treat matching them pixel-for-pixel as part of this ticket. The card/modal chrome will follow whatever the standard Forge patterns are. What matters for this ticket is the data contract: - **Columns**: which fi"}}, {"g": "Open tickets, before 191", "n": "#188", "t": "Create Core DB stored procedure for seeding Incident role GUIDs into step templates and workflows", "st": "QA", "kind": "Existing", "changed": "", "sum": "Summary", "body": "<h4>Summary</h4>\n<p>When the <code>IncidentManagement</code> upgrade is enabled for a tenant, DevOps runs Justin&#x27;s <code>InsertDefaultIncidentPermission</code> (Security DB) which creates the five Incident Groups and returns their GUIDs. We need a companion stored procedure in the Core DB that accepts those GUIDs and sets up the role references in step templates and workflows.</p>\n<h4>Background</h4>\n<p>See <a href=\"https://github.com/tyler-technologies/transportation-traversa/pull/19960\" target=\"_blank\">https://github.com/tyler-technologies/transportation-traversa/pull/19960</a></p>\n<h4>DevOps provisioning flow</h4>\n<ol>\n<li>Run <code>InsertDefaultIncidentPermission</code> (Security DB) - creates Groups, returns GUIDs</li>\n<li>Run our new Core DB proc with those GUIDs</li>\n</ol>\n<h4>What the proc needs to do</h4>\n<p>The following SQL is being removed from <code>Script.PostDeployment.sql</code> as a separate task. The new stored proc must replicate what it did, but accepting role GUIDs as parameters instead of looking up <code>IncidentRoleType</code> ids.</p>\n<p>The proc should accept five GUID parameters (Administrator, Safety Coordinator, Driver, Fleet Manager, School Principal) and be idempotent (<code>IF NOT EXISTS</code> guards).</p>\n<h4>SQL being removed</h4>\n<p>Role id lookups (these become the proc&#x27;s GUID parameters):</p>\n<p>```sql</p>\n<p>declare @rDriver    int = (select IncidentRoleTypeId from IncidentRoleType where TypeCode = 1)</p>\n<p>declare @rSafety    int = (select IncidentRoleTypeId from IncidentRoleType where TypeCode = 2)</p>\n<p>declare @rAdmin     int = (select IncidentRoleTypeId from IncidentRoleType where TypeCode = 3)</p>\n<p>declare @rFleet     int = (select IncidentRoleTypeId from IncidentRoleType where TypeCode = 4)</p>\n<p>declare @rPrincipal int = (select IncidentRoleTypeId from IncidentRoleType where TypeCode = 6)</p>\n<p>```</p>\n<p>Step template assigned roles:</p>\n<p>```sql</p>\n<p>-- Parent/Guardian Notification -&gt; Safety Coordinator</p>\n<p>-- Photo &amp; Evidence Documentation -&gt; Driver</p>\n<p>-- Disciplinary Review -&gt; School Principal</p>\n<p>-- Law Enforcement Contact -&gt; Administrator</p>\n<p>-- Documentation &amp; Close -&gt; Safety Coordinator</p>\n<p>insert into WorkflowStepTemplate (..., DefaultIncidentRoleTypeId, ...)</p>\n<p>values (..., @rSafety, ...)  -- etc per template</p>\n<p>```</p>\n<p>Step template notify roles:</p>\n<p>```sql</p>\n<p>insert into WorkflowStepTemplateNotifyIncidentRole (WorkflowStepTemplateId, IncidentRoleTypeId, ...)</p>\n<p>select st.WorkflowStepTemplateId, @rSafety, ...</p>\n<p>from WorkflowStepTemplate st where st.Name = &#x27;Disciplinary Review&#x27;</p>\n<p>```</p>\n<p>Default workflow steps (Disruptive Behavior Response, Physical Altercation Response, Prohibited Items Response, Property Damage Investigation, Safety Violation Response) - each workflow&#x27;s steps reference roles via <code>DefaultIncidentRoleTypeId</code>:</p>\n<p>```sql</p>\n<p>insert into WorkflowStep (WorkflowId, DefaultIncidentRoleTypeId, ...) values</p>\n<p>((...), @rDriver, ...),   -- step 1</p>\n<p>((...), @rSafety, ...),   -- step 2</p>\n<p>...</p>\n<p>```</p>\n<p>Workflow step notify and approver roles:</p>\n<p>```sql</p>\n<p>insert into WorkflowStepNotifyIncidentRole (WorkflowStepId, IncidentRoleTypeId, ...)</p>\n<p>select ws.WorkflowStepId, @rSafety, ... where ws.Seq = 4</p>\n<p>insert into WorkflowStepApproverRole (WorkflowStepId, IncidentRoleTypeId, ...)</p>\n<p>select ws.WorkflowStepId, @rAdmin, ... where ws.Seq = 4</p>\n<p>```</p>\n<h4>Context</h4>\n<ul>\n<li>Related to transportation-traversa PR #19960 (<code>feature/develop/94-incident-tracker-permissions</code>)</li>\n<li>Part of the broader Incidents roles and permissions work</li>\n</ul>", "ac": "", "a": "", "owner": "Jon Jungman", "why": "Sitting in QA on the board. Open until it passes.", "last": {"who": "Jon Jungman", "when": "2026-08-14", "txt": "GH #145 caused additional changes for this item"}}, {"g": "New tickets, 191 and up", "n": "#191", "t": "Expand incident subjects beyond students, and capture incident date and time", "st": "No status", "kind": "New", "changed": "Body rewritten this weekend. Correction comments folded into the body, V1 and V2 language removed, roles corrected to the seeded set. One status comment with current screenshots.", "sum": "An incident is not always about a student. Two employees in a fight has no student. A bus damaged in the yard with nobody aboard has no student. A burst pipe in the depot has no student. A collision with another motorist has no student. STA and Cypress Fairbanks have both asked whether Incidents can be used for non-student events, so a student cannot be a required part of an incident.", "body": "<p>An incident is not always about a student. Two employees in a fight has no student. A bus damaged in the yard with nobody aboard has no student. A burst pipe in the depot has no student. A collision with another motorist has no student. STA and Cypress Fairbanks have both asked whether Incidents can be used for non-student events, so a student cannot be a required part of an incident.</p>\n<p>This is the parent issue for that change. It covers the subject model, the new incident types and workflows, the date and time capture, and the reorganized create form.</p>\n<p>Subjects.</p>\n<p>Every incident has exactly one subject. The subject is what the incident is fundamentally about. It determines which incident types are offered, which filing steps appear, which workflow is assigned, and how the record is labeled in the list and on the detail page. There are five:</p>\n<ul>\n<li>Student. One or more students involved. Requires at least one named student.</li>\n<li>Vehicle. Bus damage or a mechanical problem with nobody aboard. Names an affected vehicle, no people.</li>\n<li>Location. A depot, garage, or yard problem such as a burst pipe or power loss. Names an affected location, no people. Location is the entity Student Transportation already uses for a garage or depot, so the subject, its category, and its types all use that word rather than Facility.</li>\n<li>Third Party. Another motorist, a pedestrian, a parent, or a member of the public. Requires at least one named person.</li>\n<li>Employee. Employees only, such as a dispute between drivers or an injured aide. Requires at least one named employee.</li>\n</ul>\n<p>Access to an incident is governed the same way for every subject. There is no per-subject visibility rule and employee incidents are not restricted as a class. Who can see an incident is decided by the resource grants defined in #181, applied identically to all five subjects.</p>\n<p>Incident types.</p>\n<p>The incident type list is filtered by subject, so a vehicle incident only offers vehicle types. The type list has to cover all five subjects, so types and categories are defined for each below. Category describes what happened, not who was involved, because category is what the list filters on and what reports group by. The subject field already carries the relationship.</p>\n<ul>\n<li>Employee: Employee Altercation and Employee Misconduct under a new Employee Conduct category, Employee Substance Violation under the Prohibited category, Employee Injury under the Safety category.</li>\n<li>Location: Location Damage, Utility Failure, and Location Safety Hazard under a new Location category.</li>\n<li>Vehicle: Vehicle Damage and Mechanical Failure under a new Mechanical category, Single Vehicle Collision under a new Collision category.</li>\n<li>Third Party: Third Party Collision under Collision, Third Party Injury under Safety, Third Party Conduct under the Aggression / Violence category, Public Complaint under the Informational category.</li>\n</ul>\n<p>Employee Injury is not a conduct matter, so filing it under Employee Conduct would put a workplace injury into any conduct report pulled about that person. Employee Substance Violation sits under Prohibited alongside Weapon / Prohibited Items so that a district asking how many substance incidents they had gets one number rather than two split by whether a student or an employee was involved. Public Complaint under Informational keeps a parent phoning in a complaint out of the collision count that goes to leadership and insurance.</p>\n<p>Workflows.</p>\n<p>Each new type needs a default workflow. Workflow assignment keys off incident type plus severity, so these types need no new assignment logic. Routing differs by subject:</p>\n<ul>\n<li>Employee incidents assign to Administrator rather than a school principal. An employee matter is not a school discipline matter.</li>\n<li>Location incidents assign to Administrator. They should not reuse the Property Damage workflow, because the response and the approver are different.</li>\n<li>Vehicle incidents assign to Fleet Manager. Nobody was aboard, so there are no statements to collect and the workflow is shorter.</li>\n<li>Third Party incidents assign to Safety Coordinator, and run the steps needed for an outside party, including any claim or insurance follow-up.</li>\n</ul>\n<p>Steps assign to the five incident roles provisioned by #188: Driver, Safety Coordinator, Administrator, Fleet Manager, and School Principal. Roles attach to Student Transportation employees through <code>EmployeeIncidentRole</code>, and each role has a security group seeded by <code>InsertDefaultIncidentPermission</code>, so #188 stays a five GUID procedure. A district that wants a different owner for employee or location incidents reassigns the step in the workflow builder, the same as any other step.</p>\n<p>Date and time.</p>\n<p>An incident filed the next morning has to carry the date it happened, not the date it was filed. The record therefore needs two timestamps,
