 both visible on the incident.</p>\n<ul>\n<li>Incident date. When the incident occurred. Required. Defaults to today and cannot be set in the future. Helper text reads &quot;When the incident occurred, not when you are filing it.&quot;</li>\n<li>Incident time. Required. Not defaulted, so the reporter enters the value. Helper text reads &quot;Approximate is fine if the exact time is unknown.&quot;</li>\n<li>Reported date and time. When the record was created. Set by the system and not editable.</li>\n</ul>\n<p>Time is required because an AM run and a PM run are materially different events in transportation, time of day is the dimension any route or run based analysis needs, and it is what gives the gap between incident time and reported time any meaning. The reporter entering a historical incident from paper is asked on screen for a best estimate rather than a precise claim, which is what the helper text is for.</p>\n<p>Incident list sorting, date filters, and reports that group by day or month all use the incident date, because that is what users mean by when. The gap between the two timestamps is what makes late reporting visible, so the detail page shows both rather than collapsing them into one.</p>\n<p>New incident form layout.</p>\n<p>The form is reorganized around the subject rather than assuming a student. Choosing the subject comes first, before any other field. It has to, because the subject determines every field that follows. All five subjects are shown together so the whole choice is visible at once.</p>\n<p>Every subject then runs the same two steps: Incident Details, then Review and Submit. One form serves all five.</p>\n<p>Counted from the form, the Incident Details step carries 17 distinct fields, and 12 are identical for all five subjects: incident type, severity, description, date, time, location type, location on the map, witnesses, third parties, tags, photo evidence, and document evidence.</p>\n<p>Five vary, all governed by one map rather than by per-subject screens. People roster, on Student, Employee and Third Party. Affected asset, on Vehicle and Location, the only genuinely subject-specific field and one control whose label and source change. Vehicle Number, absent on Vehicle because the affected asset already names the bus, and absent on Location. Driver, absent on Location. Run, absent on Vehicle since nobody is aboard, and absent on Location.</p>\n<p>The per-subject delta from the shared set is therefore Student 4, Employee 4, Third Party 4, Vehicle 2, Location 1. This is one form with a field map, not five forms, which is what makes it a single estimable item rather than a redesign of every screen.</p>\n<p>Three rules follow from that. A field never changes position between subjects, so Incident Type sits in the same slot on all five. Fields are one ordered list flowed into a grid, so a field the subject does not need is not rendered and the fields after it close up, leaving no gap where an unused field would sit. People Involved is a section inside Incident Details rather than a step of its own, with per-person detail as an expandable row, and there is one roster implementation rather than one for students and a parallel one for everyone else.</p>\n<p>The roster is labeled by subject: Involved Students, Involved Employees, or Involved People.</p>\n<p>Field order follows the order a reporter thinks in: who, then what, then when and where, then supporting detail.</p>\n<p>Changing the subject after starting a report clears only the subject-specific answers, the incident type, the people involved, and the affected asset, and keeps date, time, description, location, and evidence. The reporter is warned first, so a mid-report switch is never a silent data loss.</p>\n<p>Named people carry a role of Participant, Witness, Reporter, or Injured, and a per-person severity, description, action taken, and notes.</p>\n<p>People who are present but are not the subject, witnesses and third parties on any subject, carry a name, a phone, an email, and a description. Not every one of them can be named. A person loitering at a stop, or a motorist who drove off, has to be filable as a description alone. A contact is therefore kept when it has either a name or a description, and dropped only when both are empty. Name is required where it is meaningful, which is the subject of the incident: a student, an employee, or a named third party.</p>\n<p>Incidents list and detail.</p>\n<p>The incidents list replaces its Student column with an Involved column that names whoever or whatever the incident is about, and adds Subject as a sortable, filterable column. Without a subject filter there is no way to isolate location incidents or to pull a student view that excludes employee records, which several acceptance criteria below depend on.</p>\n<p>Incident detail shows an Involved Parties section for employee and third party incidents, and an Affected Location or Affected Vehicle card for the two people-free subjects.</p>\n<p>School filtering.</p>\n<p>Non-student incidents are not filtered by school. This matches the decision in #190 that drivers and vehicles are out of scope for school-based access.</p>\n<p>One implementation note. The school filter matches an incident when at least one of its students attends a school the user can access. An incident with no students fails that test, so it would resolve to visible to nobody. Studentless incidents need to bypass the school filter rather than be evaluated by it.</p>\n<p>A known tradeoff comes with that. Non-student subjects carry no school scoping of any kind, because drivers have no school foreign key and vehicles carry only a garage LocationId. A user with full employee incident access therefore sees every employee incident district wide. Garage or department scoping would be new architecture and is not in this issue.</p>\n<p>Acceptance criteria.</p>\n<ul>\n<li>A Vehicle incident saves with an affected vehicle, no people, and no validation error, and its filing flow shows the same two steps as every other subject.</li>\n<li>A Location incident saves with an affected location, no people, and no validation error, and its filing flow shows the same two steps as every other subject.</li>\n<li>A witness or third party can be saved with a description and no name, and is dropped only when name and description are both empty.</li>\n<li>An Employee incident saves with one or more employees, and is visible to exactly the users its resource grants allow, with no additional restriction applied for being an employee incident.</li>\n<li>A Third Party incident saves with one or more named outside people.</li>\n<li>All five subjects show the same two steps, and Incident Type appears in the same position on all five.</li>\n<li>The incident type dropdown only offers types matching the chosen subject.</li>\n<li>Each new incident type is assigned its workflow on creation, and its steps can be completed and approved the same as a student incident.</li>\n<li>Incident date and incident time are both required, and the Incident Details step cannot be completed without both.</li>\n<li>Incident date cannot be set to a future date.</li>\n<li>Reported date and time cannot be edited by any role.</li>\n<li>Incident list sorting and date filters operate on the incident date.</li>\n<li>The incidents list shows Subject as a column and can be filtered to a single subject.</li>\n<li>Changing subject mid-report clears type, people, and asset, keeps date, time, description, location, and evidence, and warns first.</li>\n<li>The incidents list, incident detail, dashboard, and reports render every subject with no blank subject and no null error.</li>\n<li>A user with access to a single school still sees Vehicle, Location, Third Party, and Employee incidents.</li>\n</ul>", "ac": "", "a": "", "owner": "Unassigned", "why": "", "last": {"who": "Gabe Guzman", "when": "2026-08-24", "txt": "**Status update. The prototype for subject based incidents is up.** Preview build covering all five subjects: https://captwildguns.github.io/incidents-v2/ **Subject first, because it determines every field that follows** All five subjects on one row, so the whole choice is visible without scrolling. **One form for all five subjects** Two "}}, {"g": "New tickets, 191 and up", "n": "#192", "t": "Tyler Drive crossover: accept a tablet incident submission and create the incident record", "st": "Ready For Dev", "kind": "New", "changed": "", "sum": "Accept an incident submitted from a Tyler Drive tablet and create it as a full incident record, with several involved students on one incident, photo evidence, and triage for a submission that cannot be matched to known records.", "body": "<p>Accept an incident submitted from a Tyler Drive tablet and create it as a full incident record, with several involved students on one incident, photo evidence, and triage for a submission that cannot be matched to known records.</p>\n<p>This issue is the spec of record for the Tyler Drive crossover and covers the Incidents side. The tablet application work is delivered under tyler-technologies/tyler-drive-maui#366. The submit endpoint and configuration are delivered under tyler-technologies/tyler-drive-api#140.</p>\n<p>V1 is a driver filing an incident from the tablet, for every subject. A driver facing incident list, incident detail, and driver to coordinator messaging are not in V1.</p>\n<h4>What already exists and is reused</h4>\n<ul>\n<li>Several involved students on one incident. <code>NewIncidentStep</code> runs InvolvedStudents, IncidentDetails, PerStudentDetails, ReviewAndSubmit, and <code>IncidentDetail</code> carries a <code>StudentWorkflows</code> collection holding one workflow instance per student</li>\n<li>Attachments. <code>AttachmentService</code> over <code>S3AttachmentStorage</code> behind <code>IAttachmentStorage</code>, <code>IncidentAttachmentRecord</code>, and <code>AttachmentUploadValidator</code> enforcing max size, an extension allowlist, and executable detection</li>\n<li><code>AttachmentFileType.Photo</code>, and <code>IncidentDetail</code> keeping <code>Photos</code> separate from <code>Documents</code></li>\n</ul>\n<h4>1. Accept a submission and create the incident</h4>\n<ul>\n<li>One submission creates one incident. The driver who submitted it is the reporter</li>\n<li>Subject is one of Student, Employee, Vehicle, Location, or Third Party, using the names established in #191</li>\n<li>Incident type and severity arrive as submitted. Severity is defaulted from the type on the tablet and is editable there, so the submitted value is authoritative</li>\n<li>The incident date and time are stored separately from the submission time</li>\n<li>Run, vehicle, driver, school, and grade context captured silently by the tablet is stored on the incident</li>\n<li>The GPS pin and the on a run indicator are stored on the incident</li>\n<li>The incident is assigned its workflow on creation and enters it immediately, identical to an incident created in the web app</li>\n<li>An incident created from a tablet is indistinguishable from a web created incident everywhere except its recorded source</li>\n</ul>\n<h4>2. Several involved students on one submission</h4>\n<ul>\n<li>The submission carries a collection of involved students, not a single student</li>\n<li>Each involved student carries their own role of Participant, Witness, Reporter, or Injured, plus their own severity, statement, and action taken</li>\n<li>All of them land on one incident, with one <code>StudentWorkflows</code> instance per student, matching what the web app creates today</li>\n<li>A submission with one student behaves identically to a submission with several</li>\n</ul>\n<p>Acceptance criteria:</p>\n<ul>\n<li>A submission naming three students creates one incident with three involved students, not three incidents</li>\n<li>Each involved student has their own role, severity, statement, and action taken on the record</li>\n<li>One workflow instance exists per involved student</li>\n<li>School based access resolves against every involved student, so a user with access to any one of their schools sees the incident, unchanged from #190</li>\n<li>A submission naming one student creates one incident with one involved student</li>\n</ul>\n<h4>3. Photo evidence</h4>\n<ul>\n<li>Photos captured on the tablet arrive with the submission and are stored through the existing attachment service</li>\n<li>They are recorded as <code>AttachmentFileType.Photo</code> and appear on the incident&#x27;s Photos tab</li>\n<li>The same validation the web upload applies is applied to a tablet photo, including max size, extension allowlist, and executable detection</li>\n<li>A photo that fails validation is rejected individually and recorded as such. It does not fail the incident</li>\n</ul>\n<p>Acceptance criteria:</p>\n<ul>\n<li>A photo taken on the tablet is present on the resulting incident and viewable on the Photos tab</li>\n<li>Several photos on one submission all arrive</li>\n<li>An oversized or disallowed file is rejected and the incident is still created, with the rejection visible to the coordinator</li>\n<li>A photo is never silently dropped</li>\n</ul>\n<h4>4. Triage for an unmatched submission</h4>\n<ul>\n<li>A submission whose student, employee, or vehicle cannot be matched to a known record still creates the incident</li>\n<li>The unmatched values are retained exactly as submitted so a coordinator can resolve them</li>\n<li>The incident is surfaced as needing triage rather than failing or being held</li>\n<li>Losing a driver&#x27;s report is worse than holding a partial one</li>\n</ul>\n<p>Acceptance criteria:</p>\n<ul>\n<li>A submission with an unmatched subject creates an incident and does not error to the tablet</li>\n<li>The submitted values that could not be matched are visible on the incident</li>\n<li>Incidents needing triage are findable as a set, not one at a time</li>\n<li>Resolving the match completes the incident without re-entry</li>\n<li>Photos and the GPS pin survive on an incident that needed triage</li>\n</ul>\n<h4>Out of scope</h4>\n<ul>\n<li>The driver facing incident list, incident detail, and driver to coordinator messaging. <code>DriverMEssageController</code> and <code>CannedResponseController</code> already exist in <code>tyler-drive-api</code>, so most of the plumbing for messaging is in place when it is picked up</li>\n<li>An authoring UI for the form definitions. Definitions are loaded per tenant, covered under tyler-technologies/tyler-drive-api#140</li>\n<li>Any change to existing conduct form submissions or their FTP and CSV delivery, which continue to work unchanged</li>\n</ul>\n<h4>Dependencies</h4>\n<ul>\n<li>tyler-technologies/tyler-drive-api#140 delivers the submit endpoint the tablet posts to and the form definitions</li>\n<li>tyler-technologies/tyler-drive-maui#366 delivers the tablet application work, including the involved student collection</li>\n<li>#191 establishes the subject names used here</li>\n<li>#181 and #193 define the permission model that governs who sees a tablet created incident, including the Driver role defaults</li>\n</ul>", "ac": "<ul>\n<li>A submission for each of the five subjects creates an incident with every submitted field mapped</li>\n<li>The incident appears in the list, in search, and in dashboard counts subject to existing permission and school based filtering</li>\n<li>The incident is on its assigned workflow with the first step live</li>\n<li>Incident date and time are queryable independently of the submission time</li>\n<li>The GPS pin renders on the incident the same way a web entered location does</li>\n<li>The source of the incident is recorded and reportable</li>\n</ul>", "a": "Book an hour with Mark on how incident forms work today and what is needed, then write the issue from it. This also has to cover defining the forms inside Incidents, not just accepting them.", "owner": "Unassigned", "why": "", "last": {}}, {"g": "New tickets, 191 and up", "n": "#193", "t": "Seed follow up: expand the incident permission resources and grant the subject areas", "st": "No status", "kind": "New", "changed": "Now records that delete is limited to one group, removes an incident from view rather than the row, and is written to the audit trail.", "sum": "Follow up to transportation-traversa#19960, covering blocks 2 and 3 of #181. The work is in the Security DB seeding procs, so delivery lands in transportation-traversa. 19960 stays as approved and these changes go in a new PR.", "body": "<p>Follow up to transportation-traversa#19960, covering blocks 2 and 3 of #181. The work is in the Security DB seeding procs, so delivery lands in transportation-traversa. 19960 stays as approved and these changes go in a new PR.</p>\n<h4>1. Resource tree</h4>\n<p><code>incident-drivers</code> is renamed to <code>incident-employees</code>. In Student Transportation a driver is an Employee, so a separate driver resource would overlap the Employee subject that #191 introduces. The resource is seeded with no grants and is not yet enforced, so the rename carries no data impact.</p>\n<p><code>incident-locations</code> is added as a new subject resource for the Location subject.</p>\n<h4>2. Grants for the subject areas</h4>\n<p>19960 leaves the subject areas and <code>incident-admin</code> ungranted. Combined with the enforcement in #181, ungranted means no role can reach those areas, so defaults are required.</p>\n<ul>\n<li><code>incident-students</code>: Admin full, Safety full, Principal read, Fleet none, Driver none</li>\n<li><code>incident-employees</code>: Admin full, Safety full, Fleet read, Principal none, Driver none</li>\n<li><code>incident-vehicles</code>: Admin full, Fleet full, Safety read and update, Principal none, Driver none</li>\n<li><code>incident-locations</code>: Admin full, Safety full, Principal read, Fleet none, Driver none</li>\n<li><code>incident-admin</code>: Admin full, all other roles none</li>\n</ul>\n<p>These are shipped defaults that districts change in the role editor.</p>\n<p>Delete is Administrator only, and no other role receives it for any subject area. Deleting an incident removes it from view rather than removing the row: it drops out of lists, counts, search and reports, while the record and its history are retained, and the deletion itself is written to the audit trail with the user and the time.</p>\n<p>Acceptance criteria:</p>\n<ul>\n<li>A tenant with the upgrade enabled has the grants above after the permission seed runs</li>\n<li>Each of the five default roles reaches exactly the areas listed and no others</li>\n<li>Re-running the seed adds no duplicate grants</li>\n<li>Existing grants are never edited or removed</li>\n<li>No role other than Administrator holds delete on any incident subject area</li>\n</ul>\n<h4>Out of scope</h4>\n<ul>\n<li>Application enforcement of the resources, covered by #181</li>\n<li>Third party subject resources, deferred until a Student Transportation entity exists for third party</li>\n<li>Running <code>InsertDefaultIncidentPermission</code> at upgrade enable, tracked separately</li>\n</ul>", "ac": "<ul>\n<li><code>incident-employees</code> exists in place of <code>incident-drivers</code>, nested under the <code>incidents</code> parent</li>\n<li><code>incident-locations</code> exists, nested under the <code>incidents</code> parent</li>\n<li>Both carry <code>ResourcePermissionProperty</code> entries consistent with the other subject resources</li>\n<li>Both appear in the role permission tree under the <code>IncidentManagement</code> upgrade and are hidden when the upgrade is off</li>\n<li>Permission labels are present in <code>Permission.resx</code> and the es-US, fr-CA and ar-SA locale files</li>\n<li>Seeding remains additive, <code>NOT EXISTS</code> guarded, and re-runnable</li>\n</ul>", "a": "Same role naming change. Still open: whether anyone can file against an employee subject, and whether permissions are page level, type level or subject level.", "owner": "Justin Smith", "why": "", "last": {}}, {"g": "New tickets, 191 and up", "n": "#194", "t": "New incident form: auto-populate the driver from the selected run or vehicle", "st": "No status", "kind": "New", "changed": "", "sum": "Vehicle, Run, and Driver are three independent selects on the new incident form with no relationship between them. The reporter picks all three by hand, and nothing connects the driver to the vehicle or the run being entered. Student Transportation already holds both associations, so the form is asking for something it could derive.", "body": "<p>Vehicle, Run, and Driver are three independent selects on the new incident form with no relationship between them. The reporter picks all three by hand, and nothing connects the driver to the vehicle or the run being entered. Student Transportation already holds both associations, so the form is asking for something it could derive.</p>\n<p>What already exists.</p>\n<ul>\n<li>A run carries its assigned driver on <code>Run.EmployeeId</code>, and any additional employees such as aides in <code>RunEmployees</code>.</li>\n<li>A vehicle carries a default driver, modeled as an <code>EmployeeAsset</code> of type <code>DefaultDriver</code>. It is optional, so not every vehicle has one, and it already renders on the vehicle card.</li>\n</ul>\n<p>Behavior.</p>\n<ul>\n<li>Selecting a run populates Driver from that run&#x27;s assigned driver.</li>\n<li>Selecting a vehicle populates Driver from that vehicle&#x27;s default driver.</li>\n<li>When both are selected the run wins, because a run assignment is the more specific fact.</li>\n<li>Every populated value stays editable. Substitute drivers are routine and the reporter has to be able to correct it.</li>\n<li>A derived value is visibly marked as derived rather than typed, so the reporter knows to check it.</li>\n<li>When the association does not exist nothing is populated, and no validation error is raised.</li>\n</ul>\n<p>Derivation uses the current assignment, which is what the vehicle card shows today. This is a known limitation rather than an oversight: an incident filed several days late can prefill the driver assigned now rather than the one driving then. Keeping the field editable and marking it as derived is the mitigation. Deriving from the assignment as of the incident date would need a historical assignment lookup and is out of scope here.</p>\n<p>Acceptance criteria.</p>\n<ul>\n<li>Selecting a run with an assigned driver populates Driver with that driver.</li>\n<li>Selecting a vehicle with a default driver, and no run, populates Driver with that driver.</li>\n<li>Selecting both a run and a vehicle populates Driver from the run.</li>\n<li>A populated Driver can be changed to any other driver, and the change is what saves.</li>\n<li>Selecting a vehicle with no default driver leaves Driver empty with no error.</li>\n<li>A derived value is visually distinguishable from one the reporter chose.</li>\n</ul>\n<p>Split out of #191 so that issue stays scoped to the subject model. The three selects are at <code>NewIncidentForm.tsx:1338</code>, <code>:1351</code>, and <code>:1375</code> in the V2 prototype.</p>", "ac": "", "a": "", "owner": "Unassigned", "why": "", "last": {}}, {"g": "New tickets, 191 and up", "n": "#195", "t": "Workflow step approval has no recorded outcome and no reject path", "st": "No status", "kind": "New", "changed": "", "sum": "A workflow step can be marked as requiring approval, but nothing records the outcome of that approval and there is no way to reject.", "body": "<p>A workflow step can be marked as requiring approval, but nothing records the outcome of that approval and there is no way to reject.</p>\n<p>What exists today.</p>\n<ul>\n<li><code>WorkflowInstanceStep.RequiresApproval</code> flags that a step needs approval.</li>\n<li><code>WorkflowStepApproverRole</code> defines which incident roles may approve a step, at the definition level.</li>\n<li><code>WorkflowStepStatusType</code> has four values: Not Started, In Progress, Complete, Skipped. There is no Pending Approval and no Rejected.</li>\n<li>The only completion evidence on an instance step is <code>CompletedByEmployeeId</code>, <code>CompletedDateUTC</code> and <code>Notes</code>.</li>\n</ul>\n<p>Two consequences.</p>\n<p>First, an approval is indistinguishable from a completion. When an approver approves a step, the record shows the same fields it would show if the assignee had simply completed it. There is no approver identity and no approval timestamp, so a district cannot answer who approved a disciplinary action.</p>\n<p>Second, an approver has no way to reject. The only available actions are approve, which means completing the step, or leave it alone. A step that should go back to its assignee for more information can only stall silently.</p>\n<p>Requirement.</p>\n<ul>\n<li>A step that requires approval records the approver, the approval timestamp, and the outcome, separately from who completed the work.</li>\n<li>An approver can reject a step with a required reason. Rejecting returns the step to In Progress, keeps the work already recorded, and notifies the assignee.</li>\n<li>The rejection reason and the rejecting approver persist on the step and appear in the incident history, which #73 already writes.</li>\n<li>A step that was rejected and later approved keeps both events rather than overwriting the first.</li>\n<li>A step pending approval is visibly distinct from one still in progress.</li>\n</ul>\n<p>Note on reuse. Student Transportation already has an approval framework in <code>ApprovalPath</code>, <code>ApprovalPathLevel</code> and <code>ApprovalPathLevelApprover</code>, currently unrelated to incident workflow steps. Worth deciding whether incidents adopt it rather than adding approval columns to <code>WorkflowInstanceStep</code>, since a district that already configures approval paths elsewhere will expect them to behave the same way.</p>\n<p>Found while answering the Help page content audit on #139.</p>", "ac": "", "a": "Parked pending Cypress-Fairbanks. Capture what a rejection means to them, and if they do not reject anything this scopes out.", "owner": "Unassigned", "why": "", "last": {}}, {"g": "New tickets, 191 and up", "n": "#196", "t": "Secondary pages for the new incident subjects: locations, employees, and drill-through by identity", "st": "No status", "kind": "New", "changed": "", "sum": "191 adds Location, Employee, Vehicle and Third Party subjects. The incident list and incident detail handle all four. The entity pages around them do not, so a district can file these incidents but cannot look at them from the other direction.", "body": "<p>#191 adds Location, Employee, Vehicle and Third Party subjects. The incident list and incident detail handle all four. The entity pages around them do not, so a district can file these incidents but cannot look at them from the other direction.</p>\n<p><strong>1. There is no Locations page, and the affected location is not a real reference.</strong></p>\n<p>Vehicles and Drivers each have a page that lists the entity, shows an incident count, and drills into the incidents behind that count. Locations have neither. A facilities manager cannot ask which depot has the most incidents this year, which is the first question a location subject invites.</p>\n<p>Underneath that, the affected location is captured as a name string rather than a reference to a Student Transportation Location. Vehicles already carry a garage LocationId, so the entity exists and the incident is not using it. Until the affected location is a reference, a Locations page cannot be built, and renaming a location silently orphans every incident that named it.</p>\n<p><strong>2. There is no Employees page.</strong></p>\n<p>Drivers is the only people page and it is drivers-only, organized around certifications and their expiry. An aide, a mechanic, or a supervisor who is the subject of an employee incident has no profile and no incident history, so employee incidents will be filed against people who cannot then be looked up.</p>\n<p>This does not have to be a new page. Broadening Drivers to all employees with a role filter would cover it, and matches how Student Transportation already treats drivers as employees rather than a separate population.</p>\n<p><strong>3. Drill-through from an incident count is a name search, not an identity filter.</strong></p>\n<p>The incident count on the Drivers and Vehicles grids opens the incidents list with the entity&#x27;s name pushed in as a free-text search term. That works well enough for a bus number, but it over-matches on people: two employees sharing a surname return each other&#x27;s incidents, and a location name appearing in any incident description matches too. Every new subject makes this worse, because employee and location incidents are the ones identified by name rather than by a number.</p>\n<p>Acceptance criteria.</p>\n<ul>\n<li>An incident&#x27;s affected location references a Student Transportation Location rather than storing its name.</li>\n<li>A Locations view lists locations with an incident count, and the count opens the incidents behind it.</li>\n<li>Every employee who can be the subject of an employee incident is reachable from a people page, with their incident history.</li>\n<li>Drill-through from any entity&#x27;s incident count returns only incidents involving that entity, matched by identity rather than by name.</li>\n</ul>\n<p>Split out of #191, which owns the subject model itself. The three gaps above are separable and may be worth splitting if they land in different sprints.</p>", "ac": "", "a": "", "owner": "Unassigned", "why": "", "last": {}}, {"g": "New tickets, 191 and up", "n": "#197", "t": "Incident assignment and routing", "st": "No status", "kind": "New", "changed": "", "sum": "Today every incident is pre-assigned on creation, and the only assignment tool that exists afterwards is Reassign on the dashboard. In the prototype the assignee is hardcoded, `assignedTo: 'Sarah Williams'` at `NewIncidentForm.tsx:615`, so every new incident lands on the same person regardless of subject, type, severity, or school.", "body": "<p>Today every incident is pre-assigned on creation, and the only assignment tool that exists afterwards is Reassign on the dashboard. In the prototype the assignee is hardcoded, <code>assignedTo: &#x27;Sarah Williams&#x27;</code> at <code>NewIncidentForm.tsx:615</code>, so every new incident lands on the same person regardless of subject, type, severity, or school.</p>\n<h4>Direction from the Aug 12 review</h4>\n<p>Round robin across safety coordinators was proposed and rejected. Justin&#x27;s concern was implementing round robin across the board, and nobody has asked for it.</p>\n<p>The pattern that has to be supported instead comes from a real district: one person handles the majority of all incidents, and one specific school routes to a dedicated person on a different workflow.</p>\n<p>A middle option was raised and not pursued: assign a type to one or more people and round robin only within that group.</p>\n<h4>Design</h4>\n<p><strong>The workflow carries the incident owner.</strong> A workflow can be designated to a user, and that user becomes the incident&#x27;s assignee at creation.</p>\n<p>The incident needs one owner from the moment it is created, before any step is in progress. Taking the owner from a step would mean the owner shifts as the workflow advances, which makes an &quot;assigned to me&quot; view unstable, and Reassign already operates on the incident rather than on a step. Because a workflow is already selected by incident type and severity, one assignee per workflow expresses &quot;all of these go to one person&quot; directly, as a single setting rather than one per step.</p>\n<p><strong>Steps stay role-based, with no per-step user override.</strong> Steps already assign to a role, and the role list is the seven members of <code>IncidentRoleType</code>, so a district can already say that Disciplinary Review goes to School Principal. A per-step user override would add a second way to assign, create an ambiguity whenever the role and the override disagree, and answer a question nobody has asked. A district that genuinely needs a named person on a specific step creates a second workflow, which is how the district above already handles its one-school exception.</p>\n<h4>Requirements</h4>\n<ul>\n<li>A workflow can be designated to a user. When an incident is created and that workflow is assigned, the incident&#x27;s assignee is that user.</li>\n<li>The designated user is validated against active employees. A workflow cannot be pointed at an inactive or deleted employee.</li>\n<li>When a designated user becomes inactive, the behavior is defined rather than discovered: the workflow&#x27;s designation is cleared and incidents created against it open unassigned into the triage queue, and the condition is surfaced to an administrator.</li>\n<li>A workflow with no designated user creates the incident unassigned.</li>\n<li>Reassign on the dashboard continues to work, and reassigning an incident never changes the workflow&#x27;s designation.</li>\n<li>Non-student subjects carry no school, so no assignment rule may depend on school without a defined fallback for employee, vehicle, location and third party incidents.</li>\n</ul>\n<h4>Known consequence</h4>\n<p>Workflow selection keys off incident type and severity, not school. A district wanting a school-specific owner has to create a separate workflow for that school, which is what the district above already does. That works, but it means workflow proliferation for every school needing special handling. Recorded as a tradeoff rather than a defect.</p>\n<h4>Still open</h4>\n<p>The instruction from Aug 12 was to find out how that district actually processes and assigns incidents before finalizing this. That discovery is in motion: outreach to Cypress-Fairbanks went out on Aug 19 and a session with their student management leadership is being scheduled. The design above should be confirmed against what that conversation turns up before it is built.</p>", "ac": "", "a": "Same role naming change. Ownership is built, but the design was to be confirmed against Cypress-Fairbanks discovery on how that district assigns incidents, and that session is not booked.", "owner": "Unassigned", "why": "", "last": {}}, {"g": "New tickets, 191 and up", "n": "#198", "t": "MDM: organization selector in Incidents, matching the Student Transportation slide-out tree", "st": "No status", "kind": "New", "changed": "", "sum": "On an MDM site a user can have access to several districts, so Incidents needs a way to choose which ones they are looking at. Scoping the data is #108. This issue is the control that sets the scope.", "body": "<p>On an MDM site a user can have access to several districts, so Incidents needs a way to choose which ones they are looking at. Scoping the data is #108. This issue is the control that sets the scope.</p>\n<p>Student Transportation already has this control, which answers the question in #108&#x27;s original body about whether a tree control exists. It does.</p>\n<h4>How it works today</h4>\n<p>In <code>tyler.tms.slideOutMenuEx.js</code>:</p>\n<ul>\n<li>It lives in the slide-out navigation menu rather than the page header.</li>\n<li>It is a hierarchical checkbox tree built from <code>api/Org/GetOrg?orgName=Global</code>, so the district hierarchy is shown as a tree rather than a flat list.</li>\n<li>It is multi-select. A user checks every organization they want in scope rather than switching one at a time, and the checked set is collected and saved together.</li>\n<li>The selection is saved explicitly, behind a confirmation, rather than applying on each click.</li>\n<li>Organizations outside the user&#x27;s claims are rendered disabled rather than hidden, so the hierarchy stays legible.</li>\n</ul>\n<h4>Requirements</h4>\n<ul>\n<li>Incidents uses the same organization selector as the rest of Student Transportation. It is not a new control and not a separate selection: a user who has scoped to two districts elsewhere sees those same two in Incidents.</li>\n<li>The selector appears only when MDM is on and the user has access to more than one organization. A single-organization user sees nothing.</li>\n<li>Changing the selection refreshes the incidents list, the dashboard, reports and communications to the new scope.</li>\n<li>The active scope is visible without opening the slide-out menu, so a user knows which districts they are looking at before reading a count.</li>\n<li>An incident opened by direct link that falls outside the current scope is handled explicitly rather than rendering blank: either the scope widens to include it, or the user is told they need to select that district.</li>\n<li>Creating an incident while several organizations are in scope requires the organization to be resolved per #108. This issue does not restate that rule.</li>\n</ul>", "ac": "<ul>\n<li>With MDM off, no selector appears anywhere in Incidents.</li>\n<li>With MDM on and one organization available, no selector appears.</li>\n<li>With MDM on and several available, the selector matches the Student Transportation tree, shows unavailable organizations disabled, and saves a multi-organization selection.</li>\n<li>Changing the selection updates every incident view without a full reload of the application.</li>\n<li>The active scope is visible on screen outside the slide-out menu.</li>\n<li>A direct link to an out-of-scope incident produces an explicit message or a scope change, never an empty page.</li>\n</ul>\n<p>Split from #108, which owns the data scoping and filtering.</p>", "a": "Folds into the single MDM epic with #108.", "owner": "Unassigned", "why": "", "last": {}}, {"g": "New tickets, 191 and up", "n": "#199", "t": "Term on the incident record, and a student's incident history separated by year", "st": "Product Item", "kind": "New", "changed": "New this weekend. Term association changed this morning: it comes from the user's default term, not from the incident date.", "sum": "An incident belongs to a school term, and that is a question people ask both when they open a record and when they look at a student's history. Raised in the Aug 19 review: opening an incident does not show the term it occurred in, and a student's incident history runs together with no indication of which incidents belong to which year.", "body": "<p>An incident belongs to a school term, and that is a question people ask both when they open a record and when they look at a student&#x27;s history. Raised in the Aug 19 review: opening an incident does not show the term it occurred in, and a student&#x27;s incident history runs together with no indication of which incidents belong to which year.</p>\n<p>Term on the record.</p>\n<p>The incident record shows the term the incident occurred in. The term is resolved from the incident date rather than entered by the reporter, so there is no term field to fill in and none to keep in step with the date. Changing the date changes the term.</p>\n<p>Resolution is by finding which of the district&#x27;s configured terms contains the incident date, not by computing from a fixed month, because districts do not all start their year in the same month.</p>\n<p>This depends on the incident date from #191. Until an incident carries the date it happened, there is nothing to resolve a term from.</p>\n<img src=\"https://raw.githubusercontent.com/captwildguns/incidents-v2/main/issue-191-screenshots/aug24-7-term-on-record.jpg\" alt=\"\">\n<p>A student&#x27;s incident history is separated by year.</p>\n<p>Opening a student shows every incident they have been involved in, across all terms, grouped under a year heading. The purpose is pattern analysis: a student with one incident last year and four this year should read as an escalation at a glance, and that is only visible if the years are distinguishable and the older ones are still there.</p>\n<p>The history is not filtered to the current term. A student&#x27;s incidents from prior years remain on their record and remain readable, in the same list, under their own heading.</p>\n<img src=\"https://raw.githubusercontent.com/captwildguns/incidents-v2/main/issue-191-screenshots/aug24-8-student-history-by-year.png\" alt=\"\">\n<p>What is scoped by term and what is not.</p>\n<ul>\n<li>A student&#x27;s incident history is never scoped by term. It shows all years, grouped by year.</li>\n<li>Incidents, and any count of incidents on the Incidents page, are never scoped by term. The Incidents list carries the same year separation, so a search that reaches back into a prior year stays readable.</li>\n<li>The Students page roster is scoped to the current term, since a roster is a term-based thing. A student appears there if they have at least one incident. The current term comes from the signed-in user&#x27;s session.</li>\n<li>Any count whose label does not name a term is not scoped by one.</li>\n</ul>", "ac": "<ul>\n<li>Opening any incident shows the term it occurred in.</li>\n<li>The term shown is the configured term containing the incident date, verified for a district whose year does not start in August as well as one whose year does.</li>\n<li>An incident dated in a prior term still opens, and still shows that prior term rather than the current one.</li>\n<li>Opening a student who has incidents in more than one year shows all of them, grouped under a heading per year, most recent year first.</li>\n<li>A student whose only incidents are in a prior year still shows those incidents rather than an empty history.</li>\n<li>Searching within a student&#x27;s history matches across years rather than only the most recent one.</li>\n<li>The Incidents list shows incidents from more than one term at once, with a visible break between years.</li>\n<li>No control on the Incidents page or the student record filters by term.</li>\n<li>Changing the incident date changes the term shown, with no separate term field to update.</li>\n</ul>", "a": "Rewrite the term association. It comes from the signed-in user's default term in their Student Transportation profile, and the incident is associated to it, rather than being derived from the incident date. Sized at less than a day.", "owner": "Unassigned", "why": "", "last": {}}, {"g": "New tickets, 191 and up", "n": "#200", "t": "Capture when the incident happened, separately from when it was reported", "st": "Product Item", "kind": "New", "changed": "New this weekend.", "sum": "An incident is often filed after the fact. A driver finishes the route, and the report gets written that evening or the next morning. The record has to carry the date and time the incident happened, not the moment someone got around to entering it, because every question anyone asks of the data afterward is about when it happened.", "body": "<p>An incident is often filed after the fact. A driver finishes the route, and the report gets written that evening or the next morning. The record has to carry the date and time the incident happened, not the moment someone got around to entering it, because every question anyone asks of the data afterward is about when it happened.</p>\n<p>The record therefore holds two separate timestamps, and both are visible on the incident.</p>\n<p>Incident date and time. When the incident occurred. Both required.</p>\n<ul>\n<li>The date defaults to the current date.</li>\n<li>The date cannot be set in the future.</li>\n<li>The time starts empty rather than prefilled with the current clock. A prefilled time passes validation while being wrong, which is the exact error this field exists to catch, so the reporter has to enter a value.</li>\n<li>Helper text on the date reads &quot;When the incident occurred, not when you are filing it.&quot;</li>\n<li>Helper text on the time reads &quot;Approximate is fine if the exact time is unknown.&quot;</li>\n</ul>\n<p>Reported date and time. When the record was created. Set by the system, and not editable by any role including Administrator.</p>\n<p>Editing an incident later can correct the incident date and time. The reported values never change.</p>\n<p>Where the incident date is used. Sorting and date filtering on the incidents list, and any report that groups by day, month or term, all use the incident date, because that is what people mean by when it happened. The reported timestamp is a record-keeping value, not a reporting axis.</p>\n<p>Lateness is not a product judgment. There was never a time when incidents were reported at the moment they happened, and what counts as late depends on district policy. The product records both values so a district can answer that against its own policy. Nothing in the interface or in a report flags, badges or counts an incident as late.</p>", "ac": "<ul>\n<li>An incident cannot be submitted without both an incident date and an incident time.</li>\n<li>The date field arrives defaulted to the current date, and the time field arrives empty.</li>\n<li>Choosing a date in the future is rejected with a clear message.</li>\n<li>The incident record displays the incident date and time and the reported date and time as distinct values.</li>\n<li>No role can edit the reported date and time, verified as Administrator.</li>\n<li>Editing an incident changes the incident date and time and leaves the reported values untouched.</li>\n<li>An incident entered the morning after the event shows the previous day as the incident date and the current day as reported.</li>\n<li>The incidents list sorts and filters on the incident date, not the reported date.</li>\n<li>A report grouped by day or month groups on the incident date.</li>\n<li>Nothing in the interface or in any report describes an incident as late or overdue relative to its reported date.</li>\n</ul>", "a": "", "owner": "Unassigned", "why": "", "last": {}}, {"g": "New tickets, 191 and up", "n": "#201", "t": "One new incident form for all five subjects, with the fields driven by the subject", "st": "Product Item", "kind": "New", "changed": "New this weekend. Consolidates the form, the field map, the people rules and the affected asset into one item.", "sum": "Filing starts by choosing what the incident is about, and that choice determines everything after it. One form serves all five subjects rather than five forms, because the differences between them are a handful of fields, not a different process.", "body": "<p>Filing starts by choosing what the incident is about, and that choice determines everything after it. One form serves all five subjects rather than five forms, because the differences between them are a handful of fields, not a different process.</p>\n<p>Subject first. Student, Vehicle, Location, Third Party, Employee, all five shown together with a one line description each so the whole choice is visible without scrolling. Nothing else is asked until the subject is chosen.</p>\n<p>Two steps for every subject. Incident Details, then Review and Submit. A subject with no people to name does not get a shorter or different path, it gets the same two steps with fewer fields.</p>\n<p>Seventeen fields on Incident Details, twelve of them the same for every subject: incident type, severity, description, date, time, location type, the location pin, witnesses, third parties, tags, photo evidence, document evidence.</p>\n<p>Five vary, and they are governed by one field map rather than by five screens:</p>\n<ul>\n<li>People roster, on Student, Employee and Third Party.</li>\n<li>Affected asset, on Vehicle and Location.</li>\n<li>Vehicle Number, absent on Vehicle because the affected asset already names the bus, and absent on Location.</li>\n<li>Driver, absent on Location.</li>\n<li>Run, absent on Vehicle since nobody is aboard, and absent on Location.</li>\n</ul>\n<p>The per-subject difference is therefore Student 4, Employee 4, Third Party 4, Vehicle 2, Location 1. That is what makes this one form with a map and not a redesign of five screens.</p>\n<p>Rules that hold across all five.</p>\n<ul>\n<li>A field never changes position between subjects, so incident type sits in the same place every time.</li>\n<li>A field the subject does not need is not rendered, and the fields after it close up. Nothing shows as a disabled or empty control.</li>\n<li>The roster is labeled by subject: Involved Students, Involved Employees, Involved People.</li>\n<li>The incident type list offers only the types belonging to the chosen subject.</li>\n<li>Severity fills in from the incident type&#x27;s default and stays overridable.</li>\n<li>Changing the subject mid-report clears only the subject-specific answers, being incident type, people and affected asset, and keeps date, time, description, location and evidence. The reporter is warned before it happens, so switching is never a silent loss of typed work.</li>\n<li>The form opens identically from the dashboard and from the incidents list.</li>\n</ul>\n<p>People.</p>\n<p>People named on an incident carry a role of Participant, Witness, Reporter or Injured, their own severity, the action taken, and notes. Per-person detail expands from the person&#x27;s row rather than living on a separate step.</p>\n<p>People who are present but are not the subject, meaning witnesses and third parties on any subject, carry a name, a phone, an email and a description. Not all of them can be named. Someone loitering at a stop, or a motorist who drove off, has to be filable. A contact is therefore kept when it has either a name or a description, and dropped only when both are empty. A name stays required where it is the subject of the incident: a student, an employee, or a named third party.</p>\n<p>The affected asset is a reference, not typed text.</p>\n<p>On a Vehicle or Location incident the asset is required, because with no people named it is the only thing identifying the record. It is stored as a reference to the vehicle or location record so the incident can be counted against that record and opened from it, rather than as a name that has to be matched later.</p>", "ac": "<ul>\n<li>The form asks for the subject before any other field, and all five choices are visible at once.</li>\n<li>Every subject shows the same two steps.</li>\n<li>On a Location incident, Vehicle Number, Driver and Run are absent, not empty, and the affected location is required.</li>\n<li>On a Vehicle incident, Vehicle Number and Run are absent and the affected vehicle is required.</li>\n<li>Incident type appears in the same position on all five subjects.</li>\n<li>The incident type list on a Vehicle incident offers only vehicle types.</li>\n<li>Choosing an incident type fills in severity, and severity can still be changed.</li>\n<li>The roster heading reads Involved Students, Involved Employees or Involved People according to subject.</li>\n<li>Switching subject after filling the form warns first, then clears type, people and asset while keeping date, time, description, location and evidence.</li>\n<li>A witness with a description and no name is saved and appears on the record.</li>\n<li>A contact with neither a name nor a description is dropped.</li>\n<li>A student, employee or named third party cannot be added to the roster without a name.</li>\n<li>The affected asset on a saved incident resolves to the vehicle or location record, and that record&#x27;s incident count includes this incident.</li>\n<li>The form opens the same way from the dashboard and from the incidents list.</li>\n</ul>", "a": "", "owner": "Unassigned", "why": "", "last": {}}, {"g": "New tickets, 191 and up", "n": "#202", "t": "The 20 incident types and the 12 workflows that route them", "st": "Product Item", "kind": "New", "changed": "New this weekend. Carries the full type and workflow inventory.", "sum": "Each subject needs its own incident types, and each type needs a workflow to run when an incident is filed against it. The two belong together because a workflow is selected by incident type plus severity, so a type without a workflow files an incident that nothing picks up.", "body": "<p>Each subject needs its own incident types, and each type needs a workflow to run when an incident is filed against it. The two belong together because a workflow is selected by incident type plus severity, so a type without a workflow files an incident that nothing picks up.</p>\n<p>The 20 types, by subject.</p>\n<p>The list offered on the form is filtered to the chosen subject, and Applies To is a column in Admin so the subject of every type is visible and editable. Each type carries a default severity that fills in on the form and stays overridable.</p>\n<p>Student, 6</p>\n<ul>\n<li>Disruptive Behavior, Behavioral, Low</li>\n<li>Safety Violation, Safety, Medium</li>\n<li>Physical Altercation, Aggression / Violence, High</li>\n<li>Property Damage, Property, Medium</li>\n<li>Weapon / Prohibited Items, Prohibited, Critical</li>\n<li>Witness / Bystander Statement, Informational, Low</li>\n</ul>\n<p>Employee, 4</p>\n<ul>\n<li>Employee Altercation, Employee Conduct, High</li>\n<li>Employee Misconduct, Employee Conduct, Medium</li>\n<li>Employee Injury, Safety, High</li>\n<li>Employee Substance Violation, Prohibited, Critical</li>\n</ul>\n<p>Third Party, 4</p>\n<ul>\n<li>Third Party Collision, Collision, High</li>\n<li>Third Party Injury, Safety, High</li>\n<li>Third Party Conduct, Aggression / Violence, High</li>\n<li>Public Complaint, Informational, Low</li>\n</ul>\n<p>Vehicle, 3</p>\n<ul>\n<li>Vehicle Damage, Mechanical, Medium</li>\n<li>Mechanical Failure, Mechanical, Medium</li>\n<li>Single Vehicle Collision, Collision, Medium</li>\n</ul>\n<p>Location, 3</p>\n<ul>\n<li>Location Damage, Location, Medium</li>\n<li>Utility Failure, Location, Medium</li>\n<li>Location Safety Hazard, Location, High</li>\n</ul>\n<p>Ten categories, and why they are drawn this way.</p>\n<p>Behavioral, Safety, Aggression / Violence, Property, Prohibited, Informational, Employee Conduct, Location, Mechanical, Collision.</p>\n<p>Category describes what happened, not who it happened to, because category is what the list filters on and what reports group by. The subject already carries who. Three consequences worth stating, since they look inconsistent until the reason is visible:</p>\n<ul>\n<li>Employee Injury sits under Safety rather than Employee Conduct, so a workplace injury does not appear in a conduct report pulled about that person.</li>\n<li>Employee Substance Violation sits under Prohibited alongside Weapon / Prohibited Items, so a district asking how many substance incidents it had gets one number instead of two split by whether a student or an employee was involved.</li>\n<li>Public Complaint sits under Informational, which keeps a parent phoning in a complaint out of the collision count that goes to leadership and insurance.</li>\n</ul>\n<p>The 12 workflows.</p>\n<p>Every one of the 20 types is covered by exactly one workflow. Selection is by incident type plus severity. Forty-six steps in total.</p>\n<ul>\n<li>WF-001 Disruptive Behavior Response, owner School Principal, 3 steps, Disruptive Behavior at Low</li>\n<li>WF-002 Physical Altercation Response, owner School Principal, 5 steps, Physical Altercation at High</li>\n<li>WF-003 Prohibited Items Response, owner Administrator, 5 steps, Weapon / Prohibited Items at Critical</li>\n<li>WF-004 Property Damage Investigation, owner Administrator, 6 steps, Property Damage at Medium</li>\n<li>WF-005 Safety Violation Response, owner Safety Coordinator, 5 steps, Safety Violation at Medium</li>\n<li>WF-006 Witness / Bystander Statement, owner Safety Coordinator, 1 step, Witness / Bystander Statement at Low</li>\n<li>WF-007 Employee Conduct Review, owner Administrator, 4 steps, Employee Altercation, Employee Misconduct and Employee Substance Violation at Critical, High or Medium</li>\n<li>WF-008 Employee Injury Report, owner Administrator, 3 steps, Employee Injury at Critical, High or Medium</li>\n<li>WF-009 Location Issue Response, owner Administrator, 4 steps, Location Damage, Utility Failure and Location Safety Hazard at any severity</li>\n<li>WF-010 Vehicle Damage and Mechanical Response, owner Fleet Manager, 4 steps, Vehicle Damage, Mechanical Failure and Single Vehicle Collision at any severity</li>\n<li>WF-011 Third Party Incident Response, owner Safety Coordinator, 4 steps, Third Party Collision, Third Party Injury and Third Party Conduct at Critical, High or Medium</li>\n<li>WF-012 Public Complaint Review, owner Safety Coordinator, 2 steps, Public Complaint at Low or Medium</li>\n</ul>\n<p>Routing differs by subject on purpose. Employee and location incidents go to an Administrator rather than a school principal, vehicle incidents to a Fleet Manager, third party incidents to a Safety Coordinator. Every step assigns to one of the five incident roles provisioned by #188, being Administrator, Safety Coordinator, Driver, Fleet Manager and School Principal, so no new roles are needed.</p>\n<p>Each workflow names a required owner role, which is what gives a filed incident an assignee. The mechanics of assignment and routing are covered by Incident assignment and routing (#197); this ticket covers the type and workflow definitions those mechanics run against.</p>", "ac": "<ul>\n<li>All 20 types exist, each with the category and default severity listed above.</li>\n<li>The type list on the form shows only the types belonging to the chosen subject, verified on all five.</li>\n<li>Admin shows Applies To per type and allows it to be changed.</li>\n<li>Choosing a type fills in its default severity, and the severity remains editable.</li>\n<li>All 12 workflows exist with the owner role and step count listed above.</li>\n<li>Filing an incident on any of the 20 types selects a workflow, with none left unmatched.</li>\n<li>An Employee Injury at High selects WF-008 and not WF-007.</li>\n<li>A Public Complaint selects WF-012 rather than a collision workflow.</li>\n<li>Every step in every workflow assigns to one of the five incident roles.</li>\n<li>A report grouped by category places Employee Injury under Safety and Public Complaint under Informational.</li>\n</ul>", "a": "Remove the seeded group names. Say a role holding a given permission, because a district can rename or delete any group after day one.", "owner": "Unassigned", "why": "", "last": {}}, {"g": "New tickets, 191 and up", "n": "#203", "t": "Subject and status carried through the list, the record, communications and reports", "st": "Product Item", "kind": "New", "changed": "New this weekend.", "sum": "Once an incident can be about a vehicle or a depot, every screen that assumed a student has to say what the incident is actually about. Otherwise a list of incidents shows blank cells where the student would have been, and a report row for a burst pipe names nobody.", "body": "<p>Once an incident can be about a vehicle or a depot, every screen that assumed a student has to say what the incident is actually about. Otherwise a list of incidents shows blank cells where the student would have been, and a report row for a burst pipe names nobody.</p>\n<p>The incidents list.</p>\n<ul>\n<li>An Involved column replaces the Student column, naming whoever or whatever the incident is about: the student, the employee, the third party, the bus, or the location.</li>\n<li>Subject is a column, sortable and filterable, showing which of the five the incident is.</li>\n<li>Status is a column, showing the incident&#x27;s current status.</li>\n<li>Every column header carries a filter that applies as it is typed or chosen.</li>\n</ul>\n<p>The Subject filter is the gap left when Incidents: Filters Card (#114) closed, and several subject based acceptance criteria depend on it.</p>\n<p>The incident record.</p>\n<p>The record shows every field the form collected, and shows nothing the subject does not use. On the Overview: Subject, Type, Occurred date and time, Location, Severity, Status, Assigned To, and Description, plus Vehicle, Driver and Run where the subject uses them.</p>\n<ul>\n<li>For Student, Employee and Third Party incidents, an Involved Parties section lists the people named, each with their role, severity, action taken and notes.</li>\n<li>For Vehicle and Location incidents, an Affected Vehicle or Affected Location card takes the place of the roster, since the asset is what identifies the record.</li>\n<li>A field the subject does not use is absent, not shown empty.</li>\n<li>Photos and Documents each carry a count, so a reader can see there is evidence without opening the tab.</li>\n</ul>\n<p>Status is a value on the record.</p>\n<p>An incident carries a status of Open, In Progress, Closed or Cancelled. It is a property of the incident, shown on the record and on the grids, not a display-only derivation. Changing it is recorded in the incident&#x27;s history with who changed it and when.</p>\n<p>Communications.</p>\n<p>The other party on a conversation is derived from the incident rather than assumed to be a student&#x27;s driver, so an employee incident does not open a thread addressed to a parent. A Subject filter is available on the conversation list.</p>\n<p>Reports.</p>\n<p>The exported record set uses the same Involved column as the incidents list, so a row for a location or vehicle incident names the depot or the bus rather than leaving the student column empty.</p>", "ac": "<ul>\n<li>The incidents list shows Involved, Subject and Status columns, and Involved is populated for all five subjects.</li>\n<li>Sorting by Subject groups the five subjects.</li>\n<li>Filtering by Subject to Vehicle returns only vehicle incidents.</li>\n<li>Filtering by Status to Open excludes closed and cancelled incidents.</li>\n<li>Opening a Location incident shows the affected location and no Vehicle Number, Driver or Run fields.</li>\n<li>Opening an Employee incident shows the involved people with their roles and no affected asset card.</li>\n<li>Photos and Documents tabs show a count that matches what is attached, including zero.</li>\n<li>Changing an incident&#x27;s status writes an entry in its history naming the user and the time.</li>\n<li>A conversation on an employee incident shows the employee side of the exchange rather than a parent or student.</li>\n<li>Filtering conversations by Subject returns only conversations on incidents of that subject.</li>\n<li>An export containing a mix of subjects has no empty cells in the Involved column.</li>\n</ul>", "a": "", "owner": "Unassigned", "why": "", "last": {}}, {"g": "New tickets, 191 and up", "n": "#204", "t": "Hand the Help page copy to development as source files", "st": "Product Item", "kind": "New", "changed": "New this weekend. Destination changed this morning to DocuSource.", "sum": "The Help page is product copy, not code: three tabs holding Getting Started, an eleven section user guide, and twenty one FAQ entries. Development should not have to transcribe it out of a prototype or a screenshot, and product should be able to correct a sentence without touching a component.", "body": "<p>The Help page is product copy, not code: three tabs holding Getting Started, an eleven section user guide, and twenty one FAQ entries. Development should not have to transcribe it out of a prototype or a screenshot, and product should be able to correct a sentence without touching a component.</p>\n<p>The copy lives in three markdown files checked into the repository beside the Help component, one per tab.</p>\n<ul>\n<li><code>getting-started.md</code>, holding the overview, the navigation description, the five incident roles, and the feature cards.</li>\n<li><code>user-guide.md</code>, one heading per section, in the order the accordion shows them: Dashboard, Incident Management, Workflow System, Students, Communications, Vehicles, Employees, Locations, Reports, Admin, Notifications.</li>\n<li><code>faq.md</code>, a flat list where each entry is a heading for the question and the text below it for the answer.</li>\n</ul>\n<p>Three files rather than one, because each maps to a tab, so a change to the FAQ cannot disturb the guide. A flat FAQ rather than a nested structure, because adding a question should be adding a heading and a paragraph with no layout to edit. Headings carry the section order, and the component renders headings into accordion items, so the copy holds no markup that implies a layout.</p>\n<p>Ownership.</p>\n<p>Product owns the wording in these files. Development owns how they render. A wording change arrives as an edit to the file, not as a ticket describing the sentence.</p>\n<p>What the copy currently says.</p>\n<p>Stated so it is clear what is being handed over: the five subjects and that the subject is chosen first, the two step form, the 20 incident types with their categories, the 12 workflows and the required Incident Owner, the difference between the incident date and the reported date, how the term is derived and that nothing is filtered by term, the twelve location types, the per-column filters and pagination on every grid, and the five incident roles.</p>\n<p>It also states plainly that one incident record is created and each person named on it carries their own workflow, which had been described the other way round.</p>", "ac": "<ul>\n<li>Three markdown files exist in the repository, one per Help tab.</li>\n<li>The Help page renders from those files, and no Help copy is hardcoded in the component.</li>\n<li>Every heading in <code>user-guide.md</code> appears as a section in the guide, in file order.</li>\n<li>Every question in <code>faq.md</code> appears in the FAQ, in file order.</li>\n<li>Editing a sentence in a file and rebuilding changes the rendered page with no component edit.</li>\n<li>Adding a question to <code>faq.md</code> adds it to the page with no component edit.</li>\n<li>The rendered Help page describes the five subjects, the two step form, the 20 types, the 12 workflows and the five incident roles, and does not describe a four step wizard, a linked record per student, or seven roles.</li>\n</ul>", "a": "Rewrite around DocuSource as the destination rather than markdown files checked in beside the component.", "owner": "Unassigned", "why": "", "last": {}}, {"g": "New tickets, 191 and up", "n": "#206", "t": "What notifications the module sends, and what each one says", "st": "Product Item", "kind": "New", "changed": "New this weekend. Channel changed this morning: in-app rather than email.", "sum": "Sending works and the step configuration already offers the switches, but nothing states which notifications go out, to whom, or what they say. That gap is why the current mails are generic, and it needs to be written down before the templates get invented one at a time.", "body": "<p>Sending works and the step configuration already offers the switches, but nothing states which notifications go out, to whom, or what they say. That gap is why the current mails are generic, and it needs to be written down before the templates get invented one at a time.</p>\n<p>What triggers a notification. Each is configured per workflow step, so a district turns on what it wants and nothing fires by default.</p>\n<ul>\n<li>The step starts.</li>\n<li>The step completes.</li>\n<li>The step&#x27;s assignee is notified that it is theirs.</li>\n<li>Approvers are notified that a step is waiting on them.</li>\n<li>Named groups are notified.</li>\n</ul>\n<p>Who receives it. The step&#x27;s assigned role resolves to the people holding that role, plus any approver roles selected on the step, plus any address typed into the step&#x27;s recipient list. A role with nobody in it sends nothing rather than failing.</p>\n<p>There is no variable substitution. The copy below is fixed text, with nothing pulled from the incident, so every mail is a prompt to go and look rather than a carrier of detail.</p>\n<p>Action Required, sent to the people holding the step&#x27;s role.</p>\n<blockquote>Subject: Action required in the Incident Tracker</blockquote>\n<blockquote></blockquote>\n<blockquote>A workflow step in the Incident Tracker is assigned to your role and needs attention.</blockquote>\n<blockquote></blockquote>\n<blockquote>Sign in to Incidents and open your assigned incidents to see what is waiting.</blockquote>\n<p>Approval Request, sent to the approver roles selected on the step.</p>\n<blockquote>Subject: Approval needed in the Incident Tracker</blockquote>\n<blockquote></blockquote>\n<blockquote>A workflow step in the Incident Tracker is waiting for your approval.</blockquote>\n<blockquote></blockquote>\n<blockquote>Sign in to Incidents and open your assigned incidents to approve the step or send it back for revision.</blockquote>\n<p>Parent or Guardian Notification, sent to the guardians of a student named on the incident.</p>\n<blockquote>Subject: Transportation incident involving your student</blockquote>\n<blockquote></blockquote>\n<blockquote>Your student was involved in an incident.</blockquote>\n<blockquote></blockquote>\n<blockquote>Someone from the transportation team will contact you to go through what happened. If you would like to reach us first, please call the transportation office.</blockquote>\n<blockquote></blockquote>\n<blockquote>This message does not include details, because they are better discussed directly.</blockquote>\n<p>The parent mail carries no student name, no date, no time, no incident type and no severity, and that is the right call twice over. Mail is not a private channel and often lands on a shared account, so specifics belong in the conversation that follows. It also avoids stating a time the module frequently does not have.</p>\n<p>The limitation worth being honest about: with no substitution, a coordinator holding three open steps receives three identical mails and cannot tell them apart without signing in. That is tolerable at low volume and it is the reason the incident identifier is the first variable worth adding when substitution arrives.</p>\n<p>Parent or Guardian Notification only applies where a student is involved. An Employee, Vehicle, Location or Third Party incident never sends it, whatever a step is configured to do, because there is no guardian to address and a district cannot afford that mail going out about a driver.</p>\n<p>Wording per incident type comes later. A step on a weapon incident and a step on a disruptive behavior incident send the same Action Required mail, which is acceptable because the reader opens the incident to act anyway.</p>", "ac": "<ul>\n<li>Each of the five triggers can be turned on and off per step, and is off by default.</li>\n<li>Turning on a trigger sends to the resolved role holders, the selected approver roles, and any typed addresses.</li>\n<li>A role with no holders produces no mail and no error.</li>\n<li>Each of the three templates sends exactly the copy above, with no placeholder text left visible in the subject or the body.</li>\n<li>The parent mail contains no student name, no date, no time, no incident type and no severity.</li>\n<li>Selecting Parent or Guardian Notification on a step of a non-student incident sends nothing.</li>\n<li>A step with no notification configured sends nothing when it starts or completes.</li>\n<li>A sending failure is visible somewhere a coordinator can see that the mail did not go.</li>\n</ul>", "a": "Rewrite around in-app notifications in the Student Transportation bell icon. Justin has already added code so Incidents can filter its own notifications there.", "owner": "Unassigned", "why": "", "last": {}}, {"g": "New tickets, 191 and up", "n": "#208", "t": "Feature flag set for the Incidents pages", "st": "Product Item", "kind": "New", "changed": "New this weekend. Approach changed this morning: the flag goes on each issue instead.", "sum": "Twelve flags, one per page, so a page can be turned on for a site or pulled back without touching the rest of the module.", "body": "<p>Twelve flags, one per page, so a page can be turned on for a site or pulled back without touching the rest of the module.</p>\n<ul>\n<li><code>incidents_dashboard_page</code></li>\n<li><code>incidents_list_page</code></li>\n<li><code>incidents_detail_page</code></li>\n<li><code>incidents_students_page</code></li>\n<li><code>incidents_employees_page</code></li>\n<li><code>incidents_vehicles_page</code></li>\n<li><code>incidents_locations_page</code></li>\n<li><code>incidents_communications_page</code></li>\n<li><code>incidents_reports_page</code></li>\n<li><code>incidents_workflows_page</code></li>\n<li><code>incidents_admin_page</code></li>\n<li><code>incidents_help_page</code></li>\n</ul>\n<p>What a page flag does. Hides the navigation entry and refuses the direct URL, returning the user somewhere sensible rather than a blank page or an error, because anyone holding the link reaches the page otherwise. It also stops the page issuing requests, so a disabled page costs nothing.</p>\n<p>Every flag defaults off. Targeting is by site, so a district is wholly on or wholly off for a given page, with no partial state inside the district.</p>\n<p>The supported states are all off, all on, and pages enabled one at a time. Two combinations are prevented rather than left to chance: the detail page enabled while the list page is off, which leaves records nobody can navigate to, and the employees or locations page enabled before the subject work is on, which leaves a page with nothing to list.</p>", "ac": "<ul>\n<li>Each of the twelve flags exists with the name above and defaults off.</li>\n<li>With a page flag off, the navigation entry is absent and the direct URL does not render the page.</li>\n<li>With a page flag off, the page issues none of the requests it would normally make.</li>\n<li>Turning a flag on for one site leaves every other site unchanged.</li>\n<li>The detail page enabled with the list page disabled is prevented.</li>\n<li>The employees and locations pages cannot be enabled before the subject work.</li>\n<li>Turning every flag on produces the same application as running with no flags.</li>\n</ul>", "a": "Dissolve into a flag noted on each issue, granular by major feature function, with dependencies considered so turning one off does not leave the application unusable.", "owner": "Gabe Guzman", "why": "", "last": {}}, {"g": "What is left to work on", "n": "Term association", "t": "How an incident gets its term", "st": "Decision", "kind": "Decision", "changed": "", "sum": "The room did not accept term derived from the incident date. It comes from the signed-in user's default term in their Student Transportation profile, and the incident is associated to it.", "body": "<p>A driver never picks it. Student Transportation has a term that overarches the system, while MyRide and Tyler Drive each carry their own external term schedules, so the one that matters here is the user&#x27;s profile term.</p>\n<ul>\n<li>Sized at less than a day.</li>\n<li>#199 has to be rewritten.</li>\n<li>#77 says the incidents grid shows the default term only, which conflicts.</li>\n</ul>", "ac": "", "a": "", "owner": "", "why": "", "last": {}}, {"g": "What is left to work on", "n": "Notification channel", "t": "In-app, not email", "st": "Decision", "kind": "Decision", "changed": "", "sum": "Notifications land in the Student Transportation bell icon rather than going out as email or SMS.", "body": "<p>Code already exists so Incidents can filter its own notifications in that center.</p>\n<ul>\n<li>#206 is written around email templates and needs rewriting.</li>\n<li>#95 still covers the email template admin surface.</li>\n<li>#84 is the bell icon work itself.</li>\n<li>#100 needs reconciling against whatever remains.</li>\n</ul>", "ac": "", "a": "", "owner": "", "why": "", "last": {}}, {"g": "What is left to work on", "n": "Help destination", "t": "DocuSource", "st": "Decision", "kind": "Decision", "changed": "", "sum": "The Help content and user guide move to DocuSource rather than markdown files checked in beside the component.", "body": "<p>The copy itself is already written and live in the preview, so only the destination changes.</p>\n<ul>\n<li>11 guide sections and 21 FAQ entries.</li>\n<li>#204 needs rewriting around DocuSource.</li>\n<li>No content is lost, it moves.</li>\n</ul>", "ac": "", "a": "", "owner": "", "why": "", "last": {}}, {"g": "What is left to work on", "n": "Feature flags", "t": "One flag per issue, not one issue for flags", "st": "Decision", "kind": "Decision", "changed": "", "sum": "The flag belongs on each issue rather than a single issue listing all of them, matching how the mobile team works.", "body": "<p>Granular by major feature function, with everything flagged, and dependencies considered so turning one off does not leave the application unusable.</p>\n<ul>\n<li>#208 dissolves into per issue flags.</li>\n<li>Not every checkbox or label.</li>\n<li>Which items need one gets decided as the list is reviewed.</li>\n</ul>", "ac": "", "a": "", "owner": "", "why": "", "last": {}}, {"g": "What is left to work on", "n": "Role names", "t": "Stop naming seeded groups in tickets", "st": "Decision", "kind": "Decision", "changed": "", "sum": "A district can rename or delete any seeded group after day one, so naming one in a requirement misleads dev and QA.", "body": "<p>Write a role holding a given permission instead.</p>\n<ul>\n<li>Changes #202, #193 and #197.</li>\n<li>Seeded names are examples, never guarantees.</li>\n<li>Applies to everything written from here.</li>\n</ul>", "ac": "", "a": "", "owner": "", "why": "", "last": {}}, {"g": "What is left to work on", "n": "MDM", "t": "One item, not several", "st": "Decision", "kind": "Decision", "changed": "", "sum": "MDM should be a single epic with children rather than separate tickets pointing at each other.", "body": "<p>#108 and #198 collapse together.</p>\n<ul>\n<li>Children for the UI, the menu, and segment selection behaviour.</li>\n<li>Scoping lives here too.</li>\n<li>A draft answering the school scoping question is written and unposted.</li>\n</ul>", "ac": "", "a": "", "owner": "", "why": "", "last": {}}, {"g": "What is left to work on", "n": "Audit", "t": "Bulk dump day one, log only", "st": "Decision", "kind": "Decision", "changed": "", "sum": "Day one is the ability to pull every audit record related to incidents in one shot.", "body": "<p>No per-record retrieval UI, which comes later as a feature. Audit logging already works locally.</p>\n<ul>\n<li>#97 owns it.</li>\n<li>The event list is already a comment there.</li>\n<li>#73 shipped the History tab and is closed.</li>\n</ul>", "ac": "", "a": "", "owner": "", "why": "", "last": {}}, {"g": "What is left to work on", "n": "Rejection", "t": "Parked pending the customer", "st": "Decision", "kind": "Decision", "changed": "", "sum": "Whether a workflow step can be rejected depends on what a rejection means to Cypress-Fairbanks.", "body": "<p>Capture the question, ask it, and if they do not reject anything then #195 scopes out entirely.</p>\n<ul>\n<li>#195 holds the requirement.</li>\n<li>Cancelled is the only exit today.</li>\n<li>Rejecting would return the step to in progress and notify the assignee.</li>\n</ul>", "ac": "", "a": "", "owner": "", "why": "", "last": {}}, {"g": "What is left to work on", "n": "Filing rights", "t": "Can anyone file against an employee", "st": "Decision", "kind": "Decision", "changed": "", "sum": "Nothing states whether filing is open to any employee or restricted by permission.", "body": "<p>It changes the subject chooser, since a user who cannot file against a subject should not be offered it.</p>\n<ul>\n<li>Affects #201 and #193.</li>\n<li>Permissions granularity is still open.</li>\n<li>Also a question for Cypress-Fairbanks.</li>\n</ul>", "ac": ""
