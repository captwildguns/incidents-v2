, "a": "", "owner": "", "why": "", "last": {}}, {"g": "What is left to work on", "n": "Tyler Drive", "t": "Book an hour with Mark", "st": "Decision", "kind": "Decision", "changed": "", "sum": "Tyler Drive form support needs a session on how incidents work there today and what is needed.", "body": "<p>Then an issue gets written from it. A district&#x27;s actual templates are also being sent over.</p>\n<ul>\n<li>#192 covers accepting a submission.</li>\n<li>The form builder inside Incidents is the unstarted half.</li>\n<li>Priority two, behind subjects.</li>\n</ul>", "ac": "", "a": "", "owner": "", "why": "", "last": {}}, {"g": "What is left to work on", "n": "Labels", "t": "Alignment with Student Transportation", "st": "Decision", "kind": "Decision", "changed": "", "sum": "Agreed on Aug 10 that Incidents adopts the Student Transportation label wherever a field is shared, and none of it is ticketed.", "body": "<p>Capacity becomes Maximum Capacity, Current Mileage becomes Odometer, Assigned Driver becomes Default Driver, Contractor Name is surfaced read only for display and filtering, and the vehicle panel is titled by Vehicle Number rather than the internal record id.</p>\n<ul>\n<li>No ticket anywhere.</li>\n<li>#133 is the natural home.</li>\n<li>Small individually, easy to lose entirely.</li>\n</ul>", "ac": "", "a": "", "owner": "", "why": "", "last": {}}, {"g": "What is left to work on", "n": "Timeline", "t": "The date against the grown scope", "st": "Decision", "kind": "Decision", "changed": "", "sum": "Subjects are priority one and Tyler Drive form support is priority two, and doing both by November was called very difficult.", "body": "<p>The purpose of this afternoon is to size what is left and set a realistic date rather than hold the date and cut quality.</p>\n<ul>\n<li>Estimates come out of this afternoon.</li>\n<li>Business updates are owed tomorrow.</li>\n<li>QA effort is unsized on several items.</li>\n</ul>", "ac": "", "a": "", "owner": "", "why": "", "last": {}}];
const groups = ["Start here", "Open tickets, before 191", "New tickets, 191 and up", "What is left to work on"];
const nav = document.getElementById('nav'), pane = document.getElementById('pane');
groups.forEach(g => {
  const list = items.map((it, i) => ({it, i})).filter(x => x.it.g === g);
  if (!list.length) return;
  const h = document.createElement('div');
  h.className = 'func';
  h.textContent = g + (list.length > 1 ? '  (' + list.length + ')' : '');
  nav.appendChild(h);
  list.forEach(({it, i}) => {
    const b = document.createElement('button');
    b.className = 'ptab'; b.dataset.i = i;
    b.innerHTML = '<span class="dot' + (it.a ? ' need' : '') + '"></span>' +
                  '<span class="num">' + it.n + '</span><span>' + it.t + '</span>';
    b.onclick = () => show(i);
    nav.appendChild(b);
  });
});
function show(i){
  const it = items[i];
  document.querySelectorAll('.ptab').forEach(t => t.classList.toggle('on', t.dataset.i == i));
  const isTicket = it.n.charAt(0) === '#';
  const link = isTicket
    ? '<a href="https://github.com/tyler-technologies/transportation-incidents/issues/' +
      it.n.slice(1) + '" target="_blank">' + it.n + ' on GitHub</a>'
    : '';
  const warn = (it.st === 'No status' || it.st === 'Decision') ? ' warn' : '';
  const kind = it.kind && it.kind !== 'Existing'
    ? '<span class="pill new">' + it.kind + '</span>' : '';
  pane.innerHTML =
    '<p class="eyebrow">' + it.g + '</p>' +
    '<h2>' + it.t + '<span class="pill' + warn + '">' + it.st + '</span>' + kind + '</h2>' +
    (link ? '<p class="meta">' + link + '</p>' : '') +
    '<p class="lbl">In one line</p><p>' + it.sum + '</p>' +
    (it.why ? '<div class="open"><p class="lbl">Owner and why it is still open</p>' +
      '<p><span class="who">' + it.owner + '</span></p><p>' + it.why + '</p>' +
      (it.last && it.last.txt ? '<p class="quote">Last word, ' + it.last.who + ' on ' + it.last.when + ': ' + it.last.txt + '</p>' : '') +
      '</div>' : '') +
    (it.changed ? '<div class="chg"><p class="lbl">What changed</p><p>' + it.changed + '</p></div>' : '') +
    '<p class="lbl">The ticket as written</p><div class="body">' + it.body + '</div>' +
    (it.ac ? '<p class="lbl">Acceptance criteria, what QA tests</p><div class="ac">' + it.ac + '</div>' : '') +
    (it.a ? '<div class="ask"><p class="lbl">What is needed</p><p>' + it.a + '</p></div>' : '');
  window.scrollTo(0, 0);
}
show(0);
</script>
