<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Incidents review, Aug 25</title>
<style>
:root{--blue:#4A6FA5;--deep:#35507A;--olive:#7B8458;--amber:#9A6B12;
--panel:#F4F6F9;--line:#dfe4ea;--ink:#22282f;--soft:#6b7683;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px;
color:var(--ink);background:var(--panel);-webkit-font-smoothing:antialiased}
.wrap{display:flex;min-height:100vh;align-items:stretch}
.side{width:360px;flex:0 0 360px;background:var(--white);border-right:1px solid var(--line);
padding:18px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side h1{font-size:15px;font-weight:500;margin:0 20px 3px;color:var(--deep)}
.side .sub{font-size:11.5px;color:var(--soft);margin:0 20px 14px}
.func{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
color:var(--soft);margin:16px 20px 5px}
.ptab{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;
border-left:3px solid transparent;padding:6px 16px 6px 17px;cursor:pointer;font:inherit;
color:var(--ink);line-height:1.35;font-size:13px}
.ptab:hover{background:var(--panel)}
.ptab.on{background:#EEF4FB;border-left-color:var(--blue);color:var(--deep);font-weight:500}
.ptab .num{color:var(--soft);flex:0 0 44px;font-size:12px}
.ptab.on .num{color:var(--blue)}
.dot{flex:0 0 6px;height:6px;border-radius:50%;background:transparent;margin-top:6px}
.dot.need{background:var(--amber)}
.main{flex:1;padding:30px 46px 70px;max-width:900px;min-width:0}
.main .eyebrow{font-size:10.5px;font-weight:700;text-transform:uppercase;
letter-spacing:.09em;color:var(--olive);margin:0 0 6px}
.main h2{font-size:23px;font-weight:500;color:var(--deep);margin:0 0 6px;line-height:1.25}
.meta{font-size:12.5px;color:var(--soft);margin:0 0 4px}
.meta a{color:var(--blue);text-decoration:none}
.meta a:hover{text-decoration:underline}
.lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
color:var(--soft);margin:24px 0 7px}
.main p{margin:0 0 10px;line-height:1.62}
.main ul,.main ol{margin:2px 0 12px;padding-left:20px}
.main li{margin:0 0 6px;line-height:1.55}
.main h4{font-size:13.5px;font-weight:700;color:var(--deep);margin:18px 0 6px}
.main code{background:#eef1f5;padding:1px 5px;border-radius:3px;font-size:12.5px}
.main img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:4px;margin:6px 0 12px}
.main blockquote{margin:0 0 10px;padding:8px 14px;background:var(--white);
border-left:3px solid var(--line);border-radius:3px}
.pill{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:10px;
background:#EEF4FB;color:var(--deep);border:1px solid #d6e3f3;margin-left:7px;vertical-align:3px}
.pill.warn{background:#FDF3E7;color:var(--amber);border-color:#f0dcc0}
.pill.new{background:#EFF3E9;color:var(--olive);border-color:#dbe3cd}
.body{background:var(--white);border:1px solid var(--line);border-radius:4px;padding:18px 20px 8px}
.ac{background:#EEF4FB;border:1px solid #d6e3f3;border-radius:4px;padding:16px 20px 6px}
.ac .lbl{margin:0 0 6px;color:var(--deep)}
.open{background:var(--white);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:4px;padding:13px 16px;margin:0 0 4px}
.open .lbl{margin:0 0 5px;color:var(--blue)}
.open p{margin:0 0 6px}
.open .who{font-weight:500;color:var(--deep)}
.open .quote{font-size:13px;color:var(--soft);border-left:2px solid var(--line);padding-left:10px;margin:8px 0 0}
.chg{background:var(--white);border:1px solid var(--line);border-left:3px solid var(--olive);
border-radius:4px;padding:13px 16px;margin:0 0 4px}
.chg .lbl{margin:0 0 5px;color:var(--olive)}
.chg p{margin:0}
.ask{margin:26px 0 0;padding:15px 17px;background:#FDF3E7;border:1px solid #f0dcc0;
border-left:3px solid var(--amber);border-radius:4px}
.ask .lbl{margin:0 0 6px;color:var(--amber)}
.ask p{margin:0;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <nav class="side">
    <h1>Incidents review</h1>
    <p class="sub">Answers needed, then existing tickets, then new ones</p>
    <div id="nav"></div>
  </nav>
  <main class="main" id="pane"></main>
</div>
<script>
const items = [{"g": "Existing tickets, detail added", "n": "#70", "t": "Dashboard: Populate Live Data for Tiles & Graphs", "st": "Open", "kind": "Existing", "owner": "Justin Smith, opened by Justin Smith", "closes": "Posted. Detail added, nothing of ours closed into it.", "adds": "<ul>\n<li>Four charts. Incidents by Subject, Incidents by Type, Incidents by Driver, and Incidents by Day. No Incidents by Vehicle chart. Per bus counts live on the Vehicles page, where each row carries its own count and links through to those incidents.</li>\n<li>Four KPIs on one row. Critical Incidents, Open Incidents, Students with Incidents, and Incidents This Week.</li>\n<li>The active incidents table uses the same columns as the incidents list, including Involved and Subject, so a location or vehicle incident names the depot or the bus instead of showing an empty cell.</li>\n<li>Everything on the dashboard follows the term and the organizations the user is working in, so a count always matches what the incidents list would return.</li>\n</ul>\n<p>Acceptance criteria:</p>\n<ul>\n<li>Four charts render, and none of them is Incidents by Vehicle.</li>\n<li>Incidents by Subject shows all five subjects, including subjects with no incidents.</li>\n<li>Incidents by Driver excludes incidents with no driver rather than grouping them under a blank label.</li>\n<li>The four KPIs show on one row and each one matches a count taken from the incidents list.</li>\n<li>The active incidents table shows Involved and Subject, with Involved populated for all five subjects.</li>\n<li>Dashboard counts change when the organization selection changes.</li>\n<li>Dashboard counts include only the default term.</li>\n<li>A dashboard with no incidents in scope renders empty charts rather than failing.</li>\n</ul><hr><ul>\n<li>Feature flag: incidents_dashboard_page</li>\n<li>Off by default. With the flag off the navigation entry is absent, the direct URL doesn&#x27;t render the page, and the page issues none of the requests it normally would. Targeting is by site, so a district is wholly on or wholly off.</li>\n<li><a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/208\" target=\"_blank\">Feature flag set for the Incidents pages #208</a> created and closed, since the flag belongs on each ticket it gates.</li>\n</ul>", "sum": "Generate a query to grab the data for a live dashboard page. This should call to get the data live during page load. Strategy for V2 here", "body": "", "ac": "", "a": ""}, {"g": "Existing tickets, detail added", "n": "#75", "t": "Incidents: New Modal", "st": "Open", "kind": "Existing", "owner": "Jon Jungman, Kristen Michalski, opened by Justin Smith", "closes": "Posted. 201, 194 closed into this.", "adds": "<ul>\n<li>The form should ask what the incident is about before anything else. Student, vehicle, location, third party or employee. That choice drives every field after it.</li>\n<li>Every subject runs the same two steps, incident details then review and submit. No subject gets a shorter or different path.</li>\n</ul>\n<p>Incident details has 17 fields. Twelve are the same whatever the subject:</p>\n<ul>\n<li>Type</li>\n<li>Severity</li>\n<li>Description</li>\n<li>Date</li>\n<li>Time</li>\n<li>Location type</li>\n<li>Map pin</li>\n<li>Witnesses</li>\n<li>Third parties</li>\n<li>Tags</li>\n<li>Photos</li>\n<li>Documents</li>\n</ul>\n<p>Five change with the subject:</p>\n<ul>\n<li>Student</li>\n<li>Involved Students</li>\n<li>Vehicle number</li>\n<li>Driver</li>\n<li>Run</li>\n<li>Employee</li>\n<li>Involved Employees</li>\n<li>Vehicle number</li>\n<li>Driver</li>\n<li>Run</li>\n<li>Third party</li>\n<li>Involved People</li>\n<li>Vehicle number</li>\n<li>Driver</li>\n<li>Run</li>\n<li>Vehicle</li>\n<li>Affected vehicle</li>\n<li>Driver</li>\n<li>Location</li>\n<li>Affected location</li>\n<li>Based on what subject was selected. certain fields aren&#x27;t shown at all.  Unneeded fields are collapsed automatically so there&#x27;s no empty gap where something used to be.</li>\n<li>The type list only offers types that belong to the subject. Severity still fills in from the type as originally designed.</li>\n<li>Switching the incident subject part way through entering data clears the type, the people, and the affected asset.  The date, time, description, location and anything attached are kept even after switching subjects. Warn first so nobody loses typed work by accident.</li>\n<li>Witnesses and third parties keep whoever you can name and whoever you can&#x27;t. If all you have is a description, a man at the stop or a car that drove off, that&#x27;s enough to save it. A name is still required for a student, employee or named third party.</li>\n<li>The affected vehicle or location gets picked from the list rather than typed, so the incident counts against that record and can be opened from it.</li>\n<li>Picking a run or a vehicle fills in the driver, instead of three dropdowns to fill separately.</li>\n</ul>\n<p>Acceptance criteria:</p>\n<ul>\n<li>The subject is chosen before anything else, and no other field is available until it is.</li>\n<li>Every subject runs the same two steps.</li>\n<li>A student, employee or third party incident shows its people list plus vehicle number, driver and run.</li>\n<li>A vehicle incident shows the affected vehicle and driver, and no vehicle number, run or people list.</li>\n<li>A location incident shows the affected location and none of vehicle number, driver, run or people list.</li>\n<li>The type list offers only types belonging to the chosen subject.</li>\n<li>Choosing a type fills severity, and severity stays editable.</li>\n<li>Switching subject warns first, and cancelling the warning leaves every field as it was.</li>\n<li>Confirming the switch clears the type, the people and the affected asset, and keeps the date, time, description, location and anything attached.</li>\n<li>A witness or third party with a description and no name saves.</li>\n<li>A student, employee or named third party with no name can&#x27;t be saved.</li>\n<li>The affected vehicle or location can only be chosen from the list, not typed.</li>\n<li>Choosing a run fills the driver, and choosing a vehicle fills the driver.</li>\n<li>Submitting creates one incident record, with every person named on it, not one record per person.</li>\n<li>201 and 194 created and closed, since both should have been added to this ticket originally.</li>\n</ul><hr><ul>\n<li>Feature flag: incidents_list_page</li>\n<li>Off by default. With the flag off the navigation entry is absent, the direct URL doesn&#x27;t render the page, and the page issues none of the requests it normally would. Targeting is by site, so a district is wholly on or wholly off.</li>\n<li>The detail page can&#x27;t be enabled while the list page is off, since that leaves records nobody can navigate to.</li>\n<li><a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/208\" target=\"_blank\">Feature flag set for the Incidents pages #208</a> created and closed, since the flag belongs on each ticket it gates.</li>\n</ul>", "sum": "Utilize forge step tool to create a better user experience for navigating the new incident creation.", "body": "", "ac": "", "a": ""}, {"g": "Existing tickets, detail added", "n": "#77", "t": "Student: Term Considerations", "st": "Open", "kind": "Existing", "owner": "Jon Jungman, opened by Justin Smith", "closes": "Posted. 199 closed into this.", "adds": "<ul>\n<li>An incident gets its term from the default term. Nobody picks it on the form. A driver filing from the tablet never sees a term field.</li>\n<li>A student has a separate record for each term. The incident attaches to the student record for the default term. Those records are tied to the same person, so nothing about that limits what history we can show.</li>\n<li>The incidents grid shows the default term, same as every other grid in the product.</li>\n<li>Clicking a student from an incident opens that student and shows every incident they&#x27;ve had, whatever term it happened in. Group them by year, most recent year first. Four incidents this year against one last year should read as a pattern, not a list.</li>\n<li>An incident opened directly always opens, even when it belongs to an earlier term. Otherwise the history in the student view is a dead end.</li>\n<li>Term shows on the incident record itself. You can tell which school year an incident belongs to without working it out from the date.</li>\n<li>If the term is wrong, it gets corrected by editing the incident after the fact.</li>\n</ul>\n<p>Acceptance criteria:</p>\n<ul>\n<li>A new incident saves with the default term, and the form has no term field.</li>\n<li>A tablet submission saves with the default term with nothing for the driver to choose.</li>\n<li>The incident attaches to the student record for the default term.</li>\n<li>The incidents grid shows only incidents in the default term.</li>\n<li>Opening a student shows every incident from every term, grouped by year with the most recent year first.</li>\n<li>An incident from an earlier term opens when it&#x27;s reached from a student&#x27;s history.</li>\n<li>The record shows which term the incident belongs to.</li>\n<li>Editing an incident allows its term to be corrected, and the change shows in the incident&#x27;s history.</li>\n<li>199 created and closed, since it should have been added to this ticket originally.</li>\n</ul>", "sum": "Students are shown per the default term the site is setup for.", "body": "", "ac": "", "a": ""}, {"g": "Existing tickets, detail added", "n": "#89", "t": "Workflow Builder: Configure Step: Notifications", "st": "Open", "kind": "Existing", "owner": "Unassigned, opened by Justin Smith", "closes": "Posted. 206 closed into this.", "adds": "<p>Five triggers, set per workflow step, all off by default, so a district turns on what it wants and nothing fires on its own:</p>\n<ul>\n<li>The step starts.</li>\n<li>The step completes.</li>\n<li>The step&#x27;s assignee is notified it&#x27;s theirs.</li>\n<li>Approvers are notified a step is waiting on them.</li>\n<li>Named recipients are notified.</li>\n<li>Recipients are the people holding the role the step is assigned to, plus any approver roles selected on the step, plus any address typed into the step&#x27;s recipient list. A role with nobody in it sends nothing rather than failing.</li>\n<li>The copy each one sends is on <a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/95\" target=\"_blank\">Admin: Email Templates #95</a>.</li>\n</ul>\n<p>Acceptance criteria:</p>\n<ul>\n<li>Each of the five triggers can be turned on and off per step, and is off by default.</li>\n<li>Turning on a trigger sends to the resolved role holders, the selected approver roles, and any typed addresses.</li>\n<li>A role with no holders produces no mail and no error.</li>\n<li>A step with no notification configured sends nothing when it starts or completes.</li>\n<li>A sending failure is visible somewhere a coordinator can see that the mail didn&#x27;t go.</li>\n<li><a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/206\" target=\"_blank\">What notifications the module sends, and what each one says #206</a> created and closed, since it should have been added to the existing tickets instead.</li>\n</ul><hr><ul>\n<li>Feature flag: incidents_notifications</li>\n<li>Off by default. With it off the module sends no mail, whatever a workflow step is configured to do. Targeting is by site.</li>\n<li><a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/208\" target=\"_blank\">Feature flag set for the Incidents pages #208</a> created and closed, since the flag belongs on each ticket it gates.</li>\n</ul>", "sum": "Notify users when step is at correct stage. This will require using the templates, making them configurable and then passing to a job to forward emails on.", "body": "", "ac": "", "a": ""}, {"g": "Existing tickets, detail added", "n": "#90", "t": "Workflow Builder: Configure Step - Approvals", "st": "Open", "kind": "Existing", "owner": "Unassigned, opened by Justin Smith", "closes": "Posted. 195 closed into this.", "adds": "<ul>\n<li>Approval is by role. On a step that requires approval you pick which incident roles can approve it, and anyone holding one of those roles can act on it. A step can&#x27;t require approval without at least one approver role selected.</li>\n<li>An approval is recorded separately from the work. The record keeps who approved and when, distinct from who completed the step, so a district can answer who signed off on a disciplinary action.</li>\n<li>An approver can reject, with a reason that&#x27;s required. Rejecting returns the step to In Progress and keeps the work already recorded. The assignee is notified.</li>\n<li>A step waiting on approval looks different from one still in progress.</li>\n<li>Approvals and rejections both appear in the incident history, in <a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/73\" target=\"_blank\">Incidents: History #73</a>. A step that was rejected and later approved keeps both events rather than the second replacing the first.</li>\n<li>Approvals here behave the same way as approvals elsewhere in Student Transportation, so a district that already sets up approvals doesn&#x27;t have to learn a second model.</li>\n</ul>\n<p>Acceptance criteria:</p>\n<ul>\n<li>A step marked as requiring approval can&#x27;t be saved with no approver role selected.</li>\n<li>Completing a step that requires approval leaves it waiting on approval rather than complete.</li>\n<li>A step waiting on approval is visibly distinct from a step in progress.</li>\n<li>Only a user holding one of the selected approver roles can approve or reject.</li>\n<li>An approval records the approver and the time, separately from who completed the work.</li>\n<li>Rejecting without a reason isn&#x27;t allowed.</li>\n<li>Rejecting returns the step to In Progress, keeps the work already recorded, and notifies the assignee.</li>\n<li>A step rejected and later approved shows both events in the incident history.</li>\n<li><a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/195\" target=\"_blank\">Workflow step approval has no recorded outcome and no reject path #195</a> created and closed, since it should have been added to this ticket originally.</li>\n</ul><hr><ul>\n<li>Feature flag: incidents_approvals</li>\n<li>Off by default. With it off a step can&#x27;t be set to require approval and no step waits on one. Targeting is by site.</li>\n<li><a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/208\" target=\"_blank\">Feature flag set for the Incidents pages #208</a> created and closed, since the flag belongs on each ticket it gates.</li>\n</ul>", "sum": "Requiring approval by who? What needs to be done here? @captwildguns", "body": "", "ac": "", "a": ""}, {"g": "Existing tickets, detail added", "n": "#93", "t": "Reports", "st": "Open", "kind": "Existing", "owner": "Gabe Guzman, opened by Justin Smith", "closes": "Posted. 203 closed into this.", "adds": "<ul>\n<li>The exported record set uses the same Involved column as the incidents list. A row for a location or vehicle incident names the depot or the bus instead of leaving the student column empty.</li>\n</ul>\n<p>Acceptance criteria:</p>\n<ul>\n<li>An export containing a mix of subjects has no empty cells in the Involved column.</li>\n<li>Involved in the export matches Involved in the incidents list for the same incident.</li>\n<li>An export of location incidents only names the location on every row.</li>\n<li><a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/203\" target=\"_blank\">Subject and status carried through the list, the record, communications and reports #203</a> created and closed, since it should have been added to the existing tickets instead.</li>\n</ul><hr><ul>\n<li>Feature flag: incidents_reports_page</li>\n<li>Off by default. With the flag off the navigation entry is absent, the direct URL doesn&#x27;t render the page, and the page issues none of the requests it normally would. Targeting is by site, so a district is wholly on or wholly off.</li>\n<li><a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/208\" target=\"_blank\">Feature flag set for the Incidents pages #208</a> created and closed, since the flag belongs on each ticket it gates.</li>\n</ul>", "sum": "Create a list of actual PDF reports (v1 + v2)", "body": "", "ac": "", "a": ""}, {"g": "Existing tickets, detail added", "n": "#95", "t": "Admin: Email Templates", "st": "Open", "kind": "Existing", "owner": "Gabe Guzman, opened by Justin Smith", "closes": "Posted. 206 closed into this.", "adds": "<ul>\n<li>Three templates. The text is fixed, with nothing pulled from the incident, so every mail is a prompt to sign in and look rather than a carrier of detail.</li>\n<li>Action required, sent to the people holding the step&#x27;s role.</li>\n<li>Subject: &quot;Action required in the Incident Tracker&quot;</li>\n<li>Body: &quot;A workflow step in the Incident Tracker is assigned to your role and needs attention.</li>\n<li>Sign in to Incidents and open your assigned incidents to see what is waiting.&quot;</li>\n<li>Approval needed, sent to the approver roles selected on the step.</li>\n<li>Subject: &quot;Approval needed in the Incident Tracker&quot;</li>\n<li>Body: &quot;A workflow step in the Incident Tracker is waiting for your approval.</li>\n<li>Sign in to Incidents and open your assigned incidents to approve the step or send it back for revision.&quot;</li>\n<li>Parent or guardian notification, sent to the guardians of a student named on the incident.</li>\n<li>Subject: &quot;Transportation incident involving your student&quot;</li>\n<li>Body: &quot;Your student was involved in an incident.</li>\n<li>Someone from the transportation team will contact you to go through what happened. If you would like to reach us first, please call the transportation office.&quot;</li>\n<li>The parent mail carries no student name, no date, no time, no incident type and no severity. Mail isn&#x27;t a private channel and often lands on a shared account, so specifics belong in the conversation that follows.</li>\n<li>Parent or guardian notification only applies where a student is involved. An employee, vehicle, location or third party incident never sends it, whatever a step is configured to do.</li>\n<li>Wording per incident type comes later. A step on a weapon incident and a step on a disruptive behavior incident send the same Action required mail, since the reader opens the incident to act anyway.</li>\n</ul>\n<p>Acceptance criteria:</p>\n<ul>\n<li>Admin lists the three templates and the copy each one sends.</li>\n<li>Each template sends exactly the copy above, with no placeholder text left visible in the subject or the body.</li>\n<li>The parent mail contains no student name, no date, no time, no incident type and no severity.</li>\n<li>Selecting the parent template on a step of a non-student incident sends nothing.</li>\n<li>No template requires a value from the incident to render.</li>\n<li><a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/206\" target=\"_blank\">What notifications the module sends, and what each one says #206</a> created and closed, since it should have been added to the existing tickets instead.</li>\n</ul><hr><ul>\n<li>Feature flag: incidents_admin_page</li>\n<li>Off by default. With the flag off the navigation entry is absent, the direct URL doesn&#x27;t render the page, and the page issues none of the requests it normally would. Targeting is by site, so a district is wholly on or wholly off.</li>\n<li>Feature flag: incidents_notifications</li>\n<li>Off by default. With it off the module sends no mail, whatever a workflow step is configured to do. Targeting is by site.</li>\n<li><a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/208\" target=\"_blank\">Feature flag set for the Incidents pages #208</a> created and closed, since the flag belongs on each ticket it gates.</li>\n</ul>", "sum": "Email Templates", "body": "", "ac": "", "a": ""}, {"g": "Existing tickets, detail added", "n": "#108", "t": "MDM: Handle MDM in the UI/backend", "st": "Open", "kind": "Existing", "owner": "Unassigned, opened by Jon Jungman", "closes": "Posted. 198 closed into this.", "adds": "<ul>\n<li>Incidents should use the same organization selector Student Transportation already uses, not a new one.</li>\n<li>It&#x27;s a list of districts and schools with checkboxes, shown as a tree so you can see what sits under what. Check a district and everything under it gets checked. Anything the user doesn&#x27;t have access to shows greyed out instead of being hidden, so the list still makes sense. You pick what you want, hit save, and confirm before it takes effect.</li>\n<li>It only shows up if the client is MDM and the user has more than one organization. Single district, there&#x27;s no selector at all and nothing gets filtered.</li>\n<li>You should be able to see which districts you&#x27;re in without opening anything, so you know what a count covers before you read it.</li>\n<li>Changing it reloads incidents, the dashboard, reports and communications.</li>\n</ul>\n<p>Acceptance criteria:</p>\n<ul>\n<li>Single district client, no selector appears anywhere and nothing is filtered by organization.</li>\n<li>MDM client with the user in one organization, no selector appears.</li>\n<li>MDM client with the user in more than one organization, the selector appears in the navigation.</li>\n<li>Checking a district checks every school under it, and unchecking it clears them.</li>\n<li>An organization the user has no access to shows greyed out and can&#x27;t be checked.</li>\n<li>The districts currently in scope are readable without opening the selector.</li>\n<li>Saving asks for confirmation first, and cancelling leaves the previous scope in place.</li>\n<li>After saving, incidents, the dashboard, reports and communications reload for the new scope.</li>\n<li>Every count and list in the module includes only incidents from the organizations in scope.</li>\n<li>School level scoping was 190 created and closed, since it should have been added to this ticket originally.</li>\n</ul>", "sum": "If the Student Transportation site is in MDM mode, Incidents has to scope to organizations. It does none of that today. No incident table, no workflow table, and no incident configuration table carries an org, so on a multi-district site every district would see every other district's incidents.", "body": "", "ac": "", "a": ""}, {"g": "Existing tickets, detail added", "n": "#116", "t": "Incidents: Incidents Data Table", "st": "Open", "kind": "Existing", "owner": "Unassigned, opened by Gabe Guzman", "closes": "Posted. 203 closed into this.", "adds": "<ul>\n<li>Involved replaces the Student column. It names whoever or whatever the incident is about, so the student, the employee, the third party, the bus, or the location. It&#x27;s never blank.</li>\n<li>Subject is a column, sortable and filterable, showing which of the five the incident is.</li>\n<li>Status is a column.</li>\n<li>Every column header carries a filter that applies as it&#x27;s typed or chosen.</li>\n<li>The Subject filter is the piece left over when <a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/114\" target=\"_blank\">Incidents: Filters Card #114</a> closed, so it&#x27;s covered here.</li>\n</ul>\n<p>Acceptance criteria:</p>\n<ul>\n<li>The list shows Involved, Subject and Status columns.</li>\n<li>Involved is populated for all five subjects, with no empty cells.</li>\n<li>Sorting by Subject groups the five subjects together.</li>\n<li>Filtering Subject to Vehicle returns only vehicle incidents.</li>\n<li>Filtering Status to Open excludes closed and cancelled incidents.</li>\n<li>Each column header filter applies without a separate apply or search action.</li>\n<li>Clearing a filter restores the full list.</li>\n<li><a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/203\" target=\"_blank\">Subject and status carried through the list, the record, communications and reports #203</a> created and closed, since it should have been added to the existing tickets instead.</li>\n</ul><hr><ul>\n<li>Feature flag: incidents_list_page</li>\n<li>Off by default. With the flag off the navigation entry is absent, the direct URL doesn&#x27;t render the page, and the page issues none of the requests it normally would. Targeting is by site, so a district is wholly on or wholly off.</li>\n<li>The detail page can&#x27;t be enabled while the list page is off, since that leaves records nobody can navigate to.</li>\n<li><a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/208\" target=\"_blank\">Feature flag set for the Incidents pages #208</a> created and closed, since the flag belongs on each ticket it gates.</li>\n</ul>", "sum": "Incidents record grid on the Incidents list page.", "body": "", "ac": "", "a": ""}, {"g": "Existing tickets, detail added", "n": "#120", "t": "Incident Details: Overview Tab", "st": "Open", "kind": "Existing", "owner": "Unassigned, opened by Gabe Guzman", "closes": "Posted. 203 closed into this.", "adds": "<ul>\n<li>The record shows every field the form collected. Based on what subject was selected, certain fields aren&#x27;t shown at all. An unused field is absent rather than shown empty.</li>\n<li>On the Overview: Subject, Type, Occurred date and time, Term, Location, Severity, Status, Assigned To and Description. Vehicle, Driver and Run show where the subject uses them.</li>\n<li>Student, Employee and Third party incidents get an Involved Parties section listing the people named, each with their role, severity and action taken.</li>\n<li>Vehicle and Location incidents get an Affected Vehicle or Affected Location card in place of the people list, since the asset is what identifies the record.</li>\n<li>Photos and Documents each carry a count, so you can see there&#x27;s evidence without opening the tab.</li>\n<li>Status is a value on the incident, one of Open, In Progress, Closed or Cancelled. Changing it is recorded in the incident&#x27;s history with who changed it and when.</li>\n<li>Term on the record is covered in <a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/77\" target=\"_blank\">Student: Term Considerations #77</a>.</li>\n</ul>\n<p>Acceptance criteria:</p>\n<ul>\n<li>Opening a Location incident shows the affected location and no Vehicle Number, Driver or Run.</li>\n<li>Opening a Vehicle incident shows the affected vehicle and no Involved Parties section.</li>\n<li>Opening an Employee incident shows the involved people with their roles and no affected asset card.</li>\n<li>No field on the Overview renders with an empty value where the subject doesn&#x27;t use it.</li>\n<li>The record shows the term the incident belongs to.</li>\n<li>Photos and Documents each show a count that matches what&#x27;s attached, including zero.</li>\n<li>Changing the status writes an entry in the incident&#x27;s history naming the user and the time.</li>\n<li>A status value outside Open, In Progress, Closed and Cancelled can&#x27;t be set.</li>\n<li><a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/203\" target=\"_blank\">Subject and status carried through the list, the record, communications and reports #203</a> created and closed, since it should have been added to the existing tickets instead.</li>\n</ul><hr><ul>\n<li>Feature flag: incidents_detail_page</li>\n<li>Off by default. With the flag off the navigation entry is absent, the direct URL doesn&#x27;t render the page, and the page issues none of the requests it normally would. Targeting is by site, so a district is wholly on or wholly off.</li>\n<li>The detail page can&#x27;t be enabled while the list page is off, since that leaves records nobody can navigate to.</li>\n<li><a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/208\" target=\"_blank\">Feature flag set for the Incidents pages #208</a> created and closed, since the flag belongs on each ticket it gates.</li>\n</ul>", "sum": "Incident details card and current workflow step card displayed on the Overview tab.", "body": "", "ac": "", "a": ""}, {"g": "Existing tickets, detail added", "n": "#121", "t": "Incident Details: Communications Tab", "st": "Open", "kind": "Existing", "owner": "Jon Jungman, opened by Gabe Guzman", "closes": "Posted. 203 closed into this.", "adds": "<ul>\n<li>The other party on a conversation comes from the incident itself rather than assuming a student&#x27;s driver. An employee incident doesn&#x27;t open a thread addressed to a parent.</li>\n<li>A Subject filter on the conversation list.</li>\n</ul>\n<p>Acceptance criteria:</p>\n<ul>\n<li>A conversation on an employee incident shows the employee side of the exchange rather than a parent or student.</li>\n<li>A conversation on a vehicle or location incident opens without a parent or student recipient.</li>\n<li>Filtering conversations by Subject returns only conversations on incidents of that subject.</li>\n<li>The conversation list stays filtered to the incident it was opened from.</li>\n<li><a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/203\" target=\"_blank\">Subject and status carried through the list, the record, communications and reports #203</a> created and closed, since it should have been added to the existing tickets instead.</li>\n</ul><hr><ul>\n<li>Feature flag: incidents_communications_page</li>\n<li>Off by default. With the flag off the navigation entry is absent, the direct URL doesn&#x27;t render the page, and the page issues none of the requests it normally would. Targeting is by site, so a district is wholly on or wholly off.</li>\n<li><a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/208\" target=\"_blank\">Feature flag set for the Incidents pages #208</a> created and closed, since the flag belongs on each ticket it gates.</li>\n</ul>", "sum": "Chat-style thread between coordinators and drivers with message input field, filtered to the specific incident.", "body": "", "ac": "", "a": ""}, {"g": "Existing tickets, detail added", "n": "#139", "t": "Help Page", "st": "Open", "kind": "Existing", "owner": "Jon Jungman, opened by Gabe Guzman", "closes": "Posted. 204 closed into this.", "adds": "<ul>\n<li>The Help content moves to DocuSource. The module doesn&#x27;t keep its own copy of the guide, so correcting a sentence is a documentation change instead of a code change. Help in the app opens the DocuSource content for incidents.</li>\n</ul>\n<p>What the documentation has to cover:</p>\n<ul>\n<li>The five incident subjects, and that the subject is chosen first.</li>\n<li>The two step form.</li>\n<li>The 20 incident types and the categories they fall under.</li>\n<li>The 12 workflows and the required incident owner.</li>\n<li>The five incident roles.</li>\n<li>The difference between the date the incident happened and the date it was reported.</li>\n<li>How the term is set, covered in <a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/77\" target=\"_blank\">Student: Term Considerations #77</a>.</li>\n<li>The twelve location types.</li>\n<li>The per column filters and pagination on the grids.</li>\n<li>One incident record is created, and each person named on it carries their own workflow.</li>\n<li>Product owns the wording. A wording change is an edit in DocuSource, not a ticket describing the sentence.</li>\n</ul>\n<p>Acceptance criteria:</p>\n<ul>\n<li>Help in the app opens the DocuSource content for the incident module.</li>\n<li>No getting started, guide or FAQ text is maintained inside the module.</li>\n<li>The documentation describes the five subjects, the two step form, the 20 types, the 12 workflows and the five incident roles.</li>\n<li>A wording correction made in DocuSource shows in the app without a module release.</li>\n<li>Every subject has coverage in the documentation, including vehicle and location incidents that name no people.</li>\n<li><a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/204\" target=\"_blank\">Hand the Help page copy to development as source files #204</a> created and closed, since it should have been added to this ticket originally.</li>\n</ul><hr><ul>\n<li>Feature flag: incidents_help_page</li>\n<li>Off by default. With the flag off the navigation entry is absent, the direct URL doesn&#x27;t render the page, and the page issues none of the requests it normally would. Targeting is by site, so a district is wholly on or wholly off.</li>\n<li><a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/208\" target=\"_blank\">Feature flag set for the Incidents pages #208</a> created and closed, since the flag belongs on each ticket it gates.</li>\n</ul>", "sum": "UI spec for the Help page. Three tabs:", "body": "", "ac": "", "a": ""}, {"g": "New tickets, still open", "n": "#191", "t": "Add Non Student Incidents (Vehicle, Location, 3rd Party, Employee) into Incident Tracker", "st": "Open", "kind": "Ours", "owner": "Unassigned", "closes": "", "adds": "", "sum": "An incident is not always about a student. Two employees in a fight has no student. A bus damaged in the yard with nobody aboard has no student. A burst pipe in the depot has no student. A collision with another motorist has no student. STA and Cypress Fairbanks have both asked whether Incidents can", "body": "<p>An incident is not always about a student. Two employees in a fight has no student. A bus damaged in the yard with nobody aboard has no student. A burst pipe in the depot has no student. A collision with another motorist has no student. STA and Cypress Fairbanks have both asked whether Incidents can be used for non-student events, so a student cannot be a required part of an incident.</p>\n<p>This is the parent issue for that change. It covers the subject model, the new incident types and workflows, the date and time capture, and the reorganized create form.</p>\n<p>Subjects.</p>\n<p>Every incident has exactly one subject. The subject is what the incident is fundamentally about. It determines which incident types are offered, which filing steps appear, which workflow is assigned, and how the record is labeled in the list and on the detail page. There are five:</p>\n<ul>\n<li>Student. One or more students involved. Requires at least one named student.</li>\n<li>Vehicle. Bus damage or a mechanical problem with nobody aboard. Names an affected vehicle, no people.</li>\n<li>Location. A depot, garage, or yard problem such as a burst pipe or power loss. Names an affected location, no people. Location is the entity Student Transportation already uses for a garage or depot, so the subject, its category, and its types all use that word rather than Facility.</li>\n<li>Third Party. Another motorist, a pedestrian, a parent, or a member of the public. Requires at least one named person.</li>\n<li>Employee. Employees only, such as a dispute between drivers or an injured aide. Requires at least one named employee.</li>\n</ul>\n<p>Access to an incident is governed the same way for every subject. There is no per-subject visibility rule and employee incidents are not restricted as a class. Who can see an incident is decided by the resource grants defined in #181, applied identically to all five subjects.</p>\n<p>Incident types.</p>\n<p>The incident type list is filtered by subject, so a vehicle incident only offers vehicle types. The type list has to cover all five subjects, so types and categories are defined for each below. Category describes what happened, not who was involved, because category is what the list filters on and what reports group by. The subject field already carries the relationship.</p>\n<ul>\n<li>Employee: Employee Altercation and Employee Misconduct under a new Employee Conduct category, Employee Substance Violation under the Prohibited category, Employee Injury under the Safety category.</li>\n<li>Location: Location Damage, Utility Failure, and Location Safety Hazard under a new Location category.</li>\n<li>Vehicle: Vehicle Damage and Mechanical Failure under a new Mechanical category, Single Vehicle Collision under a new Collision category.</li>\n<li>Third Party: Third Party Collision under Collision, Third Party Injury under Safety, Third Party Conduct under the Aggression / Violence category, Public Complaint under the Informational category.</li>\n</ul>\n<p>Employee Injury is not a conduct matter, so filing it under Employee Conduct would put a workplace injury into any conduct report pulled about that person. Employee Substance Violation sits under Prohibited alongside Weapon / Prohibited Items so that a district asking how many substance incidents they had gets one number rather than two split by whether a student or an employee was involved. Public Complaint under Informational keeps a parent phoning in a complaint out of the collision count that goes to leadership and insurance.</p>\n<p>Workflows.</p>\n<p>Each new type needs a default workflow. Workflow assignment keys off incident type plus severity, so these types need no new assignment logic. Routing differs by subject:</p>\n<ul>\n<li>Employee incidents assign to Administrator rather than a school principal. An employee matter is not a school discipline matter.</li>\n<li>Location incidents assign to Administrator. They should not reuse the Property Damage workflow, because the response and the approver are different.</li>\n<li>Vehicle incidents assign to Fleet Manager. Nobody was aboard, so there are no statements to collect and the workflow is shorter.</li>\n<li>Third Party incidents assign to Safety Coordinator, and run the steps needed for an outside party, including any claim or insurance follow-up.</li>\n</ul>\n<p>Steps assign to the five incident roles provisioned by <a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/188\" target=\"_blank\">Create Core DB stored procedure for seeding Incident role GUIDs into step templates and workflows #188</a>: Driver, Safety Coordinator, Administrator, Fleet Manager and School Principal. A role is held by Student Transportation employees, and each role carries its own security group, so no new roles are added. A district that wants a different owner for employee or location incidents reassigns the step in the workflow builder, the same as any other step.</p>\n<p>Date and time.</p>\n<p>An incident filed the next morning has to carry the date it happened, not the date it was filed. The record therefore needs two timestamps, both visible on the incident.</p>\n<ul>\n<li>Incident date. When the incident occurred. Required. Defaults to today and cannot be set in the future. Helper text reads &quot;When the incident occurred, not when you are filing it.&quot;</li>\n<li>Incident time. Required. Not defaulted, so the reporter enters the value. Helper text reads &quot;Approximate is fine if the exact time is unknown.&quot;</li>\n<li>Reported date and time. When the record was created. Set by the system and not editable.</li>\n</ul>\n<p>Time is required because an AM run and a PM run are materially different events in transportation, time of day is the dimension any route or run based analysis needs, and it is what gives the gap between incident time and reported time any meaning. The reporter entering a historical incident from paper is asked on screen for a best estimate rather than a precise claim, which is what the helper text is for.</p>\n<p>Incident list sorting, date filters, and reports that group by day or month all use the incident date, because that is what users mean by when. The gap between the two timestamps is what makes late reporting visible, so the detail page shows both rather than collapsing them into one.</p>\n<p>New incident form layout.</p>\n<p>The form is reorganized around the subject rather than assuming a student. Choosing the subject comes first, before any other field. It has to, because the subject determines every field that follows. All five subjects are shown together so the whole choice is visible at once.</p>\n<p>Every subject then runs the same two steps: Incident Details, then Review and Submit. One form serves all five.</p>\n<p>Counted from the form, the Incident Details step carries 17 distinct fields, and 12 are identical for all five subjects: incident type, severity, description, date, time, location type, location on the map, witnesses, third parties, tags, photo evidence, and document evidence.</p>\n<p>Five vary, all governed by one map rather than by per-subject screens. People roster, on Student, Employee and Third Party. Affected asset, on Vehicle and Location, the only genuinely subject-specific field and one control whose label and source change. Vehicle Number, absent on Vehicle because the affected asset already names the bus, and absent on Location. Driver, absent on Location. Run, absent on Vehicle since nobody is aboard, and absent on Location.</p>\n<p>The per-subject delta from the shared set is therefore Student 4, Employee 4, Third Party 4, Vehicle 2, Location 1. This is one form with a field map, not five forms, which is what makes it a single estimable item rather than a redesign of every screen.</p>\n<p>Three rules follow from that. A field never changes position between subjects, so Incident Type sits in the same slot on all five. Fields are one ordered list flowed into a grid, so a field the subject does not need is not rendered and the fields after it close up, leaving no gap where an unused field would sit. People Involved is a section inside Incident Details rather than a step of its own, with per-person detail as an expandable row, and there is one roster implementation rather than one for students and a parallel one for everyone else.</p>\n<p>The roster is labeled by subject: Involved Students, Involved Employees, or Involved People.</p>\n<p>Field order follows the order a reporter thinks in: who, then what, then when and where, then supporting detail.</p>\n<p>Changing the subject after starting a report clears only the subject-specific answers, the incident type, the people involved, and the affected asset, and keeps date, time, description, location, and evidence. The reporter is warned first, so a mid-report switch is never a silent data loss.</p>\n<p>Named people carry a role of Participant, Witness, Reporter, or Injured, and a per-person severity, description, action taken, and notes.</p>\n<p>People who are present but are not the subject, witnesses and third parties on any subject, carry a name, a phone, an email, and a description. Not every one of them can be named. A person loitering at a stop, or a motorist who drove off, has to be filable as a description alone. A contact is therefore kept when it has either a name or a description, and dropped only when both are empty. Name is required where it is meaningful, which is the subject of the incident: a student, an employee, or a named third party.</p>\n<p>Incidents list and detail.</p>\n<p>The incidents list replaces its Student column with an Involved column that names whoever or whatever the incident is about, and adds Subject as a sortable, filterable column. Without a subject filter there is no way to isolate location incidents or to pull a student view that excludes employee records, which several acceptance criteria below depend on.</p>\n<p>Incident detail shows an Involved Parties section for employee and third party incidents, and an Affected Location or Affected Vehicle card for the two people-free subjects.</p>\n<p>School filtering.</p>\n<p>Non-student incidents are not filtered by school. This matches the decision in #190 that drivers and vehicles are out of scope for school-based access.</p>\n<p>One implementation note. The school filter matches an incident when at least one of its students attends a school the user can access. An incident with no students fails that test, so it would resolve to visible to nobody. Studentless incidents need to bypass the school filter rather than be evaluated by it.</p>\n<p>A known tradeoff comes with that. Non-student subjects carry no school scoping of any kind, because drivers have no school foreign key and vehicles carry only a garage LocationId. A user with full employee incident access therefore sees every employee incident district wide. Garage or department scoping would be new architecture and is not in this issue.</p>\n<p>Acceptance criteria.</p>\n<ul>\n<li>A Vehicle incident saves with an affected vehicle, no people, and no validation error, and its filing flow shows the same two steps as every other subject.</li>\n<li>A Location incident saves with an affected location, no people, and no validation error, and its filing flow shows the same two steps as every other subject.</li>\n<li>A witness or third party can be saved with a description and no name, and is dropped only when name and description are both empty.</li>\n<li>An Employee incident saves with one or more employees, and is visible to exactly the users its resource grants allow, with no additional restriction applied for being an employee incident.</li>\n<li>A Third Party incident saves with one or more named outside people.</li>\n<li>All five subjects show the same two steps, and Incident Type appears in the same position on all five.</li>\n<li>The incident type dropdown only offers types matching the chosen subject.</li>\n<li>Each new incident type is assigned its workflow on creation, and its steps can be completed and approved the same as a student incident.</li>\n<li>Incident date and incident time are both required, and the Incident Details step cannot be completed without both.</li>\n<li>Incident date cannot be set to a future date.</li>\n<li>Reported date and time cannot be edited by any role.</li>\n<li>Incident list sorting and date filters operate on the incident date.</li>\n<li>The incidents list shows Subject as a column and can be filtered to a single subject.</li>\n<li>Changing subject mid-report clears type, people, and asset, keeps date, time, description, location, and evidence, and warns first.</li>\n<li>The incidents list, incident detail, dashboard, and reports render every subject with no blank subject and no null error.</li>\n<li>A user with access to a single school still sees Vehicle, Location, Third Party, and Employee incidents.</li>\n</ul>", "ac": "", "a": ""}, {"g": "New tickets, still open", "n": "#192", "t": "TYD Tablet - Need ability to submit a new Incident from Tyler Drive (UI/UX)", "st": "Open", "kind": "Ours", "owner": "Unassigned", "closes": "", "adds": "", "sum": "This one's still early in design and not close to ready.", "body": "<p>This one&#x27;s still early in design and not close to ready.</p>\n<p>A driver files an incident from a Tyler Drive tablet and it becomes a full incident record, for any of the five subjects. A driver facing incident list, incident detail, and driver to coordinator messaging aren&#x27;t included.</p>\n<p>Accepting a submission.</p>\n<ul>\n<li>One submission creates one incident. The driver who submitted it is the reporter.</li>\n<li>The subject is one of student, employee, vehicle, location or third party.</li>\n<li>The incident type and severity arrive as submitted. Severity defaults from the type on the tablet and is editable there, so what arrives is what the driver meant.</li>\n<li>The date and time the incident happened are stored separately from the time it was submitted.</li>\n<li>The run, vehicle, driver, school and grade the tablet captures on its own are stored on the incident.</li>\n<li>The map pin and whether the driver was on a run are stored on the incident.</li>\n<li>The incident is assigned its workflow on creation and enters it immediately, the same as one created in the web app.</li>\n<li>A tablet incident is indistinguishable from a web one everywhere except that its source is recorded.</li>\n</ul>\n<p>Acceptance criteria:</p>\n<ul>\n<li>A submission for each of the five subjects creates an incident with every submitted field present.</li>\n<li>The incident appears in the list, in search and in dashboard counts, subject to the same permission and school filtering as any other.</li>\n<li>The incident is on its assigned workflow with the first step live.</li>\n<li>The date the incident happened can be reported on independently of the date it was submitted.</li>\n<li>The map pin shows on the incident the same way a location entered on the web does.</li>\n<li>The source of the incident is recorded and can be reported on.</li>\n</ul>\n<p>Several people on one submission.</p>\n<ul>\n<li>The submission carries a list of involved people, not a single person.</li>\n<li>Each person carries their own role, severity, statement and action taken. The role list is the same one the web form offers: Participant, Witness, Reporter, Injured, Instigator, Victim, Bystander.</li>\n<li>They all land on one incident, and each person named carries their own workflow.</li>\n<li>A submission naming one person behaves the same as one naming several.</li>\n</ul>\n<p>Acceptance criteria:</p>\n<ul>\n<li>A submission naming three students creates one incident with three people on it, not three incidents.</li>\n<li>Each person has their own role, severity, statement and action taken on the record.</li>\n<li>Each person named carries their own workflow.</li>\n<li>A user with access to any one of the involved people&#x27;s schools sees the incident.</li>\n<li>A submission naming one person creates one incident with one person on it.</li>\n</ul>\n<p>Photo evidence.</p>\n<ul>\n<li>Photos taken on the tablet arrive with the submission and are stored the same way a web upload is.</li>\n<li>They appear on the incident&#x27;s Photos tab.</li>\n<li>A tablet photo gets the same checks a web upload gets: size limit, allowed file types, and a check that the file isn&#x27;t an executable.</li>\n<li>A photo that fails a check is rejected on its own and recorded as rejected. The incident is still created.</li>\n</ul>\n<p>Acceptance criteria:</p>\n<ul>\n<li>A photo taken on the tablet is on the resulting incident and viewable on the Photos tab.</li>\n<li>Several photos on one submission all arrive.</li>\n<li>An oversized or disallowed file is rejected, the incident is still created, and the coordinator can see the rejection.</li>\n<li>A photo is never silently dropped.</li>\n</ul>\n<p>Triage for a submission that can&#x27;t be matched.</p>\n<ul>\n<li>A submission whose student, employee or vehicle can&#x27;t be matched to a known record still creates the incident.</li>\n<li>What the driver submitted is kept exactly as submitted so a coordinator can resolve it.</li>\n<li>The incident is flagged as needing triage rather than failing or being held. Losing a driver&#x27;s report is worse than holding a partial one.</li>\n</ul>\n<p>Acceptance criteria:</p>\n<ul>\n<li>A submission with an unmatched subject creates an incident and returns no error to the tablet.</li>\n<li>The submitted values that couldn&#x27;t be matched are visible on the incident.</li>\n<li>Incidents needing triage can be found as a set, not one at a time.</li>\n<li>Resolving the match completes the incident with nothing re-entered.</li>\n<li>Photos and the map pin survive on an incident that needed triage.</li>\n</ul>\n<p>Not included.</p>\n<ul>\n<li>The driver facing incident list, incident detail, and driver to coordinator messaging.</li>\n<li>An authoring screen for the tablet form definitions.</li>\n<li>Any change to existing conduct form submissions or how they&#x27;re delivered, which keep working unchanged.</li>\n</ul>\n<p>Dependencies.</p>\n<ul>\n<li>The service the tablet submits to, and the form definitions, in tyler-technologies/tyler-drive-api#140.</li>\n<li>The tablet application work, including the list of involved people, in tyler-technologies/tyler-drive-maui#366.</li>\n<li>Subject names come from <a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/191\" target=\"_blank\">Add Non Student Incidents (Vehicle, Location, 3rd Party, Employee) into Incident Tracker #191</a>.</li>\n<li>Who can see a tablet created incident comes from <a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/181\" target=\"_blank\">Implement Permissions in Incidents Tracker application #181</a> and <a href=\"https://github.com/tyler-technologies/transportation-incidents/issues/193\" target=\"_blank\">Seed follow up: expand the incident permission resources and grant the subject areas #193</a>.</li>\n</ul>", "ac": "", "a": ""}, {"g": "New tickets, still open", "n": "#193", "t": "Additional seed data for incident permissions: new subject areas need permissions", "st": "Open", "kind": "Ours", "owner": "Justin Smith", "closes": "", "adds": "", "sum": "Follow up to transportation-traversa#19960, covering blocks 2 and 3 of #181. The work is in the Security DB seeding procs, so delivery lands in transportation-traversa. 19960 stays as approved and these changes go in a new PR.", "body": "<p>Follow up to transportation-traversa#19960, covering blocks 2 and 3 of #181. The work is in the Security DB seeding procs, so delivery lands in transportation-traversa. 19960 stays as approved and these changes go in a new PR.</p>\n<h4>1. Resource tree</h4>\n<p><code>incident-drivers</code> is renamed to <code>incident-employees</code>. In Student Transportation a driver is an Employee, so a separate driver resource would overlap the Employee subject that #191 introduces. The resource is seeded with no grants and is not yet enforced, so the rename carries no data impact.</p>\n<p><code>incident-locations</code> is added as a new subject resource for the Location subject.</p>\n<p>Acceptance criteria:</p>\n<ul>\n<li><code>incident-employees</code> exists in place of <code>incident-drivers</code>, nested under the <code>incidents</code> parent</li>\n<li><code>incident-locations</code> exists, nested under the <code>incidents</code> parent</li>\n<li>Both carry <code>ResourcePermissionProperty</code> entries consistent with the other subject resources</li>\n<li>Both appear in the role permission tree under the <code>IncidentManagement</code> upgrade and are hidden when the upgrade is off</li>\n<li>Permission labels are present in <code>Permission.resx</code> and the es-US, fr-CA and ar-SA locale files</li>\n<li>Seeding remains additive, <code>NOT EXISTS</code> guarded, and re-runnable</li>\n</ul>\n<h4>2. Grants for the subject areas</h4>\n<p>19960 leaves the subject areas and <code>incident-admin</code> ungranted. Combined with the enforcement in #181, ungranted means no role can reach those areas, so defaults are required.</p>\n<ul>\n<li><code>incident-students</code>: Admin full, Safety full, Principal read, Fleet none, Driver none</li>\n<li><code>incident-employees</code>: Admin full, Safety full, Fleet read, Principal none, Driver none</li>\n<li><code>incident-vehicles</code>: Admin full, Fleet full, Safety read and update, Principal none, Driver none</li>\n<li><code>incident-locations</code>: Admin full, Safety full, Principal read, Fleet none, Driver none</li>\n<li><code>incident-admin</code>: Admin full, all other roles none</li>\n</ul>\n<p>These are shipped defaults that districts change in the role editor.</p>\n<p>Delete is Administrator only, and no other role receives it for any subject area. Deleting an incident removes it from view rather than removing the row: it drops out of lists, counts, search and reports, while the record and its history are retained, and the deletion itself is written to the audit trail with the user and the time.</p>\n<p>Acceptance criteria:</p>\n<ul>\n<li>A tenant with the upgrade enabled has the grants above after the permission seed runs</li>\n<li>Each of the five default roles reaches exactly the areas listed and no others</li>\n<li>Re-running the seed adds no duplicate grants</li>\n<li>Existing grants are never edited or removed</li>\n<li>No role other than Administrator holds delete on any incident subject area</li>\n</ul>\n<h4>Out of scope</h4>\n<ul>\n<li>Application enforcement of the resources, covered by #181</li>\n<li>Third party subject resources, deferred until a Student Transportation entity exists for third party</li>\n<li>Running <code>InsertDefaultIncidentPermission</code> at upgrade enable, tracked separately</li>\n</ul>", "ac": "", "a": ""}, {"g": "New tickets, still open", "n": "#196", "t": "Need new Locations and Employees pages", "st": "Open", "kind": "Ours", "owner": "Unassigned", "closes": "", "adds": "", "sum": "191 adds Location, Employee, Vehicle and Third Party subjects. The incident list and incident detail handle all four. The entity pages around them do not, so a district can file these incidents but cannot look at them from the other direction.", "body": "<p>#191 adds Location, Employee, Vehicle and Third Party subjects. The incident list and incident detail handle all four. The entity pages around them do not, so a district can file these incidents but cannot look at them from the other direction.</p>\n<p><strong>1. There is no Locations page, and the affected location is not a real reference.</strong></p>\n<p>Vehicles and Drivers each have a page that lists the entity, shows an incident count, and drills into the incidents behind that count. Locations have neither. A facilities manager cannot ask which depot has the most incidents this year, which is the first question a location subject invites.</p>\n<p>Underneath that, the affected location is captured as a name string rather than a reference to a Student Transportation Location. Vehicles already carry a garage LocationId, so the entity exists and the incident is not using it. Until the affected location is a reference, a Locations page cannot be built, and renaming a location silently orphans every incident that named it.</p>\n<p><strong>2. There is no Employees page.</strong></p>\n<p>Drivers is the only people page and it is drivers-only, organized around certifications and their expiry. An aide, a mechanic, or a supervisor who is the subject of an employee incident has no profile and no incident history, so employee incidents will be filed against people who cannot then be looked up.</p>\n<p>This does not have to be a new page. Broadening Drivers to all employees with a role filter would cover it, and matches how Student Transportation already treats drivers as employees rather than a separate population.</p>\n<p><strong>3. Drill-through from an incident count is a name search, not an identity filter.</strong></p>\n<p>The incident count on the Drivers and Vehicles grids opens the incidents list with the entity&#x27;s name pushed in as a free-text search term. That works well enough for a bus number, but it over-matches on people: two employees sharing a surname return each other&#x27;s incidents, and a location name appearing in any incident description matches too. Every new subject makes this worse, because employee and location incidents are the ones identified by name rather than by a number.</p>\n<p>Acceptance criteria.</p>\n<ul>\n<li>An incident&#x27;s affected location references a Student Transportation Location rather than storing its name.</li>\n<li>A Locations view lists locations with an incident count, and the count opens the incidents behind it.</li>\n<li>Every employee who can be the subject of an employee incident is reachable from a people page, with their incident history.</li>\n<li>Drill-through from any entity&#x27;s incident count returns only incidents involving that entity, matched by identity rather than by name.</li>\n</ul>\n<p>Split out of #191, which owns the subject model itself. The three gaps above are separable and may be worth splitting if they land in different sprints.</p>", "ac": "", "a": ""}, {"g": "New tickets, still open", "n": "#197", "t": "Incident assignments based on new saved \"incident owner\" field in workflow", "st": "Open", "kind": "Ours", "owner": "Unassigned", "closes": "", "adds": "", "sum": "Every incident has an owner from the moment it's created, before any step is in progress.", "body": "<p>Every incident has an owner from the moment it&#x27;s created, before any step is in progress.</p>\n<p>The workflow carries the owner. A workflow names the person its incidents go to, and that person becomes the assignee when an incident is filed against it. A workflow is already chosen by incident type and severity, so one owner per workflow says all of these go to one person in a single setting.</p>\n<p>A workflow with no named person creates the incident unassigned, into the triage queue.</p>\n<p>The named person is checked against active employees. A workflow can&#x27;t point at an inactive or deleted employee. When a named person goes inactive, the workflow&#x27;s owner is cleared, incidents created against it open unassigned, and an administrator is told rather than the condition being discovered later.</p>\n<p>Steps stay role based. A step assigns to one of the five incident roles, so a district can say a disciplinary review goes to the school principal. There&#x27;s no named person on a step. A district that needs one creates a second workflow for that case, which is how a district with one school on its own handling already works.</p>\n<p>Reassign keeps working on the incident. Reassigning an incident never changes the workflow&#x27;s owner.</p>\n<p>Non student subjects carry no school, so no assignment rule depends on school. Employee, vehicle, location and third party incidents route on type and severity alone.</p>\n<p>Acceptance criteria:</p>\n<ul>\n<li>A workflow can name the person its incidents are assigned to.</li>\n<li>Filing an incident against a workflow with a named person assigns the incident to that person.</li>\n<li>Filing an incident against a workflow with no named person creates it unassigned.</li>\n<li>A workflow can&#x27;t be pointed at an inactive or deleted employee.</li>\n<li>When a named person becomes inactive, the workflow&#x27;s owner is cleared and an administrator is notified.</li>\n<li>Reassigning an incident leaves the workflow&#x27;s owner unchanged.</li>\n<li>A step assigns to one of the five incident roles and offers no named person.</li>\n<li>An employee, vehicle, location or third party incident is assigned with no school involved.</li>\n<li>An incident is never created without either an owner or a place in the triage queue.</li>\n</ul>", "ac": "", "a": ""}, {"g": "New tickets, still open", "n": "#200", "t": "Capture Incident datetime (created date) and Incident Occurred (time of incident)", "st": "Open", "kind": "Ours", "owner": "Unassigned", "closes": "", "adds": "", "sum": "An incident is often filed after the fact. A driver finishes the route, and the report gets written that evening or the next morning. The record has to carry the date and time the incident happened, not the moment someone got around to entering it, because every question anyone asks of the data afte", "body": "<p>An incident is often filed after the fact. A driver finishes the route, and the report gets written that evening or the next morning. The record has to carry the date and time the incident happened, not the moment someone got around to entering it, because every question anyone asks of the data afterward is about when it happened.</p>\n<p>The record therefore holds two separate timestamps, and both are visible on the incident.</p>\n<p>Incident date and time. When the incident occurred. Both required.</p>\n<ul>\n<li>The date defaults to the current date.</li>\n<li>The date cannot be set in the future.</li>\n<li>The time starts empty rather than prefilled with the current clock. A prefilled time passes validation while being wrong, which is the exact error this field exists to catch, so the reporter has to enter a value.</li>\n<li>Helper text on the date reads &quot;When the incident occurred, not when you are filing it.&quot;</li>\n<li>Helper text on the time reads &quot;Approximate is fine if the exact time is unknown.&quot;</li>\n</ul>\n<p>Reported date and time. When the record was created. Set by the system, and not editable by any role including Administrator.</p>\n<p>Editing an incident later can correct the incident date and time. The reported values never change.</p>\n<p>Where the incident date is used. Sorting and date filtering on the incidents list, and any report that groups by day, month or term, all use the incident date, because that is what people mean by when it happened. The reported timestamp is a record-keeping value, not a reporting axis.</p>\n<p>Lateness is not a product judgment. There was never a time when incidents were reported at the moment they happened, and what counts as late depends on district policy. The product records both values so a district can answer that against its own policy. Nothing in the interface or in a report flags, badges or counts an incident as late.</p>\n<p>Acceptance criteria:</p>\n<ul>\n<li>An incident cannot be submitted without both an incident date and an incident time.</li>\n<li>The date field arrives defaulted to the current date, and the time field arrives empty.</li>\n<li>Choosing a date in the future is rejected with a clear message.</li>\n<li>The incident record displays the incident date and time and the reported date and time as distinct values.</li>\n<li>No role can edit the reported date and time, verified as Administrator.</li>\n<li>Editing an incident changes the incident date and time and leaves the reported values untouched.</li>\n<li>An incident entered the morning after the event shows the previous day as the incident date and the current day as reported.</li>\n<li>The incidents list sorts and filters on the incident date, not the reported date.</li>\n<li>A report grouped by day or month groups on the incident date.</li>\n<li>Nothing in the interface or in any report describes an incident as late or overdue relative to its reported date.</li>\n</ul>", "ac": "", "a": ""}, {"g": "New tickets, still open", "n": "#202", "t": "New incident types and workflows - covers new incident subject situations", "st": "Open", "kind": "Ours", "owner": "Unassigned", "closes": "", "adds": "", "sum": "Each subject needs its own incident types, and each type needs a workflow to run when an incident is filed against it. The two belong together because a workflow is selected by incident type plus severity, so a type without a workflow files an incident that nothing picks up.", "body": "<p>Each subject needs its own incident types, and each type needs a workflow to run when an incident is filed against it. The two belong together because a workflow is selected by incident type plus severity, so a type without a workflow files an incident that nothing picks up.</p>\n<p>The 20 types, by subject.</p>\n<p>The list offered on the form is filtered to the chosen subject, and Applies To is a column in Admin so the subject of every type is visible and editable. Each type carries a default severity that fills in on the form and stays overridable.</p>\n<p>Student, 6</p>\n<ul>\n<li>Disruptive Behavior, Behavioral, Low</li>\n<li>Safety Violation, Safety, Medium</li>\n<li>Physical Altercation, Aggression / Violence, High</li>\n<li>Property Damage, Property, Medium</li>\n<li>Weapon / Prohibited Items, Prohibited, Critical</li>\n<li>Witness / Bystander Statement, Informational, Low</li>\n</ul>\n<p>Employee, 4</p>\n<ul>\n<li>Employee Altercation, Employee Conduct, High</li>\n<li>Employee Misconduct, Employee Conduct, Medium</li>\n<li>Employee Injury, Safety, High</li>\n<li>Employee Substance Violation, Prohibited, Critical</li>\n</ul>\n<p>Third Party, 4</p>\n<ul>\n<li>Third Party Collision, Collision, High</li>\n<li>Third Party Injury, Safety, High</li>\n<li>Third Party Conduct, Aggression / Violence, High</li>\n<li>Public Complaint, Informational, Low</li>\n</ul>\n<p>Vehicle, 3</p>\n<ul>\n<li>Vehicle Damage, Mechanical, Medium</li>\n<li>Mechanical Failure, Mechanical, Medium</li>\n<li>Single Vehicle Collision, Collision, Medium</li>\n</ul>\n<p>Location, 3</p>\n<ul>\n<li>Location Damage, Location, Medium</li>\n<li>Utility Failure, Location, Medium</li>\n<li>Location Safety Hazard, Location, High</li>\n</ul>\n<p>Ten categories, and why they are drawn this way.</p>\n<p>Behavioral, Safety, Aggression / Violence, Property, Prohibited, Informational, Employee Conduct, Location, Mechanical, Collision.</p>\n<p>Category describes what happened, not who it happened to, because category is what the list filters on and what reports group by. The subject already carries who. Three consequences worth stating, since they look inconsistent until the reason is visible:</p>\n<ul>\n<li>Employee Injury sits under Safety rather than Employee Conduct, so a workplace injury does not appear in a conduct report pulled about that person.</li>\n<li>Employee Substance Violation sits under Prohibited alongside Weapon / Prohibited Items, so a district asking how many substance incidents it had gets one number instead of two split by whether a student or an employee was involved.</li>\n<li>Public Complaint sits under Informational, which keeps a parent phoning in a complaint out of the collision count that goes to leadership and insurance.</li>\n</ul>\n<p>The 12 workflows.</p>\n<p>Every one of the 20 types is covered by exactly one workflow. Selection is by incident type plus severity. Forty-six steps in total.</p>\n<ul>\n<li>WF-001 Disruptive Behavior Response, owner School Principal, 3 steps, Disruptive Behavior at Low</li>\n<li>WF-002 Physical Altercation Response, owner School Principal, 5 steps, Physical Altercation at High</li>\n<li>WF-003 Prohibited Items Response, owner Administrator, 5 steps, Weapon / Prohibited Items at Critical</li>\n<li>WF-004 Property Damage Investigation, owner Administrator, 6 steps, Property Damage at Medium</li>\n<li>WF-005 Safety Violation Response, owner Safety Coordinator, 5 steps, Safety Violation at Medium</li>\n<li>WF-006 Witness / Bystander Statement, owner Safety Coordinator, 1 step, Witness / Bystander Statement at Low</li>\n<li>WF-007 Employee Conduct Review, owner Administrator, 4 steps, Employee Altercation, Employee Misconduct and Employee Substance Violation at Critical, High or Medium</li>\n<li>WF-008 Employee Injury Report, owner Administrator, 3 steps, Employee Injury at Critical, High or Medium</li>\n<li>WF-009 Location Issue Response, owner Administrator, 4 steps, Location Damage, Utility Failure and Location Safety Hazard at any severity</li>\n<li>WF-010 Vehicle Damage and Mechanical Response, owner Fleet Manager, 4 steps, Vehicle Damage, Mechanical Failure and Single Vehicle Collision at any severity</li>\n<li>WF-011 Third Party Incident Response, owner Safety Coordinator, 4 steps, Third Party Collision, Third Party Injury and Third Party Conduct at Critical, High or Medium</li>\n<li>WF-012 Public Complaint Review, owner Safety Coordinator, 2 steps, Public Complaint at Low or Medium</li>\n</ul>\n<p>Routing differs by subject on purpose. Employee and location incidents go to an Administrator rather than a school principal, vehicle incidents to a Fleet Manager, third party incidents to a Safety Coordinator. Every step assigns to one of the five incident roles provisioned by #188, being Administrator, Safety Coordinator, Driver, Fleet Manager and School Principal, so no new roles are needed.</p>\n<p>Each workflow names a required owner role, which is what gives a filed incident an assignee. The mechanics of assignment and routing are covered by Incident assignment and routing (#197); this ticket covers the type and workflow definitions those mechanics run against.</p>\n<p>Acceptance criteria:</p>\n<ul>\n<li>All 20 types exist, each with the category and default severity listed above.</li>\n<li>The type list on the form shows only the types belonging to the chosen subject, verified on all five.</li>\n<li>Admin shows Applies To per type and allows it to be changed.</li>\n<li>Choosing a type fills in its default severity, and the severity remains editable.</li>\n<li>All 12 workflows exist with the owner role and step count listed above.</li>\n<li>Filing an incident on any of the 20 types selects a workflow, with none left unmatched.</li>\n<li>An Employee Injury at High selects WF-008 and not WF-007.</li>\n<li>A Public Complaint selects WF-012 rather than a collision workflow.</li>\n<li>Every step in every workflow assigns to one of the five incident roles.</li>\n<li>A report grouped by category places Employee Injury under Safety and Public Complaint under Informational.</li>\n</ul>", "ac": "", "a": ""}];
const groups = ["Existing tickets, detail added", "New tickets, still open"];
const nav = document.getElementById('nav'), pane = document.getElementById('pane');
groups.forEach(g => {
  const list = items.map((it, i) => ({it, i})).filter(x => x.it.g === g);
  if (!list.length) return;
  const h = document.createElement('div');
  h.className = 'func';
  h.textContent = g + (list.length > 1 ? '  (' + list.length + ')' : '');
  nav.appendChild(h);
  list.forEach(({it, i}) => {
    const b = document.createElement('button');
    b.className = 'ptab'; b.dataset.i = i;
    b.innerHTML = '<span class="dot' + (it.a ? ' need' : '') + '"></span>' +
                  '<span class="num">' + it.n + '</span><span>' + it.t + '</span>';
    b.onclick = () => show(i);
    nav.appendChild(b);
  });
});
function show(i){
  const it = items[i];
  document.querySelectorAll('.ptab').forEach(t => t.classList.toggle('on', t.dataset.i == i));
  const isTicket = it.n.charAt(0) === '#';
  const link = isTicket
    ? '<a href="https://github.com/tyler-technologies/transportation-incidents/issues/' +
      it.n.slice(1) + '" target="_blank">' + it.n + ' on GitHub</a>'
    : '';
  const warn = (it.st === 'No status' || it.st === 'Decision') ? ' warn' : '';
  const kind = it.kind && it.kind !== 'Existing'
    ? '<span class="pill new">' + it.kind + '</span>' : '';
  pane.innerHTML =
    '<p class="eyebrow">' + it.g + '</p>' +
    '<h2>' + it.t + '<span class="pill' + warn + '">' + it.st + '</span>' + kind + '</h2>' +
    (link ? '<p class="meta">' + link + '</p>' : '') +
    '<p class="lbl">In one line</p><p>' + it.sum + '</p>' +
    (it.owner ? '<p class="meta">' + it.owner + '</p>' : '') +
    (it.closes ? '<div class="chg"><p class="lbl">What changed</p><p>' + it.closes + '</p></div>' : '') +
    (it.adds ? '<p class="lbl">What we posted on the ticket</p><div class="ac">' + it.adds + '</div>' : '') +
    (it.body ? '<p class="lbl">The ticket as written</p><div class="body">' + it.body + '</div>' : '') +
    (it.ac ? '<p class="lbl">Acceptance criteria, what QA tests</p><div class="ac">' + it.ac + '</div>' : '') +
    (it.a ? '<div class="ask"><p class="lbl">Needs an answer</p><p>' + it.a + '</p></div>' : '');
  window.scrollTo(0, 0);
}
show(0);
</script>
